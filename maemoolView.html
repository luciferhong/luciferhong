<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매물 웹뷰어</title>
<!--
  루시퍼홍 부동산 도구모음(크롬 확장) "네이버부동산 매물 다운로드"의 웹페이지 출력용 셸.
  데이터는 서버에 저장되지 않고 URL 해시(#d=base64url(gzip(JSON)))로만 전달된다.
  payload: { t: 단지명, at: 생성시각, rows: [[동,매/전,가격,면적,층,향,정보,중개소,에이전트,등록일자,유선,무선], ...] }
  rows 는 확장 엑셀과 동일 — 첫 셀이 "↳"로 시작하면 직전 일반 행(동일매물 그룹 부모)의 하위 매물.
-->
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #dde2e8;
    --text: #23272e; --muted: #6b7684;
    --sale: #d93025; --rent: #1a63c9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; font-size: 14px; }
  header { padding: 14px 18px 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  #meta { color: var(--muted); font-size: 12.5px; }
  input[type=text] { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 10px; font-size: 13px; outline: none; }
  .chips { display: flex; gap: 6px; }
  .chip { padding: 6px 12px; border-radius: 15px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 12.5px; user-select: none; }
  .chip.on { background: #e3efff; border-color: #4a90d9; color: #1a63c9; }
  #summary { padding: 4px 18px 8px; color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  #summary b { color: var(--text); }
  .sale-c { color: var(--sale); } .rent-c { color: var(--rent); }
  main { padding: 0 18px 30px; }
  .tblwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 9px; }
  table { border-collapse: collapse; width: 100%; min-width: 1150px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12.5px;
    position: sticky; top: 0; cursor: pointer; }
  th .arrow { font-size: 10px; margin-left: 3px; }
  tr:hover td { background: #f0f4f8; }
  td.price { font-weight: 600; }
  tr.t-sale td.type { color: var(--sale); font-weight: 700; }
  tr.t-rent td.type { color: var(--rent); font-weight: 700; }
  tr.grp-parent td { cursor: pointer; }
  tr.grp-parent td.first .tri { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
  tr.grp-child td { background: #f7f8fa; }
  tr.grp-child td:first-child { padding-left: 26px; color: var(--muted); }
  tr.grp-child:hover td { background: #eef2f6; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-left: 6px; vertical-align: 1px; }
  .badge-cnt { background: #e3efff; color: #1a63c9; }
  .kar-badge { display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; margin-left: 5px; vertical-align: middle;
    background: #fff3e0; color: #b26a00; border: 1px solid #f0c27a; font-size: 9.5px; font-weight: 600; }
  tr.kar-boundary td { border-top: 2.5px solid #d93025; }
  td.realtor { cursor: pointer; position: relative; }
  td.realtor.hl { background: #ffe873 !important; }
  /* 바로가기 버튼은 absolute — 셀 내용 폭에 포함되지 않아 클릭 시 열 너비가 흔들리지 않음 */
  a.rt-go { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    padding: 1px 8px; border-radius: 9px; background: #1a63c9; color: #fff;
    font-size: 11px; text-decoration: none; box-shadow: 0 0 0 2px #ffe873; }
  a.rt-go:hover { background: #134c9c; }
  #rankPanel tr.rank-row { cursor: pointer; }
  #rankPanel tr.rank-row:hover td { background: #f0f4f8; }
  #rankPanel tr.rank-row.sel td { background: #ffe873 !important; }
  /* 패널 표는 고정 레이아웃 — 긴 중개소명은 말줄임 처리해 가로 스크롤 방지 */
  #rankPanel table { table-layout: fixed; width: 100%; min-width: 0; }
  #rankPanel th, #rankPanel td { overflow: hidden; text-overflow: ellipsis;
    font-size: 13px; padding: 6px 8px; }
  td.feature { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #msg { padding: 40px 18px; text-align: center; color: var(--muted); line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>📦 <span id="title">매물 웹뷰어</span></h1>
  <span id="meta"></span>
  <div class="chips" id="tradeChips">
    <span class="chip on" data-v="">전체</span>
    <span class="chip" data-v="매매">매매</span>
    <span class="chip" data-v="전세">전세</span>
    <span class="chip" data-v="월세">월세</span>
  </div>
  <input type="text" id="searchBox" placeholder="동·정보·중개소 검색" size="18">
  <span class="chip" id="expandAll">모두 펼치기</span>
  <span class="chip" id="xlsxBtn" style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;">
    <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="13" y="4" width="10" height="16" rx="1.5" fill="#9FD5B7"/>
      <rect x="14.5" y="6.5" width="7" height="2" fill="#fff"/>
      <rect x="14.5" y="10" width="7" height="2" fill="#fff"/>
      <rect x="14.5" y="13.5" width="7" height="2" fill="#fff"/>
      <rect x="1" y="2" width="14" height="20" rx="2" fill="#1D6F42"/>
      <path d="M4 7h2.7l1.4 2.6L9.5 7h2.7l-2.8 5 2.8 5H9.5l-1.4-2.6L6.7 17H4l2.8-5z" fill="#fff"/>
    </svg>
    <b>엑셀 다운로드</b>
  </span>
  <span class="chip" id="rankBtn" style="background:#ff7b00;border-color:#ff7b00;color:#fff;font-weight:700;">🏆 매물 많이 올린 부동산 보기</span>
</header>
<div id="summary"></div>
<main>
  <div id="msg">로딩 중…</div>
  <div class="tblwrap" style="display:none">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<script>
const HEADERS = ['동', '매/전', '가격', '면적', '층', '향', '정보', '중개소', '에이전트', '등록일자', '유선', '무선'];
const $ = s => document.querySelector(s);
let rawRows = [];         // 원본 rows (확장 엑셀과 동일 구조) — 엑셀 다운로드용
let viewTitle = '매물';
let complexNo = '';       // 단지번호 (중개소 바로가기용)
let ridMap = {};          // 중개소명 → realtorId
let groups = [];          // [{row, children: [row...]}]
let tradeFilter = '';
let sortKey = -1, sortAsc = true;
const expanded = new Set();

function showMsg(t) { $('#msg').innerHTML = t; $('#msg').style.display = ''; $('.tblwrap').style.display = 'none'; }
const clean = v => String(v || '').replace(/^\s*↳\s*/, '').trim();

// #d= 해시 → base64url → gzip 해제 → JSON
async function loadFromHash() {
  const m = location.hash.match(/[#&]d=([^&]+)/);
  if (!m) {
    showMsg('표시할 데이터가 없습니다.<br>네이버부동산에서 확장 프로그램의 매물 다운로드 → <b>웹페이지로 보기</b>를 사용해 주세요.');
    return;
  }
  if (typeof DecompressionStream === 'undefined') { showMsg('이 브라우저는 지원되지 않습니다 (DecompressionStream 미지원).'); return; }
  const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const data = JSON.parse(await new Response(stream).text());

  document.title = (data.t || '매물') + ' - 매물 웹뷰어';
  $('#title').textContent = data.t || '매물 웹뷰어';
  $('#meta').textContent = data.at ? `생성 ${data.at}` : '';
  rawRows = data.rows || [];
  viewTitle = data.t || '매물';
  complexNo = data.no || '';
  ridMap = data.rids || {};

  // ↳ 행을 직전 일반 행의 하위로 묶어 그룹 재구성 (확장 엑셀과 동일 구조)
  groups = [];
  for (const r of (data.rows || [])) {
    const isChild = String(r[0] || '').trim().startsWith('↳');
    if (isChild && groups.length) groups[groups.length - 1].children.push(r);
    else groups.push({ row: r, children: [] });
  }
  const hr = $('#headRow');
  HEADERS.forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h;
    th.addEventListener('click', () => {
      if (sortKey === i) sortAsc = !sortAsc; else { sortKey = i; sortAsc = true; }
      document.querySelectorAll('th .arrow').forEach(a => a.remove());
      const s = document.createElement('span');
      s.className = 'arrow'; s.textContent = sortAsc ? '▲' : '▼';
      th.appendChild(s);
      render();
    });
    hr.appendChild(th);
  });
  render();
}

function tradeOf(row) { return clean(row[1]); }
function priceNum(s) {
  // "9억 4,000" → 94000 (만원). 정렬용
  s = clean(s).split('~')[0];
  const parts = s.split('억');
  const eok = parseInt(parts[0].replace(/[^0-9]/g, ''), 10);
  const man = parseInt((parts[1] || '').replace(/[^0-9]/g, ''), 10);
  if (parts.length > 1) return (isNaN(eok) ? 0 : eok * 10000) + (isNaN(man) ? 0 : man);
  return isNaN(eok) ? 0 : eok;
}
const karBadge = agent => String(agent || '').includes('한국공인중개사협회') ? '<span class="kar-badge">협회</span>' : '';
// 그룹이 협회(KAR) 구역인지 — 그룹 부모는 에이전트가 비어 있어 하위까지 확인
const isKarGroup = g => [g.row, ...g.children].some(r => String(r[8] || '').includes('한국공인중개사협회'));

let hlRealtor = '';   // 클릭으로 강조 중인 중개소명 (재클릭 시 해제)

function cellsHtml(r, isChild) {
  const tds = [];
  for (let i = isChild ? 2 : 0; i < HEADERS.length; i++) {
    let v = clean(r[i]);
    let cls = i === 2 ? 'price' : (i === 6 ? 'feature' : '');
    let attr = i === 6 ? `title="${v.replace(/"/g, '&quot;')}"` : '';
    let extra = i === 8 ? karBadge(r[i]) : '';
    if (i === 7) {   // 중개소: 클릭 시 같은 중개소 전체 노란 강조 + 네이버 바로가기 버튼
      const hl = v && v === hlRealtor;
      cls = 'realtor' + (hl ? ' hl' : '');
      attr = `data-r="${v.replace(/"/g, '&quot;')}"`;
      if (hl && complexNo && ridMap[v]) {
        extra = `<a class="rt-go" target="_blank" href="https://new.land.naver.com/complexes/${complexNo}?realtorId=${encodeURIComponent(ridMap[v])}">바로가기</a>`;
      }
    }
    tds.push(`<td class="${cls}" ${attr}>${v}${extra}</td>`);
  }
  return tds.join('');
}

function render() {
  const q = $('#searchBox').value.trim().toLowerCase();
  const hit = r => r.some(v => String(v || '').toLowerCase().includes(q));
  let list = groups.slice();

  if (tradeFilter) list = list.filter(g =>
    tradeOf(g.row).includes(tradeFilter) || g.children.some(c => tradeOf(c).includes(tradeFilter)));
  if (q) list = list.filter(g => hit(g.row) || g.children.some(hit));

  if (sortKey >= 0) {
    const numeric = sortKey === 2;
    list.sort((a, b) => {
      const av = numeric ? priceNum(a.row[2]) : clean(a.row[sortKey]);
      const bv = numeric ? priceNum(b.row[2]) : clean(b.row[sortKey]);
      const c = numeric ? av - bv : String(av).localeCompare(String(bv), 'ko');
      return sortAsc ? c : -c;
    });
  }

  const tbody = $('#tbody');
  tbody.innerHTML = '';
  let prevKar = false;   // 일반 → 협회 구역 전환 지점에 빨간 경계선
  list.forEach((g, gi) => {
    const trade = tradeOf(g.row);
    const kar = isKarGroup(g);
    const boundary = kar && !prevKar && gi > 0 ? ' kar-boundary' : '';
    prevKar = kar;
    const cls = (trade.includes('매매') ? 't-sale' : (trade ? 't-rent' : '')) + boundary;
    const tr = document.createElement('tr');
    if (!g.children.length) {
      tr.className = cls;
      tr.innerHTML = `<td class="type first"><span class="tri" style="display:inline-block;width:14px"></span>${clean(g.row[0])}</td>` +
        `<td class="type">${trade}</td>` + cellsHtml(g.row, true);
      tbody.appendChild(tr);
      return;
    }
    // 검색 중이면: 부모가 직접 매칭되지 않은 그룹은 자동으로 펼치고 매칭 하위만 표시
    // (중개소명 등은 하위 행에만 있어, 접힌 채로는 검색 결과가 안 보이기 때문)
    const parentHit = q && hit(g.row);
    const shownChildren = (q && !parentHit) ? g.children.filter(hit) : g.children;
    // 중개소 강조 중이면: 그 중개소 매물이 든 그룹은 강제 펼침 (접힌 채론 강조가 안 보임)
    const hlHit = hlRealtor && g.children.some(c => clean(c[7]) === hlRealtor);
    const key = 'g' + gi + '|' + clean(g.row[0]) + '|' + clean(g.row[2]);
    const open = ((q && !parentHit) || hlHit) ? true : expanded.has(key);
    tr.className = cls + ' grp-parent';
    tr.innerHTML = `<td class="type first"><span class="tri">${open ? '▾' : '▸'}</span>${clean(g.row[0])}` +
      `<span class="badge badge-cnt">동일 ${g.children.length}건${shownChildren.length !== g.children.length ? ` 중 ${shownChildren.length}건 일치` : ''}</span></td>` +
      `<td class="type">${trade}</td>` + cellsHtml(g.row, true);
    tr.addEventListener('click', () => {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      render();
    });
    tbody.appendChild(tr);
    if (open) {
      for (const c of shownChildren) {
        const ctr = document.createElement('tr');
        const ct = tradeOf(c);
        ctr.className = (ct.includes('매매') ? 't-sale' : 't-rent') + ' grp-child';
        ctr.innerHTML = `<td>↳ ${clean(c[0]) || clean(g.row[0])}</td><td class="type">${ct}</td>` + cellsHtml(c, true);
        tbody.appendChild(ctr);
      }
    }
  });

  // 매물 수 = 단독(자식 없는 행) + 그룹 하위 합 (그룹 부모는 대표 표시용)
  let saleCnt = 0, rentCnt = 0, total = 0;
  for (const g of groups) {
    const members = g.children.length ? g.children : [g.row];
    for (const r of members) {
      total++;
      const t = tradeOf(r);
      if (t.includes('매매')) saleCnt++; else if (t.includes('전세')) rentCnt++;
    }
  }
  $('#summary').innerHTML =
    `<span>총 <b>${total}</b>건 (<b class="sale-c">매매 ${saleCnt}</b> · <b class="rent-c">전세 ${rentCnt}</b>)</span>` +
    `<span>표시 ${list.length}줄 (동일매물 묶음)</span>`;
  $('#msg').style.display = 'none';
  $('.tblwrap').style.display = '';
}

$('#searchBox').addEventListener('input', render);
// 중개소 셀 클릭 → 같은 중개소 전체 노란 강조 (재클릭 해제).
// 그룹 부모 행은 중개소가 비어 있어 기존 접기/펼치기 클릭과 충돌하지 않음.
$('#tbody').addEventListener('click', e => {
  if (e.target.closest('a.rt-go')) return;   // 바로가기 클릭은 강조 토글하지 않고 링크만 동작
  const td = e.target.closest('td.realtor');
  if (!td) return;
  const name = td.dataset.r || '';
  if (!name) return;
  hlRealtor = (hlRealtor === name) ? '' : name;
  render();
  syncRankPanelSel();   // 순위 패널이 열려 있으면 선택 상태 동기화
});
$('#tradeChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip || !('v' in chip.dataset)) return;
  document.querySelectorAll('#tradeChips .chip').forEach(c => c.classList.remove('on'));
  chip.classList.add('on');
  tradeFilter = chip.dataset.v;
  render();
});
$('#expandAll').addEventListener('click', () => {
  const anyCollapsed = [...$('#tbody').querySelectorAll('tr.grp-parent .tri')].some(t => t.textContent === '▸');
  if (anyCollapsed) {
    groups.forEach((g, gi) => { if (g.children.length) expanded.add('g' + gi + '|' + clean(g.row[0]) + '|' + clean(g.row[2])); });
    $('#expandAll').textContent = '모두 접기';
  } else {
    expanded.clear();
    $('#expandAll').textContent = '모두 펼치기';
  }
  render();
});
// ── 엑셀 다운로드 (확장 엑셀 출력과 동일 포맷 — SheetJS 는 클릭 시 CDN 지연 로드) ──
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) {
    xlsxLoading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = res;
      s.onerror = () => { xlsxLoading = null; rej(new Error('엑셀 라이브러리 로드 실패 (네트워크 확인)')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoading;
}
$('#xlsxBtn').addEventListener('click', async () => {
  if (!rawRows.length) { alert('다운로드할 데이터가 없습니다.'); return; }
  const btn = $('#xlsxBtn');
  try {
    btn.style.opacity = '.5';
    await loadXLSX();
    const rows = [HEADERS, ...rawRows];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!autofilter'] = { ref: `A1:L${rows.length}` };
    ws['!cols'] = HEADERS.map((_, colIdx) => {
      const maxWidth = rows.reduce((max, row) => Math.max(max, String(row[colIdx] || '').length), 10);
      return { width: maxWidth + 2 };
    });
    XLSX.utils.book_append_sheet(wb, ws, 'Listings');
    XLSX.writeFile(wb, viewTitle + '_매물다운로드.xlsx');
  } catch (e) {
    alert('엑셀 다운로드 실패: ' + e.message);
  } finally {
    btn.style.opacity = '';
  }
});

// ── 매물 많이 올린 부동산 순위 (우측 도킹 패널) ──
// 건수 산정: 단독 매물 + 그룹 하위 매물 (그룹 부모 행은 대표 표시용이라 제외 — 요약 총건수와 동일 기준)
function buildRankData() {
  const stat = new Map();   // 부동산명 → {tel, cell, sale, rent}
  for (const g of groups) {
    const members = g.children.length ? g.children : [g.row];
    const seenInGroup = new Set();   // 같은 동일매물 묶음 안에서 같은 부동산은 1건만 집계
    for (const r of members) {
      const name = clean(r[7]);
      if (!name) continue;
      let s = stat.get(name);
      if (!s) { s = { tel: '', cell: '', sale: 0, rent: 0 }; stat.set(name, s); }
      if (!s.tel) s.tel = clean(r[10]);
      if (!s.cell) s.cell = clean(r[11]);
      const t = tradeOf(r);
      const key = name + '|' + t;
      if (seenInGroup.has(key)) continue;
      seenInGroup.add(key);
      if (t.includes('매매')) s.sale++;
      else if (t.includes('전세')) s.rent++;
    }
  }
  return [...stat.entries()]
    .map(([name, s]) => ({ name, ...s, total: s.sale + s.rent }))
    .sort((a, b) => b.total - a.total || b.sale - a.sale);
}

// 패널·본문의 선택 상태(노란 강조)를 hlRealtor 하나로 동기화
function syncRankPanelSel() {
  const panel = document.getElementById('rankPanel');
  if (!panel) return;
  panel.querySelectorAll('tr.rank-row').forEach(tr => {
    tr.classList.toggle('sel', !!hlRealtor && tr.dataset.name === hlRealtor);
  });
}

$('#rankBtn').addEventListener('click', () => {
  const old = document.getElementById('rankPanel');
  if (old) { old.remove(); return; }
  const ranked = buildRankData();

  const panel = document.createElement('div');
  panel.id = 'rankPanel';
  panel.style.cssText = 'position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;' +
    'background:var(--panel);border-left:1px solid var(--border);z-index:9999;' +
    'box-shadow:-6px 0 22px rgba(0,0,0,.15);overflow:auto;padding:14px 16px;';
  let rowsHtml = '';
  ranked.forEach((r, i) => {
    rowsHtml +=
      `<tr class="rank-row" data-name="${r.name.replace(/"/g, '&quot;')}">` +
      `<td style="color:var(--muted);">${i + 1}</td>` +
      `<td title="${r.name.replace(/"/g, '&quot;')}">${r.name}</td><td>${r.tel}</td><td>${r.cell}</td>` +
      `<td style="color:var(--sale);font-weight:600;">${r.sale}</td>` +
      `<td style="color:var(--rent);font-weight:600;">${r.rent}</td>` +
      `<td><b>${r.total}</b></td></tr>`;
  });
  panel.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:0;background:var(--panel);padding:4px 0 8px;z-index:1;">' +
    `<b>🏆 매물 많이 올린 부동산 (${ranked.length}곳)</b><span style="flex:1"></span>` +
    '<button id="rankClose" style="padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12.5px;">닫기</button></div>' +
    '<table>' +
    '<thead><tr><th style="cursor:default;width:34px;">순위</th><th style="cursor:default;">부동산</th>' +
    '<th style="cursor:default;width:100px;">유선</th><th style="cursor:default;width:104px;">무선</th>' +
    '<th style="cursor:default;width:38px;">매매</th><th style="cursor:default;width:38px;">전세</th>' +
    '<th style="cursor:default;width:38px;">합계</th></tr></thead>' +
    `<tbody>${rowsHtml}</tbody></table>` +
    '<div style="color:var(--muted);font-size:12px;margin-top:10px;">※ 물건수는 현재 아파트에 올린 건수를 의미 (동일매물 묶음 안에 같은 부동산이 여러 건 올려도 1건으로 집계)</div>';
  document.body.appendChild(panel);
  panel.querySelector('#rankClose').addEventListener('click', () => panel.remove());
  // 패널 행 클릭 = 본문 중개소 클릭과 동일 (노란 강조 토글 + 패널 선택 표시)
  panel.querySelector('tbody').addEventListener('click', e => {
    const tr = e.target.closest('tr.rank-row');
    if (!tr) return;
    const name = tr.dataset.name;
    hlRealtor = (hlRealtor === name) ? '' : name;
    render();
    syncRankPanelSel();
  });
  syncRankPanelSel();
});

window.addEventListener('hashchange', () => location.reload());

loadFromHash().catch(e => showMsg('데이터 해석 실패: ' + e.message));
</script>
