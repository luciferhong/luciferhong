<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta name="Yeti" content="noindex, nofollow">
    <meta charset="UTF-8">
    <title>[루시퍼홍] 업무지구 대중교통 원클릭</title>
    <link rel="icon" href="oneclick2.png" type="image/png">

    <style>
        :root {
            --crop-top: 325px; /* iframe 안 카카오맵 상단(로고~이동수단 아이콘)을 잘라 경로 목록부터 표시 */
            --crop-bottom: 150px; /* iframe 안 카카오맵 하단(경로인쇄·즐겨찾기·고객센터)을 잘라낼 높이 */
        }
        .start-group {
            margin-bottom: 18px;
        }
        .start-group-title {
            font-size: 16px;
            font-weight: bold;
            margin: 6px 0;
        }
        .result-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .result {
            position: relative;
            width: 390px !important;
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 8px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            flex: 0 0 auto;
        }
        .result-title {
            font-weight: bold;
            font-size: 14px;
        }
        .result-body {
            position: relative;
            height: 300px;
            overflow: hidden;
            flex: 0 0 auto;
        }
        /* 줄 단위 세로 길이 조절용 드래그 핸들 */
        .row-resize-handle {
            height: 8px;
            cursor: ns-resize;
            background: #e0e0e0;
            border-top: 1px solid #ccc;
            flex: 0 0 auto;
            touch-action: none;
        }
        .row-resize-handle:hover {
            background: #b8c4d8;
        }
        .result-large .row-resize-handle {
            display: none;
        }
        .controls-container {
            display: flex;
            gap: 10px;
            align-items: center;
            gap: 100px;
            margin-bottom: 10px;
        }
        .toggle-container {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .toggle-button {
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f0f0f0;
        }
        .toggle-button.active {
            background-color: #007bff;
            color: #fff;
        }
        .view-large-button {
            padding: 3px 10px;
            background-color: #ED7D31;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .result-frame {
            position: absolute;
            z-index: 1;
            left: 0;
            top: calc(-1 * var(--crop-top));
            width: 100%;
            height: calc(100% + var(--crop-top) + var(--crop-bottom));
        }
        .result-large {
            width: 1200px;
            height: 800px;
            z-index: 1000;
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        /* 크게보기에서는 iframe 영역이 나머지 전체를 채우고, 상단도 자르지 않고 전체 표시 */
        .result-large .result-body {
            height: auto;
            flex: 1 1 auto;
        }
        .result-large .result-frame {
            top: 0;
            height: 100%;
        }
    </style>
</head>
<body>

<div class="controls-container">
    <div class="toggle-container">
        <span class="toggle-button active" id="transitBtn">대중교통</span>
        <span class="toggle-button" id="carBtn">자동차</span>
    </div>
</div>

<div id="startGroups"></div>

<script>
    // 2026-07-30부터 map.naver.com이 X-Frame-Options: DENY로 iframe 삽입을 차단하여 카카오맵으로 전환
    let currentExpandedBox = null;

    const destinations = [
        { id: 'chk1', lat: 37.497951, lng: 127.027636, name: '강남역2호선', code: 222 },
        { id: 'chk2', lat: 37.564719, lng: 126.977022, name: '서울시청역2호선', code: 273 },
        { id: 'chk3', lat: 37.521624, lng: 126.924374, name: '여의도역5호선', code: 526 },
        { id: 'chk9', lat: 37.5723,   lng: 126.9791,   name: '광화문역5호선', code: 560 },
        { id: 'chk4', lat: 37.481339, lng: 126.882734, name: '가산디지털단지역1호선', code: 172 },
        { id: 'chk8', lat: 37.485266, lng: 126.900198, name: '구로디지털단지역2호선', code: 232 },
        { id: 'chk5', lat: 37.394768, lng: 127.111699, name: '판교역신분당선', code: 1914 },
        { id: 'chk6', lat: 37.560143, lng: 126.825231, name: '마곡역5호선', code: 514 },
        { id: 'chk7', lat: 37.576528, lng: 126.898109, name: 'DMC역6호선', code: 618 }
    ];

    let transportMode = 'transit';
    let selectedIds = [];
    let starts = []; // [{lng, lat, name}] — 지점별 출발지 목록

    document.addEventListener('DOMContentLoaded', function () {
        const urlParams = new URLSearchParams(window.location.search);
        transportMode = urlParams.get('mode') || 'transit';

        const selectedDestinations = urlParams.get('selected');
        if (!selectedDestinations) {
            alert('선택된 목적지가 없습니다.');
            return;
        }
        selectedIds = selectedDestinations.split(',').map(id => id.trim());

        // 다중 출발지: starts=lng|lat|이름;lng|lat|이름 (없으면 기존 startX/startY 단일 출발지)
        const startsParam = urlParams.get('starts');
        if (startsParam) {
            starts = startsParam.split(';').map(s => {
                const parts = s.split('|');
                return { lng: parts[0], lat: parts[1], name: parts.slice(2).join('|') || '출발지' };
            }).filter(s => s.lng && s.lat);
        } else if (urlParams.get('startX') && urlParams.get('startY')) {
            starts = [{ lng: urlParams.get('startX'), lat: urlParams.get('startY'), name: '출발지' }];
        }
        if (!starts.length) {
            alert('출발지가 없습니다.');
            return;
        }

        updateToggleButtons(transportMode);
        renderAll();

        document.getElementById('transitBtn').addEventListener('click', () => toggleMode('transit'));
        document.getElementById('carBtn').addEventListener('click', () => toggleMode('car'));
    });

    function toggleMode(mode) {
        transportMode = mode;
        updateToggleButtons(mode);
        renderAll();
    }

    function updateToggleButtons(mode) {
        document.getElementById('transitBtn').classList.toggle('active', mode === 'transit');
        document.getElementById('carBtn').classList.toggle('active', mode === 'car');
    }

    // 지점별 섹션(제목 + 프레임 줄)을 세로로 쌓아서 렌더링
    function renderAll() {
        const root = document.getElementById('startGroups');
        root.innerHTML = '';
        currentExpandedBox = null;
        starts.forEach(start => {
            const group = document.createElement('div');
            group.className = 'start-group';
            if (starts.length > 1) {
                const title = document.createElement('div');
                title.className = 'start-group-title';
                title.textContent = '📍 ' + start.name;
                group.appendChild(title);
            }
            const container = document.createElement('div');
            container.className = 'result-container';
            selectedIds.forEach(id => {
                const dest = destinations.find(d => d.id === id);
                if (dest) container.appendChild(createResultBox(start, dest));
            });
            group.appendChild(container);
            root.appendChild(group);
        });
    }

    function createResultBox(start, dest) {
        const box = document.createElement('div');
        box.className = 'result';

        const header = document.createElement('div');
        header.className = 'result-header';
        const title = document.createElement('span');
        title.className = 'result-title';
        title.textContent = starts.length > 1 ? `${start.name} → ${dest.name}` : dest.name;
        const btn = document.createElement('button');
        btn.className = 'view-large-button';
        btn.textContent = '크게보기';
        btn.onclick = () => toggleLargeView(box);
        header.appendChild(title);
        header.appendChild(btn);

        const body = document.createElement('div');
        body.className = 'result-body';
        const iframe = document.createElement('iframe');
        iframe.className = 'result-frame';
        iframe.setAttribute('frameborder', '0');
        iframe.src = createUrl(start, dest);
        body.appendChild(iframe);

        box.appendChild(header);
        box.appendChild(body);
        attachRowResizeHandle(box);
        return box;
    }

    // 카카오맵 길찾기 URL: /link/by/{car|traffic}/{이름,위도,경도}/{이름,위도,경도} (WGS84)
    function createUrl(start, dest) {
        const by = transportMode === 'car' ? 'car' : 'traffic';
        return `https://map.kakao.com/link/by/${by}/${encodeURIComponent(start.name)},${start.lat},${start.lng}/${encodeURIComponent(dest.name)},${dest.lat},${dest.lng}`;
    }

    // 헤더의 크게보기 버튼으로 확대/원복 토글 (버튼이 iframe 밖에 있어 가려지지 않음)
    function toggleLargeView(box) {
        const btn = box.querySelector('.view-large-button');
        if (box.classList.contains('result-large')) {
            box.classList.remove('result-large');
            box.classList.add('result');
            btn.textContent = '크게보기';
            currentExpandedBox = null;
        } else {
            if (currentExpandedBox) toggleLargeView(currentExpandedBox);
            box.classList.remove('result');
            box.classList.add('result-large');
            btn.textContent = '닫기';
            currentExpandedBox = box;
            // 작은 프레임에서는 지도 영역 크기가 0에 가까워 경로 줌이 안 잡히므로,
            // 큰 크기 기준으로 지도가 다시 초기화되도록 iframe을 리로드
            const iframe = box.querySelector('.result-frame');
            if (iframe.src) iframe.src = iframe.src;
        }
    }

    // 줄 단위 세로 길이 조절: 하단 핸들을 드래그하면 같은 줄의 모든 프레임 높이가 함께 변경 (캡처용)
    function attachRowResizeHandle(box) {
        const handle = document.createElement('div');
        handle.className = 'row-resize-handle';
        handle.title = '드래그하여 이 줄의 세로 길이 조절';
        box.appendChild(handle);
        handle.addEventListener('pointerdown', e => {
            e.preventDefault();
            handle.setPointerCapture(e.pointerId);
            const startY = e.clientY;
            const startH = box.querySelector('.result-body').offsetHeight;
            const rowTop = box.offsetTop;
            const rowBodies = Array.from(document.querySelectorAll('.result'))
                .filter(b => b.style.display !== 'none' && b.offsetTop === rowTop)
                .map(b => b.querySelector('.result-body'));
            const onMove = ev => {
                const h = Math.max(80, startH + (ev.clientY - startY));
                rowBodies.forEach(rb => { rb.style.height = h + 'px'; });
            };
            const onUp = () => {
                handle.removeEventListener('pointermove', onMove);
                handle.removeEventListener('pointerup', onUp);
            };
            handle.addEventListener('pointermove', onMove);
            handle.addEventListener('pointerup', onUp);
        });
    }
</script>

</body>
</html>
