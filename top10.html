<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시기별 TOP10 지도</title>
<style>
html,body{margin:0;height:100%;font-family:'Malgun Gothic',sans-serif}
#map{position:fixed;top:0;left:0;width:100vw;height:100vh}
#panel{position:absolute;top:10px;left:10px;z-index:10;width:400px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:10px}
#panel h3{margin:0 0 6px;font-size:15px}
#panel .sub{font-size:11px;color:#777;margin-bottom:8px}
.sel{display:flex;gap:4px;margin-bottom:8px}
.sel select{flex:1;min-width:0;padding:5px 4px;border:1px solid #ccc;border-radius:6px;font-size:12px;background:#fff}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;padding:6px 0;border:1px solid #ccc;background:#f6f6f6;border-radius:6px;cursor:pointer;font-size:12px}
.tabs .grp{flex:1.7;display:flex;border:1px solid #ccc;border-radius:6px;overflow:hidden;min-width:0}
.tabs .grp:has(button.on){border-color:#1565c0}
.tabs .grp button{border:0;border-radius:0;min-width:0}
.tabs .grp select{border:0;border-left:1px solid #ccc;border-radius:0;background:#fff;font-size:12px;padding:0 2px}
.tabs button.on{color:#fff;border-color:transparent}
.hd{font-weight:bold;font-size:13px;padding:6px 8px;margin-top:8px;background:#f4f4f4}
.row{white-space:nowrap;display:flex;gap:6px;align-items:center;padding:5px 2px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px}
.row:hover{filter:brightness(.95)}
.row .n{flex:none;width:20px;height:20px;border-radius:50%;color:#fff;text-align:center;line-height:20px;font-size:11px;font-weight:bold}
.row .t{flex:1}.row .t b{display:block;width:0;min-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* 단지명만 줄어든다: 이름은 너비 계산에서 빠지고, 동·날짜·층 줄·생활권·가격은 그대로 */
.row .t span{white-space:nowrap;color:#888;font-size:11px}.row .p{flex:none;min-width:84px;text-align:right;font-weight:bold;color:#1a3cff}
.mk{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:bold;font-size:13px;text-align:center;line-height:28px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.iw{padding:8px 10px;font-size:12px;line-height:1.5;min-width:170px}
.nm{display:block;font-size:12px;margin-bottom:8px;cursor:pointer;user-select:none}
.mk-lb{display:inline-block;box-sizing:border-box;white-space:nowrap;font-size:11px;font-weight:bold;line-height:18px;height:18px;padding:0 4px;border-radius:4px;color:#222;border:1px solid rgba(0,0,0,.45);box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.adj{display:flex;gap:4px;margin-bottom:8px}.adj button{flex:1;padding:5px 0;border:1px solid #ccc;background:#f6f6f6;border-radius:6px;cursor:pointer;font-size:12px}
.row .sw{flex:none;width:14px;height:14px;border:1px solid #888;border-radius:3px;cursor:pointer}
#pal{position:fixed;z-index:20000;display:none;background:#fff;border:1px solid #bbb;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3);padding:8px;width:176px}
#pal .pt{font-size:11px;color:#555;margin-bottom:6px}
#pal .pc{display:inline-block;width:22px;height:22px;margin:2px;border:1px solid #888;border-radius:4px;cursor:pointer;vertical-align:top}
#pal .pc:hover{outline:2px solid #1a3cff}
.lg{margin-bottom:8px}.lg .lr{display:flex;align-items:center;gap:6px;margin-bottom:3px}.lg .lc{flex:none;width:18px;height:18px;border:1px solid #888;border-radius:3px}.lg input{flex:1;min-width:0;padding:3px 6px;border:1px solid #ccc;border-radius:5px;font-size:12px}
.row .lv{flex:none;min-width:44px;text-align:center;box-sizing:border-box;white-space:nowrap;font-size:11px;color:#555;background:#fff;border:1px solid #ccc;border-radius:8px;padding:0 6px}
#grip{position:fixed;z-index:11;width:8px;cursor:ew-resize;border-radius:4px;background:transparent}
#grip:hover,#grip.on{background:rgba(26,60,255,.35)}
.empty{padding:14px 4px;color:#888;font-size:12px}
</style></head><body>
<div id="map"></div>
<div id="pal"></div>
<div id="grip" title="끌어서 패널 너비 조절"></div>
<div id="panel">
  <h3>시기별 TOP10 지도</h3>
  <div class="sel"><select id="selSido"></select><select id="selSgg"></select></div>
  <div class="sel"><select id="selBand"><option value="55-64">전용 55~64</option><option value="79-85">전용 79~85</option><option value="all">전체면적</option></select></div>
  <label class="nm"><input type="checkbox" id="chkName"> 이름 표시</label>
  <div class="adj"><button id="btnAdj">라벨 위치조정</button><button id="btnRst">라벨 위치초기화</button></div>
  <div class="adj"><button id="btnColRst">색상 초기화</button></div>
  <div class="lg" id="legend"></div>
  <div class="sub">매매 · 단지별 최고가 · 거래일 기준 기간 · 아래 버튼으로 기간 켜기/끄기 · '직접선택'은 연도를 골라 봅니다</div>
  <div class="tabs" id="tabs"></div><div id="list"></div>
</div>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=9t8y33hyq8"></script>
<script>
/* 데이터: top10_data.json (python _tools/_build_top10_data.py 로 생성·갱신). 시도·시군구를 고르면 그 지역 TOP10 을 그린다. */
var COLORS=['#7b61a8','#2f7d32','#d9480f','#1565c0'];
var LABELS=['2000년대','2010년대','2020년~'];
var ALL=null, DATA=[], on=[], groups=[];
var map=new naver.maps.Map('map',{center:new naver.maps.LatLng(36.5,127.8),zoom:7});
var iw=new naver.maps.InfoWindow({borderWidth:1,anchorSize:new naver.maps.Size(10,10)});
var T=document.getElementById('tabs'),L=document.getElementById('list');
var selSido=document.getElementById('selSido'),selSgg=document.getElementById('selSgg');
var LS='top10map.sel';
/* 왼쪽 패널 너비 조절: 오른쪽 가장자리를 끌면 늘이고 줄인다(너비는 저장) */
var panel=document.getElementById('panel'),grip=document.getElementById('grip');
function placeGrip(){var r=panel.getBoundingClientRect();grip.style.left=(r.right-4)+'px';grip.style.top=r.top+'px';grip.style.height=r.height+'px'}
try{var w0=+localStorage.getItem('top10map.w');if(w0>=220)panel.style.width=w0+'px'}catch(e){}
if(window.ResizeObserver)new ResizeObserver(placeGrip).observe(panel);
window.addEventListener('resize',placeGrip);
grip.onmousedown=function(e){
  e.preventDefault();grip.className='on';
  function mv(ev){var w=Math.max(220,Math.min(innerWidth-160,ev.clientX-30));panel.style.width=w+'px';placeGrip()}
  function up(){grip.className='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    try{localStorage.setItem('top10map.w',parseInt(panel.style.width))}catch(x){}}
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
};
placeGrip();
var chkName=document.getElementById('chkName');
function mkHtml(m){
  return '<div class="mk" style="background:'+COLORS[m.gi%4]+'">'+m.rank+'</div>';
}
/* 단지별 배경색(목록·이름표 공통): 지역 안의 동을 순서대로 파스텔 색에 배정 */
var PAL=['#ffe0e0','#e0f0ff','#e3f6d8','#fff2c2','#ecdcff','#d6f5f0','#ffe3c8','#e8e8e8','#fcd9ec','#dbe4ff','#f1f7c6','#d9efe0'];
var dongCol={},curCode='',LSD='top10map.dong';
var PICK=['#ffffff','#ffcccc','#ffdcb0','#fff29e','#c6efb8','#bfdcff','#e0ccff'];
var LSN='top10map.legend';
function lgGet(){try{return JSON.parse(localStorage.getItem(LSN)||'{}')}catch(e){return {}}}
function lgName(c){return lgGet()[curCode+'|'+c]||''}
/* 맨 위 범례: 배경색마다 '어떤 생활권인지' 직접 적는다(지역별로 저장) */
function buildLegend(){
  var h='';
  PICK.forEach(function(c,k){
    h+='<div class="lr"><span class="lc" style="background:'+c+'"></span><input data-c="'+c+'" placeholder="'+(k?'이 색의 생활권 이름':'(기본·미지정)')+'" value="'+lgName(c).replace(/"/g,'&quot;')+'"></div>';
  });
  var el=document.getElementById('legend');el.innerHTML=h;
  el.oninput=function(e){var c=e.target.getAttribute('data-c');if(!c)return;var o=lgGet();o[curCode+'|'+c]=e.target.value;
    try{localStorage.setItem(LSN,JSON.stringify(o))}catch(x){}refreshLv();};
}
function refreshLv(){ // 가격 옆에 그 단지 배경색에 적어 둔 생활권 이름을 보인다
  groups.forEach(function(g){g.forEach(function(m){
    var n=(dongCol[m.key]&&dongCol[m.key]!=='#ffffff')?lgName(dongCol[m.key]):'';
    var e=m.row.querySelector('.lv');e.textContent=n;e.style.visibility=n?'visible':'hidden';e.style.width='auto'})});
  // 생활권 이름은 잘리지 않게 전부 보이고, 줄이 맞도록 가장 긴 이름에 너비를 통일한다
  var mx=44;
  groups.forEach(function(g){g.forEach(function(m){var e=m.row.querySelector('.lv');if(e.textContent&&m.row.offsetParent)mx=Math.max(mx,e.offsetWidth)})});
  groups.forEach(function(g){g.forEach(function(m){m.row.querySelector('.lv').style.width=mx+'px'})});
}
function dongSaved(){try{return JSON.parse(localStorage.getItem(LSD)||'{}')}catch(e){return {}}}
function dongBg(d){return dongCol[d]||'#fff'}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}}
function lsSet(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}

function render(){
  var b=new naver.maps.LatLngBounds(),any=false;
  groups.forEach(function(g,i){g.forEach(function(m){m.mk.setMap(on[i]?map:null);m.row.style.display=on[i]?'flex':'none'});
    if(on[i])g.forEach(function(m){b.extend(m.pos);any=true});
    document.getElementById('hd'+i).style.opacity=on[i]?1:.35;
    document.getElementById('tg'+i).className=on[i]?'on':'';
    document.getElementById('tg'+i).style.background=on[i]?COLORS[i%4]:'';
    document.getElementById('hd'+i).style.display=on[i]?'block':'none'});
  iw.close();if(any)map.fitBounds(b,{top:60,right:60,bottom:60,left:(panel.offsetWidth+40)});
  layoutLabels();refreshLv();
}

/* 숫자 마커는 실제 위치에 고정한다. 이름표만 별도 마커로 두고, '라벨 위치조정'을 누르면
   이름표끼리·숫자와 겹치지 않도록 이름표만 옮긴다(초기화하면 숫자 오른쪽 기본 위치로). */
var adjusted=true; // 이름표는 기본으로 자동 교정(겹치면 알아서 비킨다)
var meas=document.createElement('span');meas.className='mk-lb';meas.style.cssText='position:absolute;visibility:hidden;left:-999px;top:0';document.body.appendChild(meas);
var wcache={};
function lbSize(m){ // 실제 글자 폭을 재서 겹침 판정이 어긋나지 않게 한다
  if(!(m.name in wcache)){meas.textContent=m.name;wcache[m.name]=meas.getBoundingClientRect().width}
  return {w:Math.ceil(wcache[m.name])+4,h:22};
}
function setLabel(m,ox,oy){ // ox,oy = 이름표 왼쪽 위 모서리의 마커 좌표 기준 화면 오프셋
  m.ox=ox;m.oy=oy;
  m.lb.setIcon({content:'<div class="mk-lb" style="background:'+dongBg(m.key)+'">'+m.name+'</div>',anchor:new naver.maps.Point(-ox,-oy)});
}
function layoutLabels(){
  var proj=map.getProjection();if(!proj)return;
  var vis=[],allv=[],byPos={};
  groups.forEach(function(g,i){g.forEach(function(m){
    m.lb.setMap(null);m.sx=0;m.sy=0;
    if(m.tie){m.tie.setMap(null);m.tie=null}if(m.dot){m.dot.setMap(null);m.dot=null}
    if(!on[i])return;
    allv.push(m);(byPos[m.pk]=byPos[m.pk]||[]).push(m);
  })});
  // 같은 단지가 여러 기간에 있으면 숫자를 옆으로 나란히 2개(3개) 그린다. 이름표는 맨 오른쪽 숫자에만 단다.
  Object.keys(byPos).forEach(function(k){
    var g=byPos[k];g.sort(function(a,b){return a.gi-b.gi});
    g.forEach(function(m,j){
      m.sx=(j-(g.length-1)/2)*28;
    });
    if(chkName.checked){var m=g[g.length-1];m.lb.setMap(map);vis.push(m)}
  });
  // 줌이 멀어져 숫자 원끼리 겹치면 서로 살짝 밀어낸다. 실제 위치에서 MAXD 픽셀 넘게는 못 벗어나게 묶고,
  // 떨어진 숫자는 가는 선과 작은 점으로 진짜 위치를 보여 준다.
  var MIN=30,MAXD=34;
  // 같은 단지(같은 위치)의 숫자들은 한 덩어리로 같이 움직여 항상 같은 높이에 나란히 선다.
  var gs={},gn=0;
  var bp=allv.map(function(m){var o=proj.fromCoordToOffset(m.pos);
    var s=gs[m.pk];if(!s){s=gs[m.pk]={dx:Math.cos(gn*2.4)*0.3,dy:Math.sin(gn*2.4)*0.3};gn++}
    return {x:o.x+m.sx,y:o.y,s:s}});
  for(var it=0;it<80;it++){
    var moved=false;
    for(var a=0;a<bp.length;a++)for(var c=a+1;c<bp.length;c++){
      var A=bp[a],B=bp[c];if(A.s===B.s)continue;
      var vx=(B.x+B.s.dx)-(A.x+A.s.dx),vy=(B.y+B.s.dy)-(A.y+A.s.dy),d=Math.sqrt(vx*vx+vy*vy);
      if(d>=MIN)continue;
      if(d<0.01){vx=1;vy=0;d=1}
      var pu=(MIN-d)/2+0.1;vx/=d;vy/=d;
      A.s.dx-=vx*pu;A.s.dy-=vy*pu;B.s.dx+=vx*pu;B.s.dy+=vy*pu;moved=true;
    }
    Object.keys(gs).forEach(function(k){var s=gs[k],l=Math.sqrt(s.dx*s.dx+s.dy*s.dy);if(l>MAXD){s.dx*=MAXD/l;s.dy*=MAXD/l}});
    if(!moved)break;
  }
  bp.forEach(function(b){b.dx=b.s.dx;b.dy=b.s.dy});
  allv.forEach(function(m,k){
    var b=bp[k];m.sx+=b.dx;m.sy=b.dy;
    m.mk.setIcon({content:mkHtml(m),anchor:new naver.maps.Point(14-m.sx,14-m.sy)});
    var far=Math.sqrt((b.dx*b.dx)+(b.dy*b.dy));
    if(far>12){
      var o=proj.fromCoordToOffset(m.pos);
      m.tie=new naver.maps.Polyline({map:map,path:[m.pos,proj.fromOffsetToCoord(new naver.maps.Point(b.x+b.dx,b.y+b.dy))],strokeColor:COLORS[m.gi%4],strokeWeight:2,strokeOpacity:.8,zIndex:1});
      m.dot=new naver.maps.Marker({position:m.pos,map:map,zIndex:2,clickable:false,icon:{content:'<div style="width:8px;height:8px;border-radius:50%;background:'+COLORS[m.gi%4]+';border:1px solid #fff"></div>',anchor:new naver.maps.Point(5,5)}});
    }
  });
  groups.forEach(function(g){g.forEach(function(m){if(m.arrow){m.arrow.setMap(null);m.arrow=null}})});
  vis.forEach(function(m){setLabel(m,17+m.sx,-9+m.sy)});
  if(!adjusted)return;
  var pts=vis.map(function(m){return proj.fromCoordToOffset(m.pos)});
  var apts=allv.map(function(m){var o=proj.fromCoordToOffset(m.pos);return {x:o.x+m.sx,y:o.y+m.sy}});
  // 숫자 원(지름 28)은 고정 장애물 — 이름표가 덮지 않게 한다
  var placed=[];
  function hit(r){
    for(var k=0;k<placed.length;k++){var q=placed[k];
      if(r.x<q.x+q.w&&r.x+r.w>q.x&&r.y<q.y+q.h&&r.y+r.h>q.y)return true}
    return false;
  }
  var circles=apts.map(function(p){return {x:p.x-15,y:p.y-15,w:30,h:30}});
  placed=circles.slice();
  var order=vis.map(function(_,k){return k}).sort(function(a,b){return vis[a].rank-vis[b].rank||vis[a].gi-vis[b].gi});
  order.forEach(function(k){
    var m=vis[k],p=pts[k],sz=lbSize(m);
    var cand=[];
    for(var ring=0;ring<30;ring++){
      var dy=ring*12;
      var sx=m.sx,sy=m.sy;cand.push([17+sx,-9-dy+sy],[17+sx,-9+dy+sy],[-17-sz.w+sx,-9-dy+sy],[-17-sz.w+sx,-9+dy+sy],[-sz.w/2+sx,-34-dy+sy],[-sz.w/2+sx,18+dy+sy]);
    }
    var pick=cand[0];
    for(var c=0;c<cand.length;c++){
      var r={x:p.x+cand[c][0],y:p.y+cand[c][1],w:sz.w,h:sz.h};
      if(!hit(r)){pick=cand[c];break}
    }
    placed.push({x:p.x+pick[0],y:p.y+pick[1],w:sz.w,h:sz.h});
    setLabel(m,pick[0],pick[1]);
    // 기본 자리(숫자 오른쪽)에 못 두고 떨어진 이름표는 숫자 쪽으로 화살표를 이어 준다
    if(pick!==cand[0]){
      var cx=p.x+pick[0]+sz.w/2,cy=p.y+pick[1]+sz.h/2;
      var from=proj.fromOffsetToCoord(new naver.maps.Point(cx,cy));
      m.arrow=new naver.maps.Polyline({map:map,path:[from,proj.fromOffsetToCoord(new naver.maps.Point(p.x+m.sx,p.y+m.sy))],strokeColor:'#444',strokeWeight:1.5,strokeOpacity:.85,zIndex:5,
        endIcon:naver.maps.PointingIcon.OPEN_ARROW,endIconSize:10});
    }
  });
}
naver.maps.Event.addListener(map,'zoom_changed',function(){setTimeout(layoutLabels,0)});
naver.maps.Event.addListener(map,'click',function(){iw.close()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')iw.close()});

/* 지역을 바꿀 때: 이전 마커·선·목록을 모두 지우고 새로 만든다 */
function clearAll(){
  groups.forEach(function(g){g.forEach(function(m){
    m.mk.setMap(null);m.lb.setMap(null);if(m.arrow)m.arrow.setMap(null);if(m.tie)m.tie.setMap(null);if(m.dot)m.dot.setMap(null)})});
  groups=[];on=[];DATA=[];T.innerHTML='';L.innerHTML='';iw.close();
}
var curYear=0;
function itemsFor(code,key){
  var arr=(ALL.s[code]||{})[key]||[],rg0=ALL.regions[code]||{name:''};
  return arr.map(function(a,k){var ap=ALL.apts[a[0]]||['','',0,0,''],all=/\(전체\)$/.test(rg0.name);
    return {rank:k+1,name:ap[0],dong:(all&&ap[5]?ap[5]+' ':'')+ap[1],lat:ap[2],lng:ap[3],year:ap[4],price:a[1],won:wonStr(a[1]),date:a[2],floor:a[3],area:a[4]}});
}
function wonStr(m){var e=Math.floor(m/10000),r=m%10000;return e&&r?e+'억'+r.toLocaleString('en-US')+'만':e?e+'억':r.toLocaleString('en-US')+'만'}
function build(code,keepOn){
  var prevOn=on.slice();
  clearAll();
  var rg=ALL.regions[code];if(!rg)return;
  if(!curYear){var sy=+(lsGet().year||0);curYear=(sy>=2000&&sy<=ALL.thisYear)?sy:ALL.thisYear}
  var labs=LABELS.concat([curYear+'년']);
  DATA=labs.map(function(lb,i){return {label:lb,items:itemsFor(code,i<3?'p'+i:'y'+curYear)}});
  // 지역·면적을 열 때마다 2020~ 만 켠다(연도만 바꿀 때는 켜 둔 상태 유지)
  on=DATA.map(function(d,i){return keepOn&&prevOn.length?prevOn[i]:i===2});
  groups=DATA.map(function(){return []});
  var wraps=[];var total=0;dongCol={};curCode=code;buildLegend();var sv=dongSaved();
  DATA.forEach(function(d,i){
    total+=d.items.length;
    var bt=document.createElement('button');bt.id='tg'+i;bt.textContent=i===3?'직접선택':d.label;bt.onclick=function(){on[i]=!on[i];render()};var grp=null;if(i===3){grp=document.createElement('div');grp.className='grp';grp.appendChild(bt);T.appendChild(grp)}else T.appendChild(bt);
    if(i===3){var ys=document.createElement('select');ys.id='selYear';ys.title='연도 선택';ys.style.cssText='flex:none';
      for(var y=ALL.thisYear;y>=2000;y--){var op=document.createElement('option');op.value=y;op.textContent=y+'년';ys.appendChild(op)}
      ys.value=curYear;ys.onchange=function(){curYear=+ys.value;var o=lsGet();o.year=curYear;lsSet(o);build(curCode,true)};grp.appendChild(ys)}
    var h=document.createElement('div');h.id='hd'+i;h.className='hd';h.style.borderLeft='5px solid '+COLORS[i%4];h.textContent=d.label;var wr=document.createElement('div');wraps[i]=wr;wr.appendChild(h);
    d.items.forEach(function(it){
      var pos=new naver.maps.LatLng(it.lat,it.lng);
      var mk=new naver.maps.Marker({position:pos,map:map,zIndex:100-it.rank+i});
      var lb=new naver.maps.Marker({position:pos,map:null,zIndex:50,clickable:false});
      function open(){iw.setContent('<div class="iw"><b>['+d.label+'] '+it.rank+'위 '+it.name+'</b><br>'+it.won+' <span style="color:#888">('+it.date+' · '+it.floor+'층'+(it.area?' · 전용 '+it.area+'㎡':'')+')</span><br>'+it.dong+(it.year?' · '+it.year+'년 입주':'')+'</div>');iw.open(map,mk)}
      naver.maps.Event.addListener(mk,'click',function(){if(iw.getMap()&&iw.getPosition&&iw.__mk===mk){iw.close();iw.__mk=null}else{open();iw.__mk=mk}});
      var r=document.createElement('div');r.className='row';var key=i+'|'+it.name;dongCol[key]=sv[code+'|'+key]||'#ffffff';r.style.background=dongBg(key);
      r.innerHTML='<span class="sw" title="배경색 고르기" style="background:'+dongBg(key)+'"></span><div class="n" style="background:'+COLORS[i%4]+'">'+it.rank+'</div><div class="t"><b>'+it.name+'</b><span>'+it.dong+' · '+it.date+' · '+it.floor+'층'+(it.area?' · '+it.area+'㎡':'')+'</span></div><span class="lv"></span><div class="p">'+it.won+'</div>';
      r.onclick=function(e){if(e.target.className==='sw'){e.stopPropagation();openPal(e.target,key,it.name);return}map.panTo(pos);open()};wr.appendChild(r);
      var gm={mk:mk,lb:lb,pos:pos,row:r,gi:i,rank:it.rank,name:it.name,pk:it.lat+','+it.lng,sx:0,key:key,ox:17,oy:-9,arrow:null};
      mk.setIcon({content:mkHtml(gm),anchor:new naver.maps.Point(14,14)});
      groups[i].push(gm);
    });
  });
  for(var wi=wraps.length-1;wi>=0;wi--)L.appendChild(wraps[wi]); // 목록은 최신 연도부터
  refreshLv();
  if(!total){L.innerHTML='<div class="empty">이 지역에는 선택한 면적의 매매 거래 자료가 없습니다.</div>';return}
  render();
}

/* 단지별 배경색 고르기: 목록의 색 네모를 누르면 팔레트가 뜨고, 고른 색은 그 동 전체(목록·이름표)에 적용·저장 */
var pal=document.getElementById('pal');
function openPal(el,key,nm){
  pal.innerHTML='<div class="pt">'+nm+' 배경색</div>'+PICK.map(function(c){return '<span class="pc" title="'+lgName(c)+'" data-c="'+c+'" style="background:'+c+'"></span>'}).join('');
  var r=el.getBoundingClientRect();
  pal.style.display='block';
  pal.style.left=Math.min(r.left,innerWidth-190)+'px';
  pal.style.top=Math.min(r.bottom+4,innerHeight-pal.offsetHeight-6)+'px';
  pal.onclick=function(e){var c=e.target.getAttribute('data-c');if(!c)return;
    dongCol[key]=c;var sv=dongSaved();sv[curCode+'|'+key]=c;try{localStorage.setItem(LSD,JSON.stringify(sv))}catch(x){}
    groups.forEach(function(g){g.forEach(function(m){if(m.key!==key)return;
      m.row.style.background=c;m.row.querySelector('.sw').style.background=c;setLabel(m,m.ox,m.oy)})});refreshLv();
    pal.style.display='none'};
}
document.addEventListener('mousedown',function(e){if(pal.style.display==='block'&&!pal.contains(e.target)&&e.target.className!=='sw')pal.style.display='none'});

/* 시도 → 시군구 선택 */
function fillSido(){
  var set={};Object.keys(ALL.regions).forEach(function(c){set[ALL.regions[c].sido]=1});
  var names=Object.keys(set).sort();
  selSido.innerHTML=names.map(function(s){return '<option>'+s+'</option>'}).join('');
}
function fillSgg(){
  var s=selSido.value,list=Object.keys(ALL.regions).filter(function(c){return ALL.regions[c].sido===s});
  list.sort(function(a,b){return ALL.regions[a].name<ALL.regions[b].name?-1:1});
  selSgg.innerHTML=list.map(function(c){return '<option value="'+c+'">'+ALL.regions[c].name.replace(s+' ','')+'</option>'}).join('');
}
chkName.checked=!!lsGet().name;
chkName.onchange=function(){var o=lsGet();o.name=chkName.checked;lsSet(o);layoutLabels()};
document.getElementById('btnAdj').onclick=function(){adjusted=true;layoutLabels()};
document.getElementById('btnColRst').onclick=function(){
  if(!confirm('이 지역의 배경색을 모두 흰색으로 되돌릴까요?'))return;
  var sv=dongSaved();Object.keys(sv).forEach(function(k){if(k.indexOf(curCode+'|')===0)delete sv[k]});
  try{localStorage.setItem(LSD,JSON.stringify(sv))}catch(x){}
  groups.forEach(function(g,i){g.forEach(function(m){dongCol[m.key]='#ffffff';m.row.style.background='#ffffff';m.row.querySelector('.sw').style.background='#ffffff';setLabel(m,m.ox,m.oy)})});refreshLv();
};
document.getElementById('btnRst').onclick=function(){adjusted=false;layoutLabels()};
selSido.onchange=function(){fillSgg();selSgg.onchange()};
selSgg.onchange=function(){var o=lsGet();o.sido=selSido.value;o.sgg=selSgg.value;lsSet(o);build(selSgg.value)};

var bandCache={};
function loadBand(b){
  if(bandCache[b])return Promise.resolve(bandCache[b]);
  return fetch('https://sise-cloud.luciferhong.com/pub/top10?band='+b).then(function(r){return r.json()}).then(function(j){bandCache[b]=j;return j});
}
var selBand=document.getElementById('selBand');
selBand.value=lsGet().band||'79-85';
function applyBand(first){
  loadBand(selBand.value).then(function(j){
    ALL=j;var sv=lsGet(),keep=curCode&&ALL.regions[curCode]?curCode:(sv.sgg&&ALL.regions[sv.sgg]?sv.sgg:null);
    fillSido();
    // 마지막으로 본 지역을 복원(없으면 수원시 권선구, 그것도 없으면 첫 지역)
    var code=keep||(ALL.regions['4111300000']?'4111300000':Object.keys(ALL.regions)[0]);
    selSido.value=ALL.regions[code].sido;fillSgg();selSgg.value=code;
    build(code);
  }).catch(function(e){L.innerHTML='<div class="empty">집계 데이터를 읽지 못했습니다. 잠시 후 다시 시도해 주세요. ('+e.message+')</div>'});
}
selBand.onchange=function(){var o=lsGet();o.band=selBand.value;lsSet(o);applyBand()};
applyBand(true);
</script></body></html>
