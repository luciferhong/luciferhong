<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta name="Yeti" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강남 거리 지도</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23162033'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-size='24' font-family='Malgun Gothic,Noto Sans KR,sans-serif' font-weight='700' fill='white'%3E%EA%B0%95%EB%82%A8%3C/text%3E%3C/svg%3E" />
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=9t8y33hyq8"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ─── 모바일: 스크롤 레이아웃 ─── */
    @media (max-width: 768px) {
      html, body {
        height: auto;
        overflow: auto;
      }
      body {
        height: auto;
        min-height: 100vh;
      }
      #map {
        height: 90vh !important;
        min-height: 400px !important;
        flex: none !important;
      }
      #distanceSummary {
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      /* 거리재기+반경재기 뺄 줄: 지점3 다음줄에 가로로 나란히 */
      #measureBtns {
        width: 100%;
        flex-direction: row;
      }
    }

    /* ─── 상단 패널 ─── */
    #panel {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }

    #panel h2 {
      width: 100%;
      margin: 0 0 4px;
      font-size: 17px;
      color: #1a1a2e;
    }

    /* 아파트 선택 카드 */
    .apt-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f9f9f9;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 240px;
      max-width: 320px;
      flex: 1;
      position: relative;
    }
    .apt-card.apt1 { border-color: #2D5DA7; }
    .apt-card.apt2 { border-color: #E97132; }
    .apt-card.apt3 { border-color: #e91e8c; }

    .apt-card-label {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .color-dot {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .apt-card.apt1 .apt-card-label { color: #2D5DA7; }
    .apt-card.apt2 .apt-card-label { color: #E97132; }
    .apt-card.apt3 .apt-card-label { color: #e91e8c; }

    .apt-card input[type=text] {
      width: 100%;
      height: 32px;
      padding: 4px 8px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 14px;
    }
    .apt-card input[type=text]:focus { outline: none; border-color: #2D5DA7; }

    /* 선택된 아파트 표시 */
    .apt-selected {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .apt-findway-btn {
      margin-left: auto;
      flex-shrink: 0;
      background: #1a6e3c;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.5;
    }
    .apt-findway-btn:hover { background: #155c32; }
    .apt-selected .apt-dist {
      display: inline-block;
      margin-left: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #e67e22;
    }

    .apt-clear-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px; height: 22px;
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .apt-card.has-selection .apt-clear-btn { display: flex; }

    /* ─── 검색 드롭다운 — hongbutest 아파트 검색 자동완성과 같은 모양(2026-10-29 통일) ─── */
    .search-results {
      position: fixed;
      background: #fff;
      border: 1px solid #ccc;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,.1);
      z-index: 99999;
      width: 500px;
      max-width: calc(100vw - 16px);
      display: none;
    }

    .search-result-item {
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12.5px;
      background: #fff;
      transition: background-color 0.12s ease;
    }
    .search-result-item:hover { background-color: #fdf1e8; }
    .search-result-item:active { background-color: #fadfc9; }
    .search-result-item strong { color: #a83c12; font-weight: 700; }
    .search-result-meta {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 3px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .search-result-meta span {
      background: #f1f5f9;
      color: #475569;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid #e2e8f0;
    }
    .search-result-meta span.dist { color: #0066cc; font-weight: 600; }
    .highlight { background-color: #ffeb3b; font-weight: 600; }

    /* ─── 거리 요약 배너 ─── */
    #distanceSummary {
      display: none;
      align-items: center;
      gap: 20px;
      padding: 8px 16px;
      background: linear-gradient(90deg, #1a1a2e, #2D5DA7);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      flex-wrap: wrap;
    }
    #distanceSummary .ds-item { display: flex; align-items: center; gap: 6px; }
    #distanceSummary .ds-val { font-size: 18px; font-weight: 800; color: #ffe066; }

    /* ─── 지도 ─── */
    #map { width: 100%; flex: 1 1 0; min-height: 0; }

    /* ─── 아파트 마커 (hongbutest 스타일) ─── */
    .apartment-marker-container {
      display: inline-block;
      width: max-content;
      border-radius: 6px;
      border: 2px solid #000;
      box-shadow: 2px 2px 5px rgba(0,0,0,.3);
      white-space: nowrap;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .apartment-name-marker {
      background: #fff;
      color: #000;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 3px 3px 0 0;
      white-space: nowrap;
    }
    .apartment-details-marker {
      font-size: 12px;
      padding: 2px 8px;
      white-space: nowrap;
      border-radius: 0 0 3px 3px;
    }

    /* 강남역 마커 */
    .gangnam-marker {
      background: #f0c000;
      color: #000;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid #c9a000;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      white-space: nowrap;
      cursor: default;
    }

    /* ─── 우클릭 컨텍스트 메뉴 ─── */
    #mapContextMenu {
      position: fixed;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.22);
      z-index: 999999;
      display: none;
      min-width: 190px;
      overflow: hidden;
      user-select: none;
    }
    .ctx-menu-header {
      padding: 8px 14px;
      background: #1a1a2e;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .ctx-menu-coords {
      padding: 5px 14px;
      font-size: 11px;
      color: #888;
      background: #f8f8f8;
      border-bottom: 1px solid #eee;
    }
    .ctx-menu-item {
      padding: 11px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .12s;
    }
    .ctx-menu-item:last-child { border-bottom: none; }
    .ctx-menu-item:hover { background: #eef4ff; }
    .ctx-menu-item.ctx-apt1 { color: #2D5DA7; }
    .ctx-menu-item.ctx-apt2 { color: #E97132; }
    .ctx-menu-subheader {
      padding: 6px 14px 3px;
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: .5px;
      text-transform: uppercase;
      background: #fafafa;
    }
    /* 체크박스 항목 */
    .ctx-dest-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 12px;
      cursor: pointer;
      font-size: 13px;
      color: #1a6e3c;
      border-bottom: 1px solid #f4f4f4;
    }
    .ctx-dest-item:last-of-type { border-bottom: none; }
    .ctx-dest-item:hover { background: #e8f8ee; }
    .ctx-dest-item input[type=checkbox] {
      width: 15px; height: 15px;
      accent-color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ctx-dest-item label { cursor: pointer; user-select: none; }
    /* 길찾기 푸터 버튼 */
    .ctx-fw-footer {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: #f9f9f9;
      border-top: 1px solid #e8e8e8;
    }
    .ctx-fw-btn {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .ctx-fw-btn-go     { background: #27ae60; color: #fff; }
    .ctx-fw-btn-go:hover { background: #1e8449; }
    .ctx-fw-btn-all    { background: #eee; color: #333; }
    .ctx-fw-btn-all:hover { background: #ddd; }

    /* 토스트 메시지 */
    #fwToast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30,30,30,.88);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999999;
      opacity: 0;
      transition: opacity .2s;
    }
    #fwToast.show { opacity: 1; }

    /* ─── 이의의 오버레이 (iframe) ─── */
    #findwayOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,.75);
      z-index: 9999999;
      display: none;
      justify-content: center;
      align-items: center;
    }
    #findwayClose {
      position: absolute;
      top: 8px; right: 14px;
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      z-index: 1;
    }
    #findwayIframe {
      width: calc(100% - 40px);
      height: calc(100% - 20px);
      border: none;
      border-radius: 8px;
    }

    /* 지도 선택 핀 마커 */
    .map-pin-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .map-pin-label {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      padding: 3px 8px;
      border-radius: 10px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      pointer-events: auto;
      cursor: pointer;
    }
    .map-pin-rename-btn {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,30,30,0.88);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
      cursor: pointer;
      display: none;
      pointer-events: auto;
      user-select: none;
      z-index: 10;
    }
    .map-pin-rename-btn::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -6px;
      right: -6px;
      height: 8px;
    }
    .map-pin-rename-btn:hover { background: rgba(0,0,0,1); }
    .map-pin-marker { position: relative; }
    .map-pin-marker:hover .map-pin-rename-btn { display: block; }
    .map-pin-arrow {
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }

    /* ─── 거리재기 ─── */
    #rulerBtn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 2px solid #888;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: #444;
      cursor: pointer;
      white-space: nowrap;
      align-self: center;
      transition: background .15s, color .15s, border-color .15s;
    }
    #rulerBtn.active {
      background: #1a1a2e;
      color: #fff;
      border-color: #1a1a2e;
    }
    #rulerClearAll {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 2px solid #c0392b;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: #c0392b;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    #rulerClearAll:hover {
      background: #c0392b;
      color: #fff;
    }
    /* ─── 반경재기 ─── */
    #radiusBtn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 2px solid #888;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: #444;
      cursor: pointer;
      white-space: nowrap;
      align-self: center;
      transition: background .15s, color .15s, border-color .15s;
    }
    #radiusBtn.active {
      background: #1a1a2e;
      color: #fff;
      border-color: #1a1a2e;
    }
    #radiusClearAll {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 2px solid #c0392b;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: #c0392b;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    #radiusClearAll:hover { background: #c0392b; color: #fff; }
    body.radius-mode #map { cursor: crosshair !important; }
    .radius-pin {
      width: 10px; height: 10px;
      background: #4CAF50;
      border: 2px solid #388E3C;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(76,175,80,.35);
    }
    /* 반경 색상 선택 팝업 */
    #circleColorPicker {
      display: none;
      position: fixed;
      z-index: 3000;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      padding: 10px;
      flex-direction: column;
      gap: 8px;
    }
    .circle-color-row { display: flex; gap: 6px; }
    .circle-color-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(0,0,0,.15);
      transition: transform .1s, box-shadow .1s;
    }
    .circle-color-swatch:hover { transform: scale(1.2); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    #circleColorCustom {
      width: 100%; height: 28px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      padding: 0 2px;
    }
    /* 지도 커서: 거리재기 모드 */
    body.ruler-mode #map { cursor: crosshair !important; }
    .ruler-pin {
      width: 10px; height: 10px;
      background: #f0c000;
      border: 2px solid #c9a000;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(240,192,0,.35);
    }

    /* ─── 업무지구 비교표 (지도 오른쪽 위, body 직속 fixed) ─── */
    #cmpPanel {
      display: none;
      position: fixed;
      z-index: 2000;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      font-size: 12px;
      color: #222;
      overflow: hidden;
      flex-direction: column;
      width: max-content;
    }
    /* 머리 줄은 표 폭을 넓히지 않는다(width 0 + min-width 100%) — 좁으면 줄바꿈 */
    #cmpHead {
      width: 0; min-width: 100%; box-sizing: border-box;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 7px 10px;
      background: #1a1a2e; color: #fff;
      font-weight: 700; font-size: 13px;
    }
    #cmpHead .cmp-title { flex: 1 1 auto; }
    #cmpHead select, #cmpHead input {
      font-size: 12px; padding: 1px 2px; border-radius: 4px; border: 1px solid #889;
    }
    #cmpHead button {
      background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
      border-radius: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer;
    }
    #cmpBody { overflow-x: hidden; overflow-y: auto; } /* 가로 스크롤 금지 — 폭은 place() 가 맞춘다 */
    #cmpPanel.collapsed #cmpBody { display: none; }
    /* 열 폭: 지점 열은 가장 넓은 열에 맞춰 통일(상한 240px, 넘으면 칸 안에서 줄바꿈) — render() 가 재서 준다.
       홍부 강남km 비교표와 같은 규칙(2026-10-28 사용자 지정) */
    #cmpTable { border-collapse: collapse; table-layout: fixed; }
    #cmpTable td { white-space: nowrap; } /* 칸 안 줄바꿈 없음 — 열 폭은 내용에 맞춘다 */
    #cmpTable.measure { table-layout: auto; width: auto !important; }
    #cmpTable.measure th, #cmpTable.measure td { white-space: nowrap; }
    #cmpTable th, #cmpTable td {
      border-bottom: 1px solid #eef0f3;
      box-sizing: border-box; /* render() 가 잰 offsetWidth(여백 포함)를 그대로 폭으로 준다 */
      padding: 4px 10px;
      vertical-align: middle;
      text-align: left;
    }
    #cmpTable thead th {
      position: sticky; top: 0; z-index: 1;
      background: #f7f8fa;
    }
    #cmpTable thead th:first-child, #cmpTable tbody th {
      color: #555; font-weight: 700; background: #f7f8fa; white-space: nowrap;
    }
    #cmpTable tbody th { vertical-align: middle; }
    #cmpTable tbody th .cmp-sub { display: block; font-weight: 400; color: #999; font-size: 10.5px; }
    .cmp-col-head { display: flex; align-items: center; gap: 5px; }
    .cmp-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 5px;
      color: #fff; font-weight: 700; font-size: 11px; flex-shrink: 0;
    }
    .cmp-apt-name { font-weight: 700; font-size: 13px; color: #111; }
    .cmp-apt-meta { font-weight: 400; font-size: 11px; color: #888; margin-top: 2px; }
    .cmp-min { font-size: 16px; font-weight: 800; color: #2D5DA7; }
    .cmp-min.slow { color: #8a8f98; }
    .cmp-best { background: #fff6d6; }
    .cmp-route { color: #666; font-size: 11px; margin-top: 2px; line-height: 1.35; }
    .cmp-line {
      display: inline-block; padding: 0 4px; border-radius: 3px;
      color: #fff; font-size: 10.5px; font-weight: 700; line-height: 15px;
    }
    .cmp-walk { background: #eef0f3; color: #555; font-weight: 600; }
    .cmp-muted { color: #aaa; }
    @media (max-width: 768px) {
      /* 폰: 지도 아래에 흐름대로 놓고 가로 스크롤 */
      #cmpPanel {
        position: static !important;
        width: auto !important; max-height: none !important;
        margin: 8px;
      }
    }
  </style>
</head>
<body>

<!-- 상단 패널 -->
<div id="panel">

<script>
// ─── 강남역 좌표 ───
const GANGNAM = { lat: 37.49796, lng: 127.02762, name: '강남역' };

// ─── 전역 상태 ───
let apartmentData = [];
let map;
let gangnamMarker;
let selectedApt = [null, null, null]; // [apt1, apt2, apt3]
let aptMarkers = [null, null, null];
let polylines = [null, null, null];
let distanceLabels = [null, null, null];
const LABEL_PREFIXES = ['🔵 ', '🟠 ', '🟣 '];
let customLabels = ['지점 1', '지점 2', '지점 3'];
let markerZoomState = null; // { idx, prevCenter, prevZoom }

// ─── 색상 (apt1=파랑, apt2=빨강, apt3=보라) ───
const COLORS = ['#2D5DA7', '#E97132', '#e91e8c'];

// ─── Haversine 직선거리(km) ───
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ─── 연도 → 마커 배경색 (hongbutest 스타일) ───
function yearToBg(yearStr) {
  const y = parseInt((yearStr || '').slice(-2), 10);
  if (isNaN(y)) return '#FFFA00';
  if (y > 50) return '#5C6267';
  if (y >= 20) return '#3E24D7';
  if (y >= 10) return '#EE1A24';
  return '#FFFA00';
}
function yearToFg(yearStr) {
  const y = parseInt((yearStr || '').slice(-2), 10);
  return (!isNaN(y) && y >= 0 && y < 10) ? '#000' : '#fff';
}

// ─── 마커 DOM 생성 (hongbutest 스타일) ───
function createAptMarkerEl(apt, idx) {
  const bg = COLORS[idx];

  // 지도 클릭으로 등록된 커스텀 핀
  if (apt.isCustom) {
    const wrap = document.createElement('div');
    wrap.className = 'map-pin-marker';
    const label = document.createElement('div');
    label.className = 'map-pin-label';
    label.style.backgroundColor = bg;
    label.style.display = 'flex';
    label.style.alignItems = 'center';
    label.style.gap = '2px';

    // 고정 이모지/닷 (삭제 불가)
    const prefix = document.createElement('span');
    if (idx === 0) {
      prefix.textContent = '\uD83D\uDD35 ';
    } else {
      prefix.style.display = 'inline-block';
      prefix.style.width = '10px';
      prefix.style.height = '10px';
      prefix.style.borderRadius = '50%';
      prefix.style.background = 'rgba(255,255,255,0.9)';
      prefix.style.border = '2px solid rgba(255,255,255,0.5)';
      prefix.style.flexShrink = '0';
      prefix.style.marginRight = '2px';
    }
    prefix.style.userSelect = 'none';
    prefix.style.flexShrink = '0';
    prefix.contentEditable = 'false';

    // 텍스트 (읽기 전용, 이름변경 버튼으로만 편집)
    const editSpan = document.createElement('span');
    editSpan.style.outline = 'none';
    editSpan.style.minWidth = '20px';
    editSpan.textContent = customLabels[idx];

    // mousedown/mouseup 막아 지도 드래그 방지 (click은 통과 → 줌 토글)
    ['mousedown', 'mouseup'].forEach(ev =>
      label.addEventListener(ev, e => e.stopPropagation()));

    label.appendChild(prefix);
    label.appendChild(editSpan);

    // 이름변경 버튼 (호버 시 표시)
    const renameBtn = document.createElement('div');
    renameBtn.className = 'map-pin-rename-btn';
    renameBtn.textContent = '✏️ 이름변경';
    renameBtn.addEventListener('mousedown', e => e.stopPropagation());
    renameBtn.addEventListener('mouseup',   e => e.stopPropagation());
    renameBtn.addEventListener('click', e => {
      e.stopPropagation();
      const newName = prompt('지점 이름을 입력하세요:', customLabels[idx]);
      if (newName !== null && newName.trim()) {
        customLabels[idx] = newName.trim();
        if (selectedApt[idx]) selectedApt[idx].name = LABEL_PREFIXES[idx] + newName.trim();
        setTimeout(() => updateMapForApt(idx), 0);
      }
    });
    wrap.appendChild(renameBtn);

    const arrow = document.createElement('div');
    arrow.className = 'map-pin-arrow';
    arrow.style.borderTopColor = bg;
    arrow.style.borderTop = `8px solid ${bg}`;
    wrap.appendChild(label);
    wrap.appendChild(arrow);
    return wrap;
  }

  const container = document.createElement('div');
  container.className = 'apartment-marker-container';
  container.style.backgroundColor = bg;
  container.style.borderColor = bg;

  const nameEl = document.createElement('div');
  nameEl.className = 'apartment-name-marker';
  nameEl.textContent = apt.name;

  const detailEl = document.createElement('div');
  detailEl.className = 'apartment-details-marker';
  detailEl.style.color = '#fff';
  detailEl.textContent = `${(apt.year||'').slice(-5)} ${apt.units}세대`;

  container.appendChild(nameEl);
  container.appendChild(detailEl);
  return container;
}

// ─── 선택된 아파트 마커/선/라벨 업데이트 ───
function updateMapForApt(idx) {
  // 기존 마커/선/라벨 제거
  if (aptMarkers[idx]) { aptMarkers[idx].setMap(null); aptMarkers[idx] = null; }
  if (polylines[idx])  { polylines[idx].setMap(null);  polylines[idx] = null; }
  if (distanceLabels[idx]) { distanceLabels[idx].setMap(null); distanceLabels[idx] = null; }
  // 마커 재생성 시 줌 상태 초기화
  if (markerZoomState && markerZoomState.idx === idx) markerZoomState = null;

  const apt = selectedApt[idx];
  if (!apt) { updateSummary(); return; }

  const latlng = new naver.maps.LatLng(apt.lat, apt.lng);
  const el = createAptMarkerEl(apt, idx);

  // 커스텀 핀은 화살표 끝(하단 중앙)을 anchor로 측정
  let anchor;
  if (apt.isCustom) {
    el.style.position = 'absolute';
    el.style.visibility = 'hidden';
    document.body.appendChild(el);
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    document.body.removeChild(el);
    el.style.position = '';
    el.style.visibility = '';
    anchor = new naver.maps.Point(Math.round(w / 2), h);
  } else {
    // 일반 아파트 마커: DOM 크기 측정 후 상단 중앙을 anchor로
    el.style.position = 'absolute';
    el.style.visibility = 'hidden';
    document.body.appendChild(el);
    const w2 = el.offsetWidth;
    document.body.removeChild(el);
    el.style.position = '';
    el.style.visibility = '';
    anchor = new naver.maps.Point(Math.round(w2 / 2), 0);
  }

  aptMarkers[idx] = new naver.maps.Marker({
    position: latlng,
    map: map,
    icon: { content: el, anchor }
  });

  // 마커 클릭 시 zoom 17 토글
  function handleMarkerClick() {
    const curZoom = map.getZoom();
    if (markerZoomState && markerZoomState.idx === idx && curZoom === 17) {
      map.setCenter(markerZoomState.prevCenter);
      map.setZoom(markerZoomState.prevZoom);
      markerZoomState = null;
    } else {
      markerZoomState = { idx, prevCenter: map.getCenter(), prevZoom: curZoom };
      map.setCenter(new naver.maps.LatLng(apt.lat, apt.lng));
      map.setZoom(17);
    }
  }
  if (apt.isCustom) {
    // 커스텀 핀은 label이 mousedown/mouseup을 막아 Naver 이벤트가 전달 안 되므로
    // wrap(el)에 직접 DOM click 리스너 추가
    el.addEventListener('click', handleMarkerClick);
  } else {
    naver.maps.Event.addListener(aptMarkers[idx], 'click', handleMarkerClick);
  }

  // 강남역까지 선 그리기
  const gangnamLatLng = new naver.maps.LatLng(GANGNAM.lat, GANGNAM.lng);
  polylines[idx] = new naver.maps.Polyline({
    map: map,
    path: [latlng, gangnamLatLng],
    strokeColor: COLORS[idx],
    strokeWeight: 3,
    strokeOpacity: 0.85,
    strokeStyle: 'shortdash'
  });

  // 거리 라벨 (선 중간)
  const midLat = (apt.lat + GANGNAM.lat) / 2;
  const midLng = (apt.lng + GANGNAM.lng) / 2;
  const distKm = haversineKm(apt.lat, apt.lng, GANGNAM.lat, GANGNAM.lng).toFixed(2);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = `
    background:${COLORS[idx]};color:#fff;font-size:13px;font-weight:700;
    padding:3px 8px;border-radius:12px;white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    border:2px solid rgba(255,255,255,.6);
  `;
  labelEl.textContent = `${distKm} km`;

  distanceLabels[idx] = new naver.maps.Marker({
    position: new naver.maps.LatLng(midLat, midLng),
    map: map,
    icon: { content: labelEl, anchor: new naver.maps.Point(0, 0) }
  });

  updateSummary();
}

// ─── 지도 범위 자동 조정 ───
function fitMapBounds() {
  const points = [new naver.maps.LatLng(GANGNAM.lat, GANGNAM.lng)];
  selectedApt.forEach(a => { if (a) points.push(new naver.maps.LatLng(a.lat, a.lng)); });
  if (points.length === 1) return;
  const bounds = new naver.maps.LatLngBounds();
  points.forEach(p => bounds.extend(p));
  map.fitBounds(bounds, { padding: { top: 80, right: 80, bottom: 80, left: 80 } });
}

// ─── 거리 요약 배너 ───
function updateSummary() {
  const banner = document.getElementById('distanceSummary');
  const apts = selectedApt;
  const any = apts.some(a => a);
  if (!any) {
    banner.style.display = 'none';
    if (window.__cmpRefresh) window.__cmpRefresh();
    return;
  }
  banner.style.display = 'flex';

  const labels = ['🔵 지점 1', '🟠 지점 2', '🟣 지점 3'];
  const dists = apts.map((a, i) => {
    const dsEl = document.getElementById(`ds${i+1}`);
    if (!a) { dsEl.style.display = 'none'; return null; }
    const d = haversineKm(a.lat, a.lng, GANGNAM.lat, GANGNAM.lng);
    document.getElementById(`dsVal${i+1}`).textContent = d.toFixed(2);
    dsEl.style.display = 'flex';
    return d;
  });

  const valid = dists.filter(d => d !== null);
  const dsDiff = document.getElementById('dsDiff');
  if (valid.length >= 2) {
    const diff = Math.max(...valid) - Math.min(...valid);
    document.getElementById('dsValDiff').textContent = diff.toFixed(2);
    dsDiff.style.display = 'flex';
  } else {
    dsDiff.style.display = 'none';
  }
  if (window.__cmpRefresh) window.__cmpRefresh();
}

// ─── 아파트 검색 & 드롭다운 — hongbutest 검색과 같은 규칙(2026-10-29 통일) ───
// 띄어쓰기로 나눈 낱말이 단지명·시도·시군구·법정동에 모두 들어 있으면 맞음, 지도 중심 가까운 순, 50개 + "외 N개".
function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function highlight(text, query) {
  let result = escHtml(text);
  if (!query) return result;
  const terms = query.trim().split(/\s+/).filter(Boolean);
  terms.forEach(term => {
    const re = new RegExp(`(${escHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    result = result.replace(re, '<mark class="highlight">$1</mark>');
  });
  return result;
}

// 단지 → 법정동(aptEmd.json, 432KB) — 검색창을 처음 누를 때 한 번 받는다. 실패하면 동 없이 검색.
let aptEmd = null, aptEmdP = null;
function loadAptEmd() {
  if (!aptEmdP) aptEmdP = fetch('aptEmd.json')
    .then(r => (r.ok ? r.json() : {})).catch(() => ({}))
    .then(d => (aptEmd = d || {}));
  return aptEmdP;
}

function searchApts(query) {
  const terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const emd = aptEmd || {};
  let results = apartmentData.filter(apt => {
    const hay = `${apt.name} ${apt.sidoNm||''} ${apt.sigunguNm||''} ${emd[apt.id]||''}`.toLowerCase();
    return terms.every(t => hay.includes(t));
  }).map(apt => (emd[apt.id] ? { ...apt, dong: emd[apt.id] } : apt));

  // 지도 현재 중심 기준 거리순 정렬
  if (map) {
    const center = map.getCenter();
    const cLat = center.lat(), cLng = center.lng();
    results = results.map(apt => ({ ...apt, distance: haversineKm(cLat, cLng, apt.lat, apt.lng) }));
    results.sort((a, b) => a.distance - b.distance);
  }

  return results;
}

function setupSearch(idx) {
  const inputId  = `search${idx+1}`;
  const dropId   = `searchResults${idx+1}`;
  const cardId   = `card${idx+1}`;
  const selId    = `selected${idx+1}`;
  const clearId  = `clear${idx+1}`;

  const input   = document.getElementById(inputId);
  const drop    = document.getElementById(dropId);
  const card    = document.getElementById(cardId);
  const selDiv  = document.getElementById(selId);
  const clearBtn= document.getElementById(clearId);

  function positionDrop() {
    const r = input.getBoundingClientRect();
    drop.style.left = r.left + 'px';
    drop.style.top  = (r.bottom + 4) + 'px';
  }

  function closeDrop() { drop.style.display = 'none'; drop.innerHTML = ''; }

  function selectApt(apt) {
    selectedApt[idx] = apt;
    const dist = haversineKm(apt.lat, apt.lng, GANGNAM.lat, GANGNAM.lng).toFixed(2);
    selDiv.innerHTML = `<span>${apt.name}</span><span class="apt-dist">📍 ${dist} km</span>`;
    const findBtn = document.createElement('button');
    findBtn.className = 'apt-findway-btn';
    findBtn.textContent = '🗺️ 길찾기';
    findBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.openFindwayMenu(apt.lat, apt.lng, findBtn);
    });
    selDiv.appendChild(findBtn);
    input.value = '';
    card.classList.add('has-selection');
    closeDrop();
    updateMapForApt(idx);
  }

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (!q) { closeDrop(); return; }
    const results = searchApts(q);
    if (!results.length) {
      drop.innerHTML = '<div class="search-result-item" style="color:#999">검색 결과가 없습니다.</div>';
    } else {
      drop.innerHTML = results.slice(0, 50).map(apt => `
        <div class="search-result-item" data-id="${escHtml(apt.id)}">
          <strong>${highlight(apt.name, q)}</strong>
          <div class="search-result-meta">
            <span>${escHtml(apt.sidoNm)}</span>
            <span>${escHtml(apt.sigunguNm)}</span>
            ${apt.dong ? `<span>${escHtml(apt.dong)}</span>` : ''}
            <span>연식: ${escHtml(apt.year)}</span>
            <span>세대수: ${escHtml(apt.units)}</span>
            ${apt.distance !== undefined ? `<span class="dist">📍 ${apt.distance.toFixed(2)}km</span>` : ''}
          </div>
        </div>
      `).join('');
      if (results.length > 50) {
        drop.innerHTML += `<div class="search-result-item" style="color:#999;text-align:center;padding:8px;">... 외 ${results.length - 50}개 더 있습니다.</div>`;
      }
    }
    drop.style.display = 'block';
    positionDrop();

    drop.querySelectorAll('.search-result-item[data-id]').forEach(item => {
      item.addEventListener('click', () => {
        const apt = apartmentData.find(a => String(a.id) === item.dataset.id);
        if (apt) selectApt(apt);
      });
    });
  });

  input.addEventListener('focus', () => {
    // 동 이름은 처음 누를 때 받는다. 이미 쳐 둔 글자가 있으면 받은 뒤 결과를 다시 그린다.
    if (!aptEmd) loadAptEmd().then(() => { if (input.value.trim()) input.dispatchEvent(new Event('input')); });
    if (drop.innerHTML) { drop.style.display='block'; positionDrop(); }
  });

  clearBtn.addEventListener('click', () => {
    selectedApt[idx] = null;
    selDiv.textContent = '선택 안 됨';
    card.classList.remove('has-selection');
    updateMapForApt(idx);
  });

  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !drop.contains(e.target)) closeDrop();
  });
  window.addEventListener('resize', positionDrop);
  window.addEventListener('scroll', positionDrop);
}

// ─── 아파트 데이터 로드 ───
async function loadApartments() {
  try {
    const res = await fetch(`apt.json?t=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    apartmentData = data.map(apt => ({
      id: apt.id,
      name: apt.name,
      year: apt.year,
      units: parseInt(apt.units, 10),
      lat: parseFloat(apt.lat),
      lng: parseFloat(apt.lng),
      sidoNm: apt.sidoNm || '',
      sigunguNm: apt.sigunguNm || ''
    }));
  } catch (e) {
    console.error('아파트 데이터 로드 실패:', e);
  }
}

// ─── 거리재기 ───
function setupRuler() {
  let rulerActive = false;
  let rulerStep = 0; // 0: 대기, 1: 첫 지점 찍음
  let rulerPtA = null;
  let rulerMarkerA = null;
  let rulerClickListener = null;
  let rulerMoveListeners = [];
  let previewLine = null;
  let previewLabel = null;

  // 완료된 측정들을 모두 보관
  const rulerHistory = []; // [{ markerA, markerB, line, midLabel }]

  const btn = document.getElementById('rulerBtn');
  const clearAllBtn = document.getElementById('rulerClearAll');

  function updateClearAllBtn() {
    clearAllBtn.style.display = rulerHistory.length > 0 ? 'flex' : 'none';
  }

  function makePinEl() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;pointer-events:none;';
    const dot = document.createElement('div');
    dot.className = 'ruler-pin';
    wrap.appendChild(dot);
    return wrap;
  }

  function clearPreview() {
    if (previewLine)  { previewLine.setMap(null);  previewLine = null; }
    if (previewLabel) { previewLabel.setMap(null); previewLabel = null; }
  }

  function clearMoveListeners() {
    rulerMoveListeners.forEach(l => naver.maps.Event.removeListener(l));
    rulerMoveListeners = [];
  }

  function removeMeasurement(m) {
    if (m.markerA)  m.markerA.setMap(null);
    if (m.markerB)  m.markerB.setMap(null);
    if (m.line)     m.line.setMap(null);
    if (m.midLabel) m.midLabel.setMap(null);
    const idx = rulerHistory.indexOf(m);
    if (idx !== -1) rulerHistory.splice(idx, 1);
    updateClearAllBtn();
  }

  function deactivate() {
    rulerActive = false;
    btn.classList.remove('active');
    document.body.classList.remove('ruler-mode');
    clearPreview();
    clearMoveListeners();
    if (rulerClickListener) {
      naver.maps.Event.removeListener(rulerClickListener);
      rulerClickListener = null;
    }
  }

  function activate() {
    rulerActive = true;
    btn.classList.add('active');
    document.body.classList.add('ruler-mode');
    // 진행 중이던 A 마커만 초기화 (완료된 측정은 유지)
    if (rulerMarkerA) { rulerMarkerA.setMap(null); rulerMarkerA = null; }
    rulerStep = 0; rulerPtA = null;

    rulerClickListener = naver.maps.Event.addListener(map, 'click', (e) => {
      const latlng = e.coord;
      if (rulerStep === 0) {
        rulerPtA = latlng;
        rulerMarkerA = new naver.maps.Marker({
          position: latlng, map,
          icon: { content: makePinEl(), anchor: new naver.maps.Point(5, 5) },
          clickable: false
        });
        rulerStep = 1;

        // 마우스 이동 시 실시간 미리보기
        // map + 기존 완료된 선/마커 위에서도 mousemove 받기 위해 모두 등록
        const moveHandler = ev => {
          const pos = ev.coord;
          const dist = haversineKm(rulerPtA.lat(), rulerPtA.lng(), pos.lat(), pos.lng());
          const distStr = dist >= 1 ? `${dist.toFixed(2)} km` : `${Math.round(dist * 1000)} m`;

          if (!previewLine) {
            previewLine = new naver.maps.Polyline({
              map, path: [rulerPtA, pos],
              strokeColor: '#f0c000', strokeWeight: 2,
              strokeOpacity: 0.6, strokeStyle: 'shortdash',
              clickable: false
            });
            const pvEl = document.createElement('div');
            pvEl.style.cssText = 'background:rgba(240,192,0,0.9);color:#000;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.2);';
            pvEl.id = '_rulerPvLabel';
            previewLabel = new naver.maps.Marker({
              position: pos, map,
              icon: { content: pvEl, anchor: new naver.maps.Point(-10, 20) },
              clickable: false
            });
          } else {
            previewLine.setPath([rulerPtA, pos]);
            previewLabel.setPosition(pos);
          }
          const pvEl = document.getElementById('_rulerPvLabel');
          if (pvEl) pvEl.textContent = distStr;
        };

        rulerMoveListeners.push(naver.maps.Event.addListener(map, 'mousemove', moveHandler));
        rulerHistory.forEach(m => {
          if (m.line) rulerMoveListeners.push(naver.maps.Event.addListener(m.line, 'mousemove', moveHandler));
        });

      } else {
        clearPreview();
        clearMoveListeners();

        const markerB = new naver.maps.Marker({
          position: latlng, map,
          icon: { content: makePinEl(), anchor: new naver.maps.Point(5, 5) },
          clickable: false
        });

        // 선 그리기
        const line = new naver.maps.Polyline({
          map,
          path: [rulerPtA, latlng],
          strokeColor: '#f0c000',
          strokeWeight: 3,
          strokeOpacity: 0.9,
          strokeStyle: 'solid',
          clickable: false
        });

        // 거리 계산
        const dist = haversineKm(rulerPtA.lat(), rulerPtA.lng(), latlng.lat(), latlng.lng());
        const distStr = dist >= 1
          ? `${dist.toFixed(2)} km`
          : `${Math.round(dist * 1000)} m`;

        // 중간 라벨 (호버 시 ✕ 삭제 버튼 표시)
        const midLat = (rulerPtA.lat() + latlng.lat()) / 2;
        const midLng = (rulerPtA.lng() + latlng.lng()) / 2;
        const midEl = document.createElement('div');
        midEl.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:#f0c000;color:#000;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;border:2px solid #c9a000;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:default;';
        const textSpan = document.createElement('span');
        textSpan.textContent = distStr;
        const delBtn = document.createElement('span');
        delBtn.textContent = '✕';
        delBtn.style.cssText = 'display:none;cursor:pointer;font-size:10px;opacity:0.65;line-height:1;';
        delBtn.title = '이 측정 삭제';
        midEl.appendChild(textSpan);
        midEl.appendChild(delBtn);
        midEl.addEventListener('mouseenter', () => { delBtn.style.display = 'inline'; });
        midEl.addEventListener('mouseleave', () => { delBtn.style.display = 'none'; });

        const midLabel = new naver.maps.Marker({
          position: new naver.maps.LatLng(midLat, midLng),
          map,
          icon: { content: midEl, anchor: new naver.maps.Point(0, 0) },
          clickable: false
        });

        // 히스토리에 저장 (measurement 객체를 closure로 참조)
        const measurement = { markerA: rulerMarkerA, markerB, line, midLabel };
        rulerHistory.push(measurement);
        rulerMarkerA = null;
        updateClearAllBtn();

        delBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          removeMeasurement(measurement);
        });

        // 측정 완료 → 모드 종료
        deactivate();
      }
    });
  }

  btn.addEventListener('click', () => {
    if (rulerActive) {
      deactivate();
      // 진행 중인 A 마커만 제거 (완료된 측정 유지)
      if (rulerMarkerA) { rulerMarkerA.setMap(null); rulerMarkerA = null; }
      rulerStep = 0; rulerPtA = null;
    } else {
      activate();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && rulerActive) {
      deactivate();
      if (rulerMarkerA) { rulerMarkerA.setMap(null); rulerMarkerA = null; }
      rulerStep = 0; rulerPtA = null;
    }
  });

  clearAllBtn.addEventListener('click', () => {
    if (rulerActive) {
      deactivate();
      if (rulerMarkerA) { rulerMarkerA.setMap(null); rulerMarkerA = null; }
      rulerStep = 0; rulerPtA = null;
    }
    rulerHistory.forEach(m => {
      if (m.markerA)  m.markerA.setMap(null);
      if (m.markerB)  m.markerB.setMap(null);
      if (m.line)     m.line.setMap(null);
      if (m.midLabel) m.midLabel.setMap(null);
    });
    rulerHistory.length = 0;
    updateClearAllBtn();
  });
}

// ─── 반경재기 ───
function setupRadius() {
  let radiusActive = false;
  let radiusStep = 0;
  let radiusPtCenter = null;
  let radiusCenterMarker = null;
  let radiusClickListener = null;
  let radiusMoveListeners = []; // map + 기존 원 모두에 등록
  let previewCircle = null;
  let previewLabel = null;
  const radiusHistory = []; // { centerMarker, circle, label, labelEl, fillColor }
  let colorTarget = null;

  const btn         = document.getElementById('radiusBtn');
  const clearAllBtn = document.getElementById('radiusClearAll');
  const colorPicker = document.getElementById('circleColorPicker');

  function updateClearAllBtn() {
    clearAllBtn.style.display = radiusHistory.length > 0 ? 'flex' : 'none';
  }

  function makePinEl() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;pointer-events:none;';
    const dot = document.createElement('div');
    dot.className = 'radius-pin';
    wrap.appendChild(dot);
    return wrap;
  }

  function removeRadius(r) {
    if (r.centerMarker) r.centerMarker.setMap(null);
    if (r.circle)       r.circle.setMap(null);
    if (r.label)        r.label.setMap(null);
    const idx = radiusHistory.indexOf(r);
    if (idx !== -1) radiusHistory.splice(idx, 1);
    updateClearAllBtn();
  }

  function applyColor(color, keepOpen) {
    if (!colorTarget) return;
    colorTarget.fillColor = color;
    colorTarget.circle.setOptions({ fillColor: color, strokeColor: color });
    if (colorTarget.labelEl) {
      colorTarget.labelEl.style.background = color;
      colorTarget.labelEl.style.borderColor = color;
    }
    if (!keepOpen) colorPicker.style.display = 'none';
  }

  colorPicker.querySelectorAll('.circle-color-swatch').forEach(sw => {
    sw.addEventListener('click', e => { e.stopPropagation(); applyColor(sw.dataset.color, false); });
  });
  const customInput = document.getElementById('circleColorCustom');
  customInput.addEventListener('input', e => { e.stopPropagation(); applyColor(customInput.value, true); });
  customInput.addEventListener('click', e => e.stopPropagation());

  document.addEventListener('click', () => { colorPicker.style.display = 'none'; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') colorPicker.style.display = 'none'; });

  // Esc → 반경재기 취소
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && radiusActive) {
      deactivate();
      if (radiusCenterMarker) { radiusCenterMarker.setMap(null); radiusCenterMarker = null; }
      radiusStep = 0; radiusPtCenter = null;
    }
  });

  function clearPreview() {
    if (previewCircle) { previewCircle.setMap(null); previewCircle = null; }
    if (previewLabel)  { previewLabel.setMap(null);  previewLabel = null; }
  }

  function clearMoveListeners() {
    radiusMoveListeners.forEach(l => naver.maps.Event.removeListener(l));
    radiusMoveListeners = [];
  }

  function deactivate() {
    radiusActive = false;
    btn.classList.remove('active');
    document.body.classList.remove('radius-mode');
    clearPreview();
    clearMoveListeners();
    if (radiusClickListener) { naver.maps.Event.removeListener(radiusClickListener); radiusClickListener = null; }
  }

  // 실제 원 확정 생성
  function finalizeCircle(latlng) {
    clearPreview();
    clearMoveListeners();

    const distKm = haversineKm(radiusPtCenter.lat(), radiusPtCenter.lng(), latlng.lat(), latlng.lng());
    const radiusM = distKm * 1000;
    const distStr = distKm >= 1 ? `${distKm.toFixed(2)} km` : `${Math.round(radiusM)} m`;
    const DEFAULT_COLOR = '#2196F3';

    const circle = new naver.maps.Circle({
      map,
      center: radiusPtCenter,
      radius: radiusM,
      fillColor: DEFAULT_COLOR,
      fillOpacity: 0.15,
      strokeColor: DEFAULT_COLOR,
      strokeWeight: 2,
      strokeOpacity: 0.8,
      clickable: true
    });

    const labelEl = document.createElement('div');
    labelEl.style.cssText = `display:inline-flex;align-items:center;gap:4px;background:${DEFAULT_COLOR};color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;border:2px solid ${DEFAULT_COLOR};box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:default;`;
    const textSpan = document.createElement('span');
    textSpan.textContent = `반경 ${distStr}`;
    const delBtn = document.createElement('span');
    delBtn.textContent = '✕';
    delBtn.style.cssText = 'display:none;cursor:pointer;font-size:10px;opacity:0.65;line-height:1;';
    delBtn.title = '이 반경 삭제';
    labelEl.appendChild(textSpan);
    labelEl.appendChild(delBtn);
    labelEl.addEventListener('mouseenter', () => { delBtn.style.display = 'inline'; });
    labelEl.addEventListener('mouseleave', () => { delBtn.style.display = 'none'; });

    const label = new naver.maps.Marker({
      position: radiusPtCenter, map,
      icon: { content: labelEl, anchor: new naver.maps.Point(0, 0) }
    });

    const m = { centerMarker: radiusCenterMarker, circle, label, labelEl, fillColor: DEFAULT_COLOR };
    radiusHistory.push(m);
    radiusCenterMarker = null;
    updateClearAllBtn();

    delBtn.addEventListener('click', ev => { ev.stopPropagation(); removeRadius(m); });

    // 원 클릭 → 반경재기 모드일 때 새 클릭으로 처리 (기존 원 위에서도 클릭 가능)
    naver.maps.Event.addListener(circle, 'click', ev => {
      if (radiusActive) handleClick(ev.coord);
    });

    // 우클릭 → 색상 선택
    naver.maps.Event.addListener(circle, 'rightclick', ev => {
      const pe = ev.pointerEvent || ev.domEvent;
      if (pe) pe.preventDefault();
      colorTarget = m;
      customInput.value = m.fillColor || DEFAULT_COLOR;
      const x = pe ? pe.clientX : 200;
      const y = pe ? pe.clientY : 200;
      colorPicker.style.left = x + 'px';
      colorPicker.style.top  = y + 'px';
      colorPicker.style.display = 'flex';
    });

    deactivate();
  }

  // 클릭 처리 (map click, circle click 공용)
  function handleClick(latlng) {
    if (!radiusActive) return;
    if (radiusStep === 0) {
      radiusPtCenter = latlng;
      radiusCenterMarker = new naver.maps.Marker({
        position: latlng, map,
        icon: { content: makePinEl(), anchor: new naver.maps.Point(5, 5) }
      });
      radiusStep = 1;

      // 마우스 이동 시 실시간 미리보기
      // map + 기존 원 전체에 등록 (원 위에서도 mousemove 받기 위해)
      const moveHandler = ev => {
        const pos = ev.coord;
        const dKm = haversineKm(radiusPtCenter.lat(), radiusPtCenter.lng(), pos.lat(), pos.lng());
        const dM  = dKm * 1000;
        const dStr = dKm >= 1 ? `${dKm.toFixed(2)} km` : `${Math.round(dM)} m`;

        if (!previewCircle) {
          previewCircle = new naver.maps.Circle({
            map, center: radiusPtCenter, radius: dM,
            fillColor: '#2196F3', fillOpacity: 0.08,
            strokeColor: '#2196F3', strokeWeight: 2,
            strokeOpacity: 0.6, strokeStyle: 'shortdash',
            clickable: false
          });
          const pvEl = document.createElement('div');
          pvEl.style.cssText = 'background:rgba(33,150,243,0.85);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.2);';
          pvEl.id = '_pvLabel';
          previewLabel = new naver.maps.Marker({
            position: pos, map,
            icon: { content: pvEl, anchor: new naver.maps.Point(-10, 20) },
            clickable: false
          });
        } else {
          previewCircle.setOptions({ radius: dM });
          previewLabel.setPosition(pos);
        }
        const pvEl = document.getElementById('_pvLabel');
        if (pvEl) pvEl.textContent = `반경 ${dStr}`;
      };

      radiusMoveListeners.push(naver.maps.Event.addListener(map, 'mousemove', moveHandler));
      radiusHistory.forEach(r => {
        radiusMoveListeners.push(naver.maps.Event.addListener(r.circle, 'mousemove', moveHandler));
      });
    } else {
      finalizeCircle(latlng);
    }
  }

  function activate() {
    radiusActive = true;
    btn.classList.add('active');
    document.body.classList.add('radius-mode');
    if (radiusCenterMarker) { radiusCenterMarker.setMap(null); radiusCenterMarker = null; }
    radiusStep = 0; radiusPtCenter = null;

    radiusClickListener = naver.maps.Event.addListener(map, 'click', e => handleClick(e.coord));
  }

  btn.addEventListener('click', () => {
    if (radiusActive) {
      deactivate();
      if (radiusCenterMarker) { radiusCenterMarker.setMap(null); radiusCenterMarker = null; }
      radiusStep = 0; radiusPtCenter = null;
    } else {
      activate();
    }
  });

  clearAllBtn.addEventListener('click', () => {
    if (radiusActive) {
      deactivate();
      if (radiusCenterMarker) { radiusCenterMarker.setMap(null); radiusCenterMarker = null; }
      radiusStep = 0; radiusPtCenter = null;
    }
    [...radiusHistory].forEach(r => removeRadius(r));
  });
}

// ─── 우클릭 → 시작지점 등록 ───
function setupMapRightClick() {
  const menu    = document.getElementById('mapContextMenu');
  const coords  = document.getElementById('ctxCoords');
  const overlay = document.getElementById('findwayOverlay');
  const iframe  = document.getElementById('findwayIframe');
  const closeBtn= document.getElementById('findwayClose');
  let pendingLatLng = null;

  // 오버레이 닫기
  closeBtn.addEventListener('click', () => { overlay.style.display = 'none'; iframe.src = ''; });

  const FW_MAX = FW_IDS.length; // 선택 제한 해제 (전체 9개 선택 가능)
  let fwToastTimer = null;

  function showFwToast() {
    const toast = document.getElementById('fwToast');
    toast.classList.add('show');
    clearTimeout(fwToastTimer);
    fwToastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function updateFwCheckboxStates() {
    const cbs = FW_IDS.map(id => document.getElementById('fw_' + id));
    const checkedCount = cbs.filter(cb => cb.checked).length;
    cbs.forEach(cb => {
      if (!cb.checked) cb.disabled = checkedCount >= FW_MAX;
    });
  }

  // 전체 토글 → 3개까지만 체크 (버튼 클릭 시 메뉴 닫히지 않도록 stopPropagation)
  document.getElementById('fwAllToggle').addEventListener('click', (e) => {
    e.stopPropagation();
    const cbs = FW_IDS.map(id => document.getElementById('fw_' + id));
    const checkedCount = cbs.filter(cb => cb.checked).length;
    if (checkedCount > 0) {
      // 하나라도 체크돼 있으면 전체 해제
      cbs.forEach(cb => { cb.checked = false; cb.disabled = false; });
    } else {
      // 전체 해제 상태면 처음 3개 체크
      cbs.forEach((cb, i) => { cb.checked = i < FW_MAX; cb.disabled = false; });
    }
    updateFwCheckboxStates();
  });

  // 각 체크박스 변경 시 3개 제한 적용
  FW_IDS.forEach(id => {
    const cb = document.getElementById('fw_' + id);
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      updateFwCheckboxStates();
    });
    // disabled 상태에서 클릭 시 토스트
    cb.parentElement.addEventListener('click', (e) => {
      e.stopPropagation();
      if (cb.disabled) showFwToast();
    });
  });

  // 길찾기 실행 — 현재 선택된 모든 지점(1~3)을 지점별 섹션으로 표시
  document.getElementById('fwGoBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const selected = FW_IDS.filter(id => document.getElementById('fw_' + id)?.checked);
    if (!selected.length) { alert('적어도 하나의 목적지를 선택하세요.'); return; }

    // 등록된 지점 전부 + (등록되지 않은 우클릭 위치면 맨 앞에 추가)
    const starts = [];
    if (pendingLatLng) {
      const plat = pendingLatLng.lat(), plng = pendingLatLng.lng();
      const isRegistered = selectedApt.some(a => a && Math.abs(a.lat - plat) < 1e-9 && Math.abs(a.lng - plng) < 1e-9);
      if (!isRegistered) starts.push({ name: '우클릭 위치', lat: plat, lng: plng });
    }
    selectedApt.forEach(a => { if (a) starts.push({ name: a.name, lat: a.lat, lng: a.lng }); });
    if (!starts.length) { alert('선택된 지점이 없습니다.'); return; }

    const startsStr = starts.map(s => `${s.lng}|${s.lat}|${s.name}`).join(';');
    const url = `distancePublic.html?starts=${encodeURIComponent(startsStr)}&selected=${selected.join(',')}&_=${Date.now()}`;
    iframe.src = url;
    overlay.style.display = 'flex';
    menu.style.display = 'none';
    pendingLatLng = null;
  });

  // 체크박스 행 클릭 시 메뉴 닫히지 않게
  document.querySelectorAll('.ctx-dest-item').forEach(item => {
    item.addEventListener('click', (e) => e.stopPropagation());
  });

  // 초기 상태 적용
  updateFwCheckboxStates();

  const registerSection = document.getElementById('ctxRegisterSection');

  window.openFindwayMenu = function(lat, lng, buttonEl) {
    pendingLatLng = new naver.maps.LatLng(lat, lng);
    registerSection.style.display = 'none';
    menu.style.display = 'block';
    const rect = buttonEl.getBoundingClientRect();
    const mr   = menu.getBoundingClientRect();
    let x = rect.left, y = rect.bottom + 4;
    if (x + mr.width  > window.innerWidth)  x = window.innerWidth  - mr.width  - 4;
    if (y + mr.height > window.innerHeight) y = rect.top - mr.height - 4;
    menu.style.left = x + 'px';
    menu.style.top  = y + 'px';
  };

  naver.maps.Event.addListener(map, 'rightclick', (e) => {
    pendingLatLng = e.latlng;
    const lat = pendingLatLng.lat().toFixed(5);
    const lng = pendingLatLng.lng().toFixed(5);
    coords.textContent = `위도 ${lat}  경도 ${lng}`;
    registerSection.style.display = '';

    const me = e.domEvent || e;
    let x = me.clientX + 6, y = me.clientY;
    menu.style.display = 'block';
    const mr = menu.getBoundingClientRect();
    if (x + mr.width  > window.innerWidth)  x = me.clientX - mr.width - 6;
    if (y + mr.height > window.innerHeight) y = window.innerHeight - mr.height - 4;
    menu.style.left = x + 'px';
    menu.style.top  = y + 'px';
  });

  function registerFromMap(idx) {
    if (!pendingLatLng) return;
    const lat  = pendingLatLng.lat();
    const lng  = pendingLatLng.lng();
    const dist = haversineKm(lat, lng, GANGNAM.lat, GANGNAM.lng).toFixed(2);
    customLabels[idx] = ['지점 1', '지점 2', '지점 3'][idx];
    const apt = {
      id: `map_${idx}_${Date.now()}`,
      name: LABEL_PREFIXES[idx] + customLabels[idx],
      lat, lng, year: '', units: '', sidoNm: '', sigunguNm: '', isCustom: true
    };
    selectedApt[idx] = apt;
    const selDiv = document.getElementById(`selected${idx + 1}`);
    const card   = document.getElementById(`card${idx + 1}`);
    selDiv.innerHTML = `<span>지도 선택 위치</span><span class="apt-dist">📍 ${dist} km</span>`;
    const findBtn = document.createElement('button');
    findBtn.className = 'apt-findway-btn';
    findBtn.textContent = '🗺️ 길찾기';
    findBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.openFindwayMenu(apt.lat, apt.lng, findBtn);
    });
    selDiv.appendChild(findBtn);
    card.classList.add('has-selection');
    updateMapForApt(idx);
    menu.style.display = 'none';
    pendingLatLng = null;
  }

  document.getElementById('ctxApt1').addEventListener('click', () => registerFromMap(0));
  document.getElementById('ctxApt2').addEventListener('click', () => registerFromMap(1));
  document.getElementById('ctxApt3').addEventListener('click', () => registerFromMap(2));

  // 메뉴 닫기
  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target)) menu.style.display = 'none';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') menu.style.display = 'none';
  });
}

// ─── 업무지구 대중교통 비교표 ───
// 지점 1~3 을 열로, 7대 업무지구를 행으로 놓고 대중교통 소요시간을 한 번에 비교한다.
// 경로는 sise_server 의 공개 /route(네이버 지도 대중교통 프록시, 토큰 불필요, IP 당 분당 60회)로 받는다.
const CMP_DESTS = [
  { key: 'gbd', label: '강남 GBD', sub: '강남역',     lat: 37.497951, lng: 127.027636 },
  { key: 'cbd', label: 'CBD',      sub: '시청역',     lat: 37.564719, lng: 126.977022 },
  { key: 'ybd', label: '여의도 YBD', sub: '여의도역', lat: 37.521624, lng: 126.924374 },
  { key: 'pg',  label: '판교',     sub: '판교역',     lat: 37.394768, lng: 127.111699 },
  { key: 'mg',  label: '마곡',     sub: '마곡역',     lat: 37.560143, lng: 126.825231 },
  { key: 'gv',  label: 'G밸리',    sub: '가산디지털단지역', lat: 37.481339, lng: 126.882734 },
  { key: 'dmc', label: 'DMC',      sub: 'DMC역',      lat: 37.576528, lng: 126.898109 },
];

// 기본 출발일 = 공휴일이 아닌 가장 가까운 월요일 (hongbutest 업무지구 길찾기와 같은 규칙·표)
// ⚠ 음력 명절은 해마다 추가해야 한다.
const CMP_HOLIDAYS = new Set([
  '2026-01-01', '2026-02-16', '2026-02-17', '2026-02-18',
  '2026-03-01', '2026-03-02',
  '2026-05-05', '2026-05-24', '2026-05-25',
  '2026-06-06', '2026-08-15', '2026-08-17',
  '2026-09-24', '2026-09-25', '2026-09-26',
  '2026-10-03', '2026-10-05', '2026-10-09', '2026-12-25',
  '2027-01-01', '2027-02-06', '2027-02-07', '2027-02-08',
  '2027-03-01', '2027-05-05', '2027-05-13',
  '2027-06-06', '2027-06-07', '2027-08-15', '2027-08-16',
  '2027-09-14', '2027-09-15', '2027-09-16',
  '2027-10-03', '2027-10-04', '2027-10-09', '2027-10-11',
  '2027-12-25', '2027-12-27',
]);

function setupCompare() {
  const panel = document.getElementById('cmpPanel');
  const table = document.getElementById('cmpTable');
  const dateIn = document.getElementById('cmpDate');
  const hourSel = document.getElementById('cmpHour');
  const minSel = document.getElementById('cmpMin');
  const DEPART_KEY = 'distanceCompareDepart_v1';

  const apiBase = () => {
    const h = location.hostname;
    return (h === 'localhost' || h === '127.0.0.1') ? 'http://localhost:7123' : 'https://sise-cloud.luciferhong.com';
  };
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ── 출발 시각 줄 ──
  let hm = { h: 7, m: 30 };
  try {
    const s = JSON.parse(localStorage.getItem(DEPART_KEY) || 'null');
    if (s && Number.isInteger(s.h) && Number.isInteger(s.m)) hm = s;
  } catch (_) {}
  for (let h = 0; h < 24; h++) hourSel.add(new Option(String(h).padStart(2, '0') + '시', h));
  for (let m = 0; m < 60; m += 5) minSel.add(new Option(String(m).padStart(2, '0') + '분', m));
  hourSel.value = hm.h; minSel.value = hm.m - (hm.m % 5);
  dateIn.value = (function defaultDate() {
    const d = new Date();
    const before = d.getHours() * 60 + d.getMinutes() < hm.h * 60 + hm.m;
    if (!(d.getDay() === 1 && before && !CMP_HOLIDAYS.has(ymd(d)))) {
      do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 1 || CMP_HOLIDAYS.has(ymd(d)));
    }
    return ymd(d);
  })();
  const departure = () =>
    `${dateIn.value}T${String(hourSel.value).padStart(2, '0')}:${String(minSel.value).padStart(2, '0')}:00`;

  [dateIn, hourSel, minSel].forEach(el => el.addEventListener('change', () => {
    try { localStorage.setItem(DEPART_KEY, JSON.stringify({ h: +hourSel.value, m: +minSel.value })); } catch (_) {}
    render();
  }));
  document.getElementById('cmpReload').addEventListener('click', () => {
    // 실패한 것만 다시 묻는다(성공한 결과는 시각이 같으면 그대로)
    for (const [k, v] of routeCache) if (v.state === 'fail') routeCache.delete(k);
    render();
  });
  document.getElementById('cmpFold').addEventListener('click', e => {
    panel.classList.toggle('collapsed');
    e.target.textContent = panel.classList.contains('collapsed') ? '펴기' : '접기';
    render(); // 펼 때 열 폭을 다시 잰다
  });

  // ── 경로 조회 (동시 4개, 결과는 지점좌표·목적지·출발시각별로 기억) ──
  const routeCache = new Map(); // key → {state:'wait'|'ok'|'close'|'fail', r?}
  const queue = [];
  let running = 0;
  function pump() {
    while (running < 4 && queue.length) {
      const job = queue.shift();
      running++;
      job().finally(() => { running--; pump(); });
    }
  }
  function getRoute(apt, dest, dep) {
    const key = `${apt.lng.toFixed(6)},${apt.lat.toFixed(6)}|${dest.key}|${dep}`;
    let hit = routeCache.get(key);
    if (hit) return hit;
    hit = { state: 'wait' };
    routeCache.set(key, hit);
    queue.push(async () => {
      const url = `${apiBase()}/route?mode=pubtrans&summary=1&alt=1` +
        `&start=${apt.lng},${apt.lat}&goal=${dest.lng},${dest.lat}&departureTime=${encodeURIComponent(dep)}`;
      try {
        const res = await fetch(url);
        const j = await res.json().catch(() => ({}));
        if (j.ok && j.routes && j.routes.length) { hit.state = 'ok'; hit.r = j.routes[0]; }
        else if (j.code === 'TOO_CLOSE') hit.state = 'close';
        else { hit.state = 'fail'; hit.err = j.error || ('HTTP ' + res.status); }
      } catch (e) {
        hit.state = 'fail'; hit.err = e.message || String(e);
      }
      render();
    });
    pump();
    return hit;
  }

  // ── 경로 한 줄 요약: (10분 이상 도보만) 🚶도보 N분 → 노선 뱃지 → … · 환승 N · 도보·대기 N분 ──
  // 10분 미만 도보는 뱃지 대신 아래 줄 '도보·대기'에 합친다.
  function routeHtml(r) {
    const steps = (r.steps || []).filter(s => s.type !== 'WALKING' || s.duration >= 10);
    const stepMin = steps.reduce((a, s) => a + (s.duration || 0), 0);
    const badges = steps.map(s => {
      if (s.type === 'WALKING') return `<span class="cmp-line cmp-walk">🚶도보 ${s.duration}분</span>`;
      const nm = s.type === 'BUS' ? `🚌${s.name || '버스'}` : (s.name || s.lineType || s.type);
      return `<span class="cmp-line" style="background:${esc(s.color || '#6b7280')}">${esc(nm)}</span>`;
    }).join(' → ');
    const extra = [];
    if (r.transferCount > 0) extra.push(`환승 ${r.transferCount}`);
    const wait = Math.max(0, (r.duration || 0) - stepMin);
    if (wait > 0) extra.push(`도보·대기 ${wait}분`);
    return `<div class="cmp-route">${badges || '도보'}${extra.length ? '<br>' + extra.join(' · ') : ''}</div>`;
  }

  // ── 표 그리기 ──
  function render() {
    const cols = selectedApt.map((a, i) => a ? { a, i } : null).filter(Boolean);
    if (!cols.length) { panel.style.display = 'none'; return; }
    panel.style.display = 'flex';
    const dep = departure();

    let h = '<thead><tr><th></th>';
    for (const { a, i } of cols) {
      const nm = String(a.name || '').replace(/^[^\w가-힣]+\s*/, '');
      const meta = a.isCustom ? '지도 선택 위치' : [a.sigunguNm, a.year, a.units ? a.units + '세대' : ''].filter(Boolean).join(' · ');
      h += `<th><div class="cmp-col-head"><span class="cmp-num" style="background:${COLORS[i]}">${i + 1}</span>` +
        `<span class="cmp-apt-name">${esc(nm)}</span></div><div class="cmp-apt-meta">${esc(meta)}</div></th>`;
    }
    h += '</tr></thead><tbody>';

    // 강남역 직선거리
    h += '<tr><th>강남역 직선</th>';
    const straight = cols.map(({ a }) => haversineKm(a.lat, a.lng, GANGNAM.lat, GANGNAM.lng));
    const sMin = Math.min(...straight);
    straight.forEach(d => {
      h += `<td class="${cols.length > 1 && d === sMin ? 'cmp-best' : ''}"><span class="cmp-min" style="font-size:14px">${d.toFixed(1)}km</span></td>`;
    });
    h += '</tr>';

    // 업무지구별
    for (const dest of CMP_DESTS) {
      const cells = cols.map(({ a }) => getRoute(a, dest, dep));
      const durs = cells.map(c => c.state === 'ok' ? c.r.duration : (c.state === 'close' ? 0 : null));
      const valid = durs.filter(v => v != null);
      const best = valid.length > 1 ? Math.min(...valid) : null;
      h += `<tr><th>${esc(dest.label)}<span class="cmp-sub">${esc(dest.sub)}</span></th>`;
      cells.forEach((c, k) => {
        const d = durs[k];
        const cls = d != null && d === best ? 'cmp-best' : '';
        let body;
        if (c.state === 'wait') body = '<span class="cmp-muted">조회 중…</span>';
        else if (c.state === 'close') body = '<span class="cmp-min">도보권</span>';
        else if (c.state === 'fail') body = `<span class="cmp-muted" title="${esc(c.err)}">조회 실패 (↻)</span>`;
        else body = `<span class="cmp-min${d > 60 ? ' slow' : ''}">${d}분</span>${routeHtml(c.r)}`;
        h += `<td class="${cls}">${body}</td>`;
      });
      h += '</tr>';
    }

    h += '</tbody>';

    table.innerHTML = h;
    // 열 폭 = 줄바꿈 없이 잰 가장 넓은 지점 열(상한 240px)로 통일, 첫 열은 제 폭
    table.classList.add('measure');
    const ths = [...table.querySelectorAll('thead th')];
    ths.forEach(th => (th.style.width = ''));
    const firstW = ths[0].offsetWidth;
    let colW = Math.max(0, ...ths.slice(1).map(th => th.offsetWidth));
    table.classList.remove('measure');
    if (!colW) colW = 200; // 접혀 있어 못 잰 경우
    // 상한 없음 — 칸 안 줄바꿈이 없어 상한을 두면 내용이 넘친다. 가로 스크롤 대신 표를 넓힌다(사용자 지정). 1px 여유.
    colW += 1;
    ths[0].style.width = firstW + 1 + 'px';
    ths.slice(1).forEach(th => (th.style.width = colW + 'px'));
    table.style.width = firstW + 1 + colW * cols.length + 'px';
    place();
  }

  // 지도 오른쪽 위에 붙인다(폰은 CSS 가 흐름 배치로 바꾼다)
  function place() {
    if (panel.style.display === 'none' || window.matchMedia('(max-width: 768px)').matches) return;
    const r = document.getElementById('map').getBoundingClientRect();
    panel.style.top = (r.top + 8) + 'px';
    panel.style.right = (document.documentElement.clientWidth - r.right + 8) + 'px';
    panel.style.maxHeight = (r.height - 16) + 'px';
    const body = document.getElementById('cmpBody');
    body.style.maxHeight = (r.height - 16 - document.getElementById('cmpHead').offsetHeight) + 'px';
    // 몸통 폭 = 표 폭 + 세로 스크롤바 폭 — 스크롤바가 안쪽 폭을 먹어 가로 스크롤이 생기지 않게
    body.style.width = '';
    body.style.width = (table.offsetWidth + body.offsetWidth - body.clientWidth) + 'px';
  }
  window.addEventListener('resize', place);
  if (window.ResizeObserver) new ResizeObserver(place).observe(document.getElementById('map'));

  window.__cmpRefresh = render;
}

// ─── 초기화 ───
async function init() {
  map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(37.52, 127.03),
    zoom: 12,
    mapTypeId: naver.maps.MapTypeId.NORMAL
  });

  addGangnamMarker();
  setupMapRightClick();
  setupRuler();
  setupRadius();
  setupCompare();
  await loadApartments();
  setupSearch(0);
  setupSearch(1);
  setupSearch(2);
}

init();
</script>
