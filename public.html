


<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta name="Yeti" content="noindex, nofollow">
    <meta charset="UTF-8">
    <title>[루시퍼홍] 7대 업무지구 대중교통 원클릭</title>
    <link rel="icon" href="oneclick2.png" type="image/png">
    
    <style>
        :root {
            --crop-top: 325px; /* iframe 안 카카오맵 상단(로고~이동수단 아이콘)을 잘라 경로 목록부터 표시 */
            --crop-bottom: 150px; /* iframe 안 카카오맵 하단(경로인쇄·즐겨찾기·고객센터)을 잘라낼 높이 */
        }
         #map {
			width: 100%;
			height: 400px;
			margin-bottom: 20px;
			resize: both; /* 세로 크기 조절 허용 */
			overflow: auto; /* 크기 조절 시 스크롤 생성을 위해 추가 */
		}
		.result-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .result {
            position: relative;
            width: 390px !important;
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 8px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            flex: 0 0 auto;
        }
        .result-title {
            font-weight: bold;
            font-size: 14px;
        }
        .result-body {
            position: relative;
            height: 300px;
            overflow: hidden;
            flex: 0 0 auto;
        }
        /* 줄 단위 세로 길이 조절용 드래그 핸들 */
        .row-resize-handle {
            height: 8px;
            cursor: ns-resize;
            background: #e0e0e0;
            border-top: 1px solid #ccc;
            flex: 0 0 auto;
            touch-action: none;
        }
        .row-resize-handle:hover {
            background: #b8c4d8;
        }
        .result-large .row-resize-handle {
            display: none;
        }
        .controls-container {
            display: flex;
            gap: 10px;
            align-items: center;
            gap: 100px; /* 체크박스와 토글 버튼 사이의 간격 설정 */
            margin-bottom: 10px;
        }
        .checkbox-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .toggle-container {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .toggle-button {
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f0f0f0;
        }
        .toggle-button.active {
            background-color: #007bff;
            color: #fff;
        }
        .notice {
            margin-left: auto;
            color: rgb(8, 8, 8);
            font-size: 14px;
        }
        .view-large-button {
            padding: 3px 10px;
            background-color: #ED7D31;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .result-frame {
            position: absolute;
            z-index: 1;
            left: 0;
            top: calc(-1 * var(--crop-top));
            width: 100%;
            height: calc(100% + var(--crop-top) + var(--crop-bottom));
        }
		/* 가로 1200px, 세로 800px로 설정된 클래스 */
		.result-large {
			width: 1200px;
			height: 800px;
			z-index: 1000;
			position: fixed;
			top: 10px;
			right: 10px;
			background-color: white;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			border: 1px solid #ccc;
			box-sizing: border-box;
		}
		/* 크게보기에서는 iframe 영역이 나머지 전체를 채우고, 상단도 자르지 않고 전체 표시 */
		.result-large .result-body {
			height: auto;
			flex: 1 1 auto;
		}
		.result-large .result-frame {
			top: 0;
			height: 100%;
		}


    </style>
    
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=9t8y33hyq8"></script>
</head>
<body>

<h1>[루시퍼홍] 7대 업무지구 교통 원클릭 Ver 1.4</h1>

<div class="controls-container">
    <div class="checkbox-container">
        <label><input type="checkbox" id="chk1" checked> 강남역</label>
        <label><input type="checkbox" id="chk2" checked> 서울시청역</label>
        <label><input type="checkbox" id="chk9"> 광화문역</label>
        <label><input type="checkbox" id="chk3" checked> 여의도역</label>
        <label><input type="checkbox" id="chk4"> 가산디지털단지역</label>
        <label><input type="checkbox" id="chk8"> 구로지디털단지역</label>
        <label><input type="checkbox" id="chk5"> 판교역</label>
        <label><input type="checkbox" id="chk6"> 마곡역</label>
        <label><input type="checkbox" id="chk7"> DMC역</label>
    </div>
    <div class="toggle-container">
        <span class="toggle-button active" id="transitBtn">대중교통</span>
        <span class="toggle-button" id="carBtn">자동차</span>

        <!-- <span class="notice">&nbsp;&nbsp;(일별, 월별 이용량을 초과하면 이용이 중단될 수 있습니다)</span> -->
    </div>
</div>

<div id="map"></div>

<div class="result-container">
    <div class="result" id="resultBox1" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle1"></span>
            <button class="view-large-button" onclick="toggleLargeView(1)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result1" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox2" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle2"></span>
            <button class="view-large-button" onclick="toggleLargeView(2)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result2" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox3" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle3"></span>
            <button class="view-large-button" onclick="toggleLargeView(3)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result3" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox4" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle4"></span>
            <button class="view-large-button" onclick="toggleLargeView(4)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result4" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox5" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle5"></span>
            <button class="view-large-button" onclick="toggleLargeView(5)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result5" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox6" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle6"></span>
            <button class="view-large-button" onclick="toggleLargeView(6)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result6" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox7" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle7"></span>
            <button class="view-large-button" onclick="toggleLargeView(7)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result7" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox8" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle8"></span>
            <button class="view-large-button" onclick="toggleLargeView(8)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result8" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
    <div class="result" id="resultBox9" style="display:none">
        <div class="result-header">
            <span class="result-title" id="resultTitle9"></span>
            <button class="view-large-button" onclick="toggleLargeView(9)">크게보기</button>
        </div>
        <div class="result-body"><iframe id="result9" class="result-frame" src="" frameborder="0"></iframe></div>
    </div>
</div>

<script>

	window.onload = function () {
        alert('컴퓨터 날짜와 시각을 변경하면 출발시각이 변경됩니다\n(출발시각을 평일 07시30분으로 보고자 한다면 컴퓨터 날짜와 시각을 평일 07:30으로 변경하세요. 대중교통에 한해 반영됩니다)');
    };


	let currentExpandedIframe = null;

    const destinations = [
        { id: 'chk1', lat: 37.497951, lng: 127.027636, name: '강남역2호선', code: 222 },
        { id: 'chk2', lat: 37.564719, lng: 126.977022, name: '서울시청역2호선', code: 273 },
        { id: 'chk3', lat: 37.521624, lng: 126.924374, name: '여의도역5호선', code: 526 },        
        { id: 'chk9', lat: 37.5723, lng: 126.9791, name: '광화문역5호선', code: 560 },
        { id: 'chk4', lat: 37.481339, lng: 126.882734, name: '가산디지털단지역1호선', code: 172 },
        { id: 'chk8', lat: 37.485266, lng: 126.900198, name: '구로지디털단지역2호선', code: 232 },
        { id: 'chk5', lat: 37.394768, lng: 127.111699, name: '판교역신분당선', code: 1914 },
        { id: 'chk6', lat: 37.560143, lng: 126.825231, name: '마곡역5호선', code: 514 },
        { id: 'chk7', lat: 37.576528, lng: 126.898109, name: 'DMC역6호선', code: 618 }
    ];

    let transportMode = 'transit';
    const map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(37.5665, 126.9780),
    zoom: 13
});
const mapElement = document.getElementById('map');


// 지도 사이즈를 가져오는 함수
function getMapSize() {
    return new naver.maps.Size(mapElement.offsetWidth, mapElement.offsetHeight);
}

// ResizeObserver를 사용해 map 요소 사이즈 변경 감지
let resizeObserver = new ResizeObserver(() => {
    map.setSize(getMapSize()); // 변경된 사이즈를 적용
});

resizeObserver.observe(mapElement);




    const marker = new naver.maps.Marker({
        position: map.getCenter(),
        map: map
    });

    document.getElementById('transitBtn').addEventListener('click', () => toggleMode('transit'));
    document.getElementById('carBtn').addEventListener('click', () => toggleMode('car'));

    function toggleMode(mode) {
        transportMode = mode;
        updateToggleButtons(mode);
    }

    function updateToggleButtons(mode) {
        document.getElementById('transitBtn').classList.toggle('active', mode === 'transit');
        document.getElementById('carBtn').classList.toggle('active', mode === 'car');
    }

    naver.maps.Event.addListener(map, 'click', function(e) {
        const latlng = e.latlng;
        marker.setPosition(latlng);
        updateRoutes(latlng.lng(), latlng.lat());
    });

    function updateRoutes(startX, startY) {
    let frameIndex = 1;
    destinations.forEach(dest => {
        const checkbox = document.getElementById(dest.id);
        if (checkbox.checked && frameIndex <= 9) {
            document.getElementById(`resultBox${frameIndex}`).style.display = '';
            document.getElementById(`resultTitle${frameIndex}`).textContent = dest.name;
            document.getElementById(`result${frameIndex}`).src = createUrl(startX, startY, dest);
            frameIndex++;
        }
    });

    // 남은 iframe을 비우는 부분에서 오류가 발생할 수 있습니다.
    clearRemainingIframes(frameIndex);
	}

	function clearRemainingIframes(startIndex) {
		for (let i = startIndex; i <= 9; i++) {
			const iframe = document.getElementById(`result${i}`);
			if (iframe) {
				iframe.src = ''; // iframe을 비울 때 src만 비우고, 다른 설정은 그대로 유지
			}
			const box = document.getElementById(`resultBox${i}`);
			if (box) box.style.display = 'none';
		}
	}


    // 2026-07-30부터 map.naver.com이 X-Frame-Options: DENY로 iframe 삽입을 차단하여 카카오맵으로 전환
    // 카카오맵 길찾기 URL: /link/by/{car|traffic}/{이름,위도,경도}/{이름,위도,경도} (WGS84)
    function createUrl(startX, startY, dest) {
        const by = transportMode === 'car' ? 'car' : 'traffic';
        return `https://map.kakao.com/link/by/${by}/${encodeURIComponent('출발지')},${startY},${startX}/${encodeURIComponent(dest.name)},${dest.lat},${dest.lng}`;
    }

   

    
	// 헤더의 크게보기 버튼으로 확대/원복 토글 (버튼이 iframe 밖에 있어 가려지지 않음)
	function toggleLargeView(n) {
		const box = document.getElementById(`resultBox${n}`);
		const btn = box.querySelector('.view-large-button');
		if (box.classList.contains('result-large')) {
			box.classList.remove('result-large');
			box.classList.add('result');
			btn.textContent = '크게보기';
			currentExpandedIframe = null;
		} else {
			if (currentExpandedIframe) toggleLargeView(currentExpandedIframe);
			box.classList.remove('result');
			box.classList.add('result-large');
			btn.textContent = '닫기';
			currentExpandedIframe = n;
			// 작은 프레임에서는 지도 영역 크기가 0에 가까워 경로 줌이 안 잡히므로,
			// 큰 크기 기준으로 지도가 다시 초기화되도록 iframe을 리로드
			const iframe = box.querySelector('.result-frame');
			if (iframe.src) iframe.src = iframe.src;
		}
	}

	// 줄 단위 세로 길이 조절: 하단 핸들을 드래그하면 같은 줄의 모든 프레임 높이가 함께 변경 (캡처용)
	document.querySelectorAll('.result').forEach(box => {
		const handle = document.createElement('div');
		handle.className = 'row-resize-handle';
		handle.title = '드래그하여 이 줄의 세로 길이 조절';
		box.appendChild(handle);
		handle.addEventListener('pointerdown', e => {
			e.preventDefault();
			handle.setPointerCapture(e.pointerId);
			const startY = e.clientY;
			const startH = box.querySelector('.result-body').offsetHeight;
			const rowTop = box.offsetTop;
			const rowBodies = Array.from(document.querySelectorAll('.result'))
				.filter(b => b.style.display !== 'none' && b.offsetTop === rowTop)
				.map(b => b.querySelector('.result-body'));
			const onMove = ev => {
				const h = Math.max(80, startH + (ev.clientY - startY));
				rowBodies.forEach(rb => { rb.style.height = h + 'px'; });
			};
			const onUp = () => {
				handle.removeEventListener('pointermove', onMove);
				handle.removeEventListener('pointerup', onUp);
			};
			handle.addEventListener('pointermove', onMove);
			handle.addEventListener('pointerup', onUp);
		});
	});



</script>

</body>
</html>
