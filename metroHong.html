<!DOCTYPE html>
<html lang="ko">

  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=9t8y33hyq8"></script>

#map { width: 100%; height: calc(100vh - 65px); resize: both; }

    /* ✅ 경계선 라벨 스타일 */

<body>
<h1 style="font-size: 20px; font-weight: bold; text-align: left; margin-left:10px">
    [루시퍼홍] 27탄 지하처르홍(그 어디에도 없는 지하철 노선도)
</h1>
<div id="map"></div>
<div id="checkbox-container"></div>

<!-- 
<div id="control-panel" style="position:absolute; top:10px; right:10px; background:white; padding:10px; border-radius:6px; z-index:1000; box-shadow:0 2px 6px rgba(0,0,0,0.2); font-family:sans-serif; font-size:13px;">
  <button id="start-btn">시작</button>
  <button id="reset-btn">리셋</button>
  <button id="copy-btn">복사</button>
  <pre id="output" style="margin-top:10px; max-height:300px; overflow:auto; white-space:pre-wrap;"></pre>
</div>  -->

<script>
const map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.5665, 126.9780),
  zoom: 13
});

const SIG_GEOJSON_PARTS = ["sig_from_emd_wgs84_utf8_2025-11-01_sggfields_part01.geojson", "sig_from_emd_wgs84_utf8_2025-11-01_sggfields_part02.geojson"];
const EMD_GEOJSON_PARTS = []; // EMD(읍면동) 경계 비활성화 - 필요 시 파일 경로 추가

let emdGeojsonRaw = null;
let emdPrepared = null;
let emdPolygons = [];
let emdLabels = [];
let emdRedrawTimer = null;
let emdBoundMap = null;

let sigGeojsonRaw = null;
let sigPrepared = null;
let sigPolygons = [];
let sigLabels = [];
let sigStyleMode = "default";

const lineCheckboxes = {};
const lineLayers = {};
const markers = [];
let lastLoadedData = null;

const container = document.getElementById('checkbox-container');

// 슬라이더 UI
const opacityWrapper = document.createElement('div');
opacityWrapper.style.marginBottom = '10px';

const opacityLabel = document.createElement('div');
opacityLabel.textContent = '지도 투명도';
opacityLabel.style.marginBottom = '4px';
opacityLabel.style.fontWeight = 'bold';

const opacityInput = document.createElement('input');
opacityInput.type = 'range';
opacityInput.min = 0;
opacityInput.max = 100;
opacityInput.value = 45; // ✅ 초기값을 30으로 설정
opacityInput.style.width = '100%';
opacityInput.title = '지도 이미지 투명도';

opacityWrapper.appendChild(opacityLabel);
opacityWrapper.appendChild(opacityInput);
container.prepend(opacityWrapper);

applyOpacity(); // ✅ 초기 투명도 적용


// 역명 표기 체크박스
const stationLabelToggle = document.createElement('label');
stationLabelToggle.style.display = 'block';
stationLabelToggle.style.marginTop = '10px';

const stationCheckbox = document.createElement('input');
stationCheckbox.type = 'checkbox';
stationCheckbox.checked = true;
stationCheckbox.style.marginRight = '4px';

stationLabelToggle.appendChild(stationCheckbox);
stationLabelToggle.appendChild(document.createTextNode('역명 표기'));
opacityWrapper.appendChild(stationLabelToggle);

// 투명도 적용 함수
function applyOpacity() {
  const opacity = opacityInput.value / 100;
  document.querySelectorAll('#map img').forEach(img => {
    img.style.opacity = opacity;
  });
}

opacityInput.addEventListener('input', applyOpacity);

// 지도 확대/축소 시에도 유지
const observer = new MutationObserver(() => {
  setTimeout(applyOpacity, 10);
});
observer.observe(document.getElementById('map'), { childList: true, subtree: true });

// 데이터 불러오기 — 홍부테스트와 같은 OSM 스냅 판(급행 정보 포함). 없으면 옛 손수 찍은 판으로 폴백
const METRO_DATA_URL = 'data-metro-line-osm.json';
const METRO_DATA_FALLBACK = 'data-metro-line-1.0.0.json';

// 역명 블록 모양 (홍부테스트와 동일)
const STA_FONT = 16, STA_PAD_X = 6, STA_MIN_CHARS = 3;
const __metroShortName = (n) => String(n || '').replace(/호선$/, '').replace(/^(수도권 전철|서울 지하철)\s*/, '');
// 급행 강조는 노선별로 켠다. 기본값은 9호선만(홍부테스트와 동일 — 사실상 1·9호선만 의미가 있다)
const EXPRESS_DEFAULT = ['9호선'];
const expressOn = new Set(EXPRESS_DEFAULT);
const expChecks = {};
const lineIdOf = (line) => line.line || (line.node && line.node[0] && line.node[0].station && line.node[0].station[0] && line.node[0].station[0].line) || '노선';
const hasExpress = (line) => Array.isArray(line.express) && line.express.length > 0;

fetch(METRO_DATA_URL)
  .then(res => { if (!res.ok) throw new Error('osm 판 없음'); return res.json(); })
  .catch(() => fetch(METRO_DATA_FALLBACK).then(res => res.json()))
  .then(data => {
    lastLoadedData = data;
    const lines = data.DATA;

    // 전체 선택/해제
    const allLabel = document.createElement('label');
    const allCheckbox = document.createElement('input');
    allCheckbox.type = 'checkbox';
    allCheckbox.checked = true;
    allLabel.appendChild(allCheckbox);
    allLabel.append(' 전체 선택 / 해제');
    container.appendChild(allLabel);

    // 급행 전체 선택/해제 — 글자에 지도와 같은 빨간 테두리를 둘러 그 자체가 범례가 되게 한다
    const exAllLabel = document.createElement('label');
    exAllLabel.style.cssText = 'display:flex;align-items:center;gap:6px;margin:4px 0;';
    const exAll = document.createElement('input');
    exAll.type = 'checkbox';
    const exAllText = document.createElement('span');
    exAllText.textContent = '급행 전체 선택 / 해제';
    exAllText.style.cssText = 'display:inline-block;margin:2px 3px;padding:0 5px;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #ff2424;line-height:1.4;';
    exAllLabel.appendChild(exAll);
    exAllLabel.appendChild(exAllText);
    container.appendChild(exAllLabel);
    container.appendChild(document.createElement('hr'));

    allCheckbox.addEventListener('click', () => {
      const isChecked = allCheckbox.checked;
      Object.entries(lineCheckboxes).forEach(([lineId, checkbox]) => {
        checkbox.checked = isChecked;
        lineLayers[lineId].forEach(obj => obj.setMap(isChecked ? map : null));
      });
      updateMarkers(lastLoadedData);
    });
    exAll.addEventListener('change', () => {
      lines.forEach((l) => {
        if (!hasExpress(l)) return;
        const id = lineIdOf(l);
        if (exAll.checked) expressOn.add(id); else expressOn.delete(id);
        if (expChecks[id]) expChecks[id].checked = exAll.checked;
      });
      updateMarkers(lastLoadedData);
    });

    // 노선별 UI 및 레이어
    lines.forEach(line => {
      const sections = line.node || [];
      const lineId = lineIdOf(line);

      if (!lineLayers[lineId]) {
        lineLayers[lineId] = [];

        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.gap = '6px';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.dataset.line = lineId;
        lineCheckboxes[lineId] = checkbox;

        const colorBox = document.createElement('span');
        colorBox.style.cssText = 'width:12px;height:12px;border-radius:2px;flex-shrink:0;background:' + (line.color || '#000');

        const labelText = document.createElement('span');
        labelText.textContent = lineId;

        label.appendChild(checkbox);
        label.appendChild(colorBox);
        label.appendChild(labelText);

        // 급행 자료가 있는 노선에만 오른쪽 끝에 [급행] 체크박스
        if (hasExpress(line)) {
          const wrap = document.createElement('span');
          wrap.style.cssText = 'margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#555;';
          wrap.title = lineId + ' 급행 정차역 ' + line.express.length + '곳을 빨간 테두리로 표시';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = expressOn.has(lineId);
          cb.addEventListener('click', (e) => e.stopPropagation());
          cb.addEventListener('change', (e) => {
            e.stopPropagation();
            if (cb.checked) expressOn.add(lineId); else expressOn.delete(lineId);
            exAll.checked = lines.every((l) => !hasExpress(l) || expressOn.has(lineIdOf(l)));
            updateMarkers(lastLoadedData);
          });
          expChecks[lineId] = cb;
          wrap.appendChild(cb);
          wrap.appendChild(document.createTextNode('급행'));
          label.appendChild(wrap);
        }
        container.appendChild(label);

        checkbox.addEventListener('change', () => {
          const isVisible = checkbox.checked;
          lineLayers[lineId].forEach(obj => obj.setMap(isVisible ? map : null));
          allCheckbox.checked = Object.values(lineCheckboxes).every(cb => cb.checked);
          updateMarkers(lastLoadedData);
        });
      }

      sections.forEach(section => {
        if (Array.isArray(section.NewVia)) {
          section.NewVia.forEach(pathArray => {
            const path = pathArray.map(([lat, lng]) => new naver.maps.LatLng(lat, lng));
            const polyline = new naver.maps.Polyline({
              path,
              map: map,
              strokeColor: line.color || '#000000',
              strokeWeight: 4,
              strokeOpacity: 0.9
            });
            lineLayers[lineId].push(polyline);
          });
        }
      });
    });

    exAll.checked = lines.some(hasExpress) && lines.every((l) => !hasExpress(l) || expressOn.has(lineIdOf(l)));
    updateMarkers(lastLoadedData);
  });


// 마커 갱신 — 홍부테스트와 같은 방식
// · 환승역은 지나는 노선 수만큼 블록을 세로로 쌓고 각 블록을 그 노선 색으로 칠한다
// · 종점에는 그 블록 오른쪽에 노선명 배지 (경로 끝점이 역 반경 250m 안에 하나뿐인 역)
// · 급행 정차역은 블록 밖에 빨간 테두리
// · 같은 이름이라도 600m 넘게 떨어지면 다른 역으로 본다 (5호선 양평 ↔ 경의중앙선 양평 53km)
function updateMarkers(data) {
  markers.forEach(({ marker }) => marker.setMap(null));
  markers.length = 0;
  if (!data) return;

  const showStations = stationCheckbox.checked;
  const SAME_M = 600, END_R = 250;
  const dist = (a, b) => Math.hypot((a.lat - b.lat) * 111000, (a.lng - b.lng) * 88000);
  const staMap = new Map();

  data.DATA.forEach((line) => {
    const id = lineIdOf(line);
    const cb = lineCheckboxes[id];
    if (!cb || !cb.checked) return;
    const col = line.color || '#333';

    const endPts = [];
    (line.node || []).forEach((nd) => (nd.NewVia || []).forEach((pth) => {
      if (!pth || pth.length < 2) return;
      endPts.push(pth[0], pth[pth.length - 1]);
    }));
    const endNear = (la, ln) => endPts.reduce((n, q) =>
      n + (Math.hypot((q[0] - la) * 111000, (q[1] - ln) * 88000) <= END_R ? 1 : 0), 0);
    const ends = new Set();
    (line.node || []).forEach((nd) => (nd.station || []).forEach((s) => {
      if (endNear(Number(s.lat), Number(s.lng)) === 1) ends.add(s.name);
    }));
    const exSet = new Set(Array.isArray(line.express) ? line.express : []);

    (line.node || []).forEach((nd) => (nd.station || []).forEach((s) => {
      const la = Number(s.lat), ln = Number(s.lng);
      let arr = staMap.get(s.name);
      if (!arr) { arr = []; staMap.set(s.name, arr); }
      let e = arr.find((x) => dist(x, { lat: la, lng: ln }) <= SAME_M);
      if (!e) { e = { lat: la, lng: ln, colors: [], lines: [], endLines: [], expLines: [] }; arr.push(e); }
      if (!e.lines.includes(id)) { e.colors.push(col); e.lines.push(id); }
      if (ends.has(s.name) && !e.endLines.some((b) => b.name === id)) e.endLines.push({ name: id, color: col });
      if (exSet.has(s.name) && !e.expLines.includes(id)) e.expLines.push(id);
    }));
  });

  staMap.forEach((arr, name) => arr.forEach((e) => {
    const mkBadge = (c, lineName, abs) =>
      '<div title="' + lineName + ' 종점 (' + name + ')" style="' + (abs ? 'position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:3px;' : '') +
      'background:' + c + ';color:#fff;border:2px solid #fff;border-radius:999px;padding:0 9px;font-size:' + (STA_FONT - 4) + 'px;line-height:' + (STA_FONT + 1) +
      'px;font-weight:bold;white-space:nowrap;box-shadow:2px 2px 4px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.4)">' + __metroShortName(lineName) + '</div>';
    const blocks = e.colors.map((c, i) => {
      const lineName = e.lines[i];
      const isEnd = (e.endLines || []).some((b) => b.name === lineName);
      const isExp = expressOn.has(lineName) && (e.expLines || []).includes(lineName);
      if (!showStations) return isEnd ? mkBadge(c, lineName, false) : '';
      // 급행 테두리는 블록 밖으로 3px 번지므로 아래 여백을 줘야 다음 블록에 가려지지 않는다
      const expRing = isExp ? 'box-shadow:0 0 0 3px #ff2424,2px 2px 4px rgba(0,0,0,.35);margin-bottom:3px;' : '';
      const block = '<div title="' + lineName + ' · ' + name + (isExp ? ' · 급행 정차' : '') + '" style="' + expRing +
        'background:' + c + ';min-width:' + (STA_FONT * STA_MIN_CHARS) + 'px;text-align:center;padding:2px ' + STA_PAD_X +
        'px;border:2px solid #fff;border-radius:6px;font-size:' + STA_FONT + 'px;line-height:' + (STA_FONT + 4) +
        'px;font-weight:bold;color:#fff;white-space:nowrap;' + (isExp ? '' : 'box-shadow:2px 2px 4px rgba(0,0,0,.35);') +
        'text-shadow:0 1px 2px rgba(0,0,0,.45)">' + name + '</div>';
      if (!isEnd) return block;
      return '<div style="position:relative;display:inline-flex;align-items:center">' + block + mkBadge(c, lineName, true) + '</div>';
    }).join('');
    if (!blocks) return;
    const marker = new naver.maps.Marker({
      position: new naver.maps.LatLng(e.lat, e.lng),
      map: map,
      clickable: false,
      zIndex: 4,
      icon: {
        content: '<div title="' + name + ' (' + e.lines.join(', ') + ')" style="transform:translate(-50%,-50%);display:inline-flex;flex-direction:column;align-items:center;gap:1px">' + blocks + '</div>',
        anchor: new naver.maps.Point(0, 0)
      }
    });
    markers.push({ marker, name });
  }));
}

// 역명 표기 토글 시 마커 갱신
stationCheckbox.addEventListener('change', () => {
  updateMarkers(lastLoadedData);
});

/// 좌표구하기
let isRecording = false;
const coords = [];
const outputEl = document.getElementById('output');

// 시작 버튼 클릭 시 기록 시작
if (document.getElementById('start-btn')) {
  document.getElementById('start-btn').addEventListener('click', () => {
    isRecording = true;
  });
}

// 리셋 버튼 클릭 시 초기화
if (document.getElementById('reset-btn')) {
  document.getElementById('reset-btn').addEventListener('click', () => {
    isRecording = false;
    coords.length = 0;
    if (outputEl) outputEl.textContent = '';
  });
}

// 복사 버튼 클릭 시 클립보드로 복사
if (document.getElementById('copy-btn')) {
  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = outputEl && outputEl.textContent ? outputEl.textContent.trim() : '';
    if (!text) {
      alert("복사할 내용이 없습니다.");
      return;
    }
    navigator.clipboard.writeText(text)
      .then(() => alert("좌표가 복사되었습니다!"))
      .catch(err => alert("복사 실패: " + err));
  });
}

// 지도 클릭 시 좌표 저장 및 마커 표시
naver.maps.Event.addListener(map, 'click', function(e) {
  if (!isRecording) return;

  const lat = parseFloat(e.coord.lat().toFixed(5));
  const lng = parseFloat(e.coord.lng().toFixed(5));
  coords.push([lat, lng]);

  // 클릭한 위치에 마커 표시
  new naver.maps.Marker({
    position: new naver.maps.LatLng(lat, lng),
    map: map,
    icon: {
      content: `<div style="
        background: yellow;
        padding: 2px 4px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: bold;
        color: black;
        border: 1px solid #333;
      ">📍</div>`,
      size: new naver.maps.Size(24, 24),
      anchor: new naver.maps.Point(12, 12)
    }
  });

  // 출력창에 누적 좌표 표시
  outputEl.textContent = coords.map(c => `[${c[0]}, ${c[1]}]`).join(',\n') + ',';
});

// ==============================
// ✅ 경계선 렌더링 함수 (hongbutest.html에서 추출)
// ==============================

function bboxIntersects(bounds, bbox) {
  const sw = bounds.getSW();
  const ne = bounds.getNE();
  const minLng = bbox[0], minLat = bbox[1], maxLng = bbox[2], maxLat = bbox[3];
  if (maxLng < sw.lng()) return false;
  if (minLng > ne.lng()) return false;
  if (maxLat < sw.lat()) return false;
  if (minLat > ne.lat()) return false;
  return true;
}

function _prepareFeatureBBoxes(featureCollection) {
  const feats = featureCollection?.features || [];
  return feats.map(f => {
    const geom = f.geometry;
    const polys = (geom.type === "MultiPolygon") ? geom.coordinates : [geom.coordinates];
    let minLng=Infinity, minLat=Infinity, maxLng=-Infinity, maxLat=-Infinity;
    for (const poly of polys) {
      const ring = poly[0];
      for (const pt of ring) {
        const lng = pt[0], lat = pt[1];
        if (lng < minLng) minLng = lng;
        if (lat < minLat) minLat = lat;
        if (lng > maxLng) maxLng = lng;
        if (lat > maxLat) maxLat = lat;
      }
    }
    return { geometry: geom, properties: f.properties || {}, bbox: [minLng, minLat, maxLng, maxLat] };
  });
}

function prepareSigPreparedOnce() {
  if (sigPrepared) return;
  if (!sigGeojsonRaw) throw new Error("SIG GeoJSON not loaded");
  sigPrepared = _prepareFeatureBBoxes(sigGeojsonRaw);
}

function prepareEmdPreparedOnce() {
  if (emdPrepared) return;
  if (!emdGeojsonRaw) throw new Error("EMD GeoJSON not loaded");
  emdPrepared = _prepareFeatureBBoxes(emdGeojsonRaw);
}

// ✅ polylabel 알고리즘과 지오메트리 헬퍼 함수들
function _emd_pointToPolygonDist(x, y, polygon) {
  let inside = false;
  let minDistSq = Infinity;
  for (let k = 0; k < polygon.length; k++) {
    const ring = polygon[k];
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const ax = ring[i][0], ay = ring[i][1];
      const bx = ring[j][0], by = ring[j][1];
      const intersect = ((ay > y) !== (by > y)) && (x < (bx - ax) * (y - ay) / (by - ay + 0.0) + ax);
      if (intersect) inside = !inside;
      const dx = bx - ax, dy = by - ay;
      let t = ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy);
      t = Math.max(0, Math.min(1, t));
      const px = ax + t * dx, py = ay + t * dy;
      const distSq = (x - px) * (x - px) + (y - py) * (y - py);
      if (distSq < minDistSq) minDistSq = distSq;
    }
  }
  const dist = Math.sqrt(minDistSq);
  return inside ? dist : -dist;
}

function _emd_polylabel(polygon, precision = 1e-5) {
  const outer = polygon[0];
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of outer) {
    const x = p[0], y = p[1];
    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (x > maxX) maxX = x;
    if (y > maxY) maxY = y;
  }
  const width = maxX - minX;
  const height = maxY - minY;
  const cellSize = Math.min(width, height);
  if (!isFinite(cellSize) || cellSize === 0) return outer[0];
  function Cell(x, y, h, d) {
    this.x = x; this.y = y; this.h = h;
    this.d = d;
    this.max = this.d + this.h * Math.SQRT2;
  }
  let h = cellSize / 2;
  let cells = [];
  for (let x = minX; x < maxX; x += cellSize) {
    for (let y = minY; y < maxY; y += cellSize) {
      const cx = x + h, cy = y + h;
      const d = _emd_pointToPolygonDist(cx, cy, polygon);
      cells.push(new Cell(cx, cy, h, d));
    }
  }
  let best = new Cell((minX + maxX) / 2, (minY + maxY) / 2, 0, _emd_pointToPolygonDist((minX + maxX) / 2, (minY + maxY) / 2, polygon));
  const fp = outer[0];
  const fpCell = new Cell(fp[0], fp[1], 0, _emd_pointToPolygonDist(fp[0], fp[1], polygon));
  if (fpCell.d > best.d) best = fpCell;
  cells.sort((a, b) => b.max - a.max);
  while (cells.length) {
    const cell = cells.shift();
    if (cell.d > best.d) best = cell;
    if (cell.max - best.d <= precision) continue;
    const h2 = cell.h / 2;
    const children = [[cell.x - h2, cell.y - h2], [cell.x + h2, cell.y - h2], [cell.x - h2, cell.y + h2], [cell.x + h2, cell.y + h2]];
    for (const c of children) {
      const cx = c[0], cy = c[1];
      const d = _emd_pointToPolygonDist(cx, cy, polygon);
      const child = new Cell(cx, cy, h2, d);
      let idx = 0;
      while (idx < cells.length && cells[idx].max > child.max) idx++;
      cells.splice(idx, 0, child);
    }
  }
  return [best.x, best.y];
}

function _emd_clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function _emd_aspectFromBbox(bbox){
  const [minLng, minLat, maxLng, maxLat] = bbox;
  const w = Math.max(1e-12, (maxLng - minLng));
  const h = Math.max(1e-12, (maxLat - minLat));
  return w > h ? (w / h) : (h / w);
}

function _emd_lerp(a, b, t){
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
}

function _emd_ringCentroidLngLat(ring){
  let area = 0, cx = 0, cy = 0;
  const n = ring.length;
  if (n < 3) return null;
  for (let i=0;i<n;i++){
    const [x1,y1]=ring[i];
    const [x2,y2]=ring[(i+1)%n];
    const a = x1*y2 - x2*y1;
    area += a;
    cx += (x1+x2)*a;
    cy += (y1+y2)*a;
  }
  area *= 0.5;
  if (Math.abs(area) < 1e-12) return null;
  return [cx/(6*area), cy/(6*area)];
}

function getLabelLatLngByPolylabel(geometry, bbox) {
  const polys = (geometry.type === "MultiPolygon") ? geometry.coordinates : [geometry.coordinates];
  let bestPoly = polys[0];
  let bestArea = -1;
  for (const p of polys) {
    const ring = p[0];
    let a = 0;
    for (let i = 0; i < ring.length; i++) {
      const [x1, y1] = ring[i];
      const [x2, y2] = ring[(i + 1) % ring.length];
      a += (x1 * y2 - x2 * y1);
    }
    a = Math.abs(a * 0.5);
    if (a > bestArea) {
      bestArea = a;
      bestPoly = p;
    }
  }
  const pl = _emd_polylabel(bestPoly, 1e-5);
  const ct = _emd_ringCentroidLngLat(bestPoly[0]) || pl;
  const ar = _emd_aspectFromBbox(bbox);
  const t = _emd_clamp((ar - 1) / 3, 0.2, 0.8);
  const blended = _emd_lerp(pl, ct, t);
  return new naver.maps.LatLng(blended[1], blended[0]);
}

// ✅ 라벨 폰트 크기 자동 계산
function _label_getBboxPixelSize(bbox, map){
  try{
    const proj = map && map.getProjection && map.getProjection();
    if (!proj) return null;
    const sw = proj.fromCoordToOffset(new naver.maps.LatLng(bbox[1], bbox[0]));
    const ne = proj.fromCoordToOffset(new naver.maps.LatLng(bbox[3], bbox[2]));
    return { width: Math.abs(ne.x - sw.x), height: Math.abs(ne.y - sw.y) };
  }catch(e){
    return null;
  }
}

function _label_measureTextPx(text, fontSizePx, fontWeight = 800, fontFamily = "sans-serif") {
  const canvas = _label_measureTextPx._canvas || (_label_measureTextPx._canvas = document.createElement("canvas"));
  const ctx = canvas.getContext("2d");
  ctx.font = `${fontWeight} ${fontSizePx}px ${fontFamily}`;
  const w = ctx.measureText(text).width;
  const h = fontSizePx * 1.15;
  return { w, h };
}

function _label_calcFitFontSize({
  bbox,
  text,
  map,
  paddingPx = 8,
  min = 8,
  max = 40,
  fontWeight = 800,
  fontFamily = "sans-serif",
  hideIfTooSmall = true
}) {
  const px = _label_getBboxPixelSize(bbox, map);
  if (!px) return min;
  const availW = Math.max(0, px.width  - paddingPx * 2);
  const availH = Math.max(0, px.height - paddingPx * 2);
  if (hideIfTooSmall && (availW < 10 || availH < 10)) return 0;
  let lo = min, hi = max, best = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const m = _label_measureTextPx(text, mid, fontWeight, fontFamily);
    if (m.w <= availW && m.h <= availH) {
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  if (best === 0) return hideIfTooSmall ? 0 : min;
  return best;
}

// ✅ EMD 경계선 다시 그리기
function redrawEmdByBounds() {
  try { prepareEmdPreparedOnce(); } catch(e) { console.error('redrawEmdByBounds prepare 실패:', e); return; }
  if (!map) return;
  if (!shouldShowEmdBoundary()) {
    clearEmdPolygons();
    clearEmdLabels();
    return;
  }
  const bounds = map.getBounds();
  if (!bounds) return;
  clearEmdPolygons();
  clearEmdLabels();
  const labelCap = 200;
  const labelCandidates = [];
  for (const f of emdPrepared) {
    if (!bboxIntersects(bounds, f.bbox)) continue;
    drawEmdGeometry(f.geometry);
    if (map.getZoom() >= 15 && labelCandidates.length < labelCap) {
      const name = (f.properties && (f.properties.A2 || f.properties.name || f.properties.EMD_NM)) || "";
      if (name) labelCandidates.push({ name, bbox: f.bbox, geometry: f.geometry });
    }
  }
  let minFit = Infinity;
  for (const c of labelCandidates) {
    const fs = _label_calcFitFontSize({
      bbox: c.bbox,
      text: c.name,
      map,
      paddingPx: 8,
      min: 9,
      max: 20,
      hideIfTooSmall: true
    });
    if (fs > 0 && fs < minFit) minFit = fs;
  }
  if (!isFinite(minFit) || minFit <= 0) return;
  let uniformFit = minFit;
  const maxLabelSize = window.matchMedia && window.matchMedia('(max-width: 768px)').matches ? 18 : 20;
  uniformFit = Math.min(uniformFit, maxLabelSize);
  for (const c of labelCandidates) {
    const latlng = getLabelLatLngByPolylabel(c.geometry, c.bbox);
    addEmdLabel(latlng, c.name, c.bbox, uniformFit);
  }
}

  if (!map || !sigPrepared) return;

    if (labelCandidates.length < labelCap) {

      if (name) labelCandidates.push({ name, bbox: f.bbox, geometry: f.geometry });

  for (const c of labelCandidates) {

  let uniformFit = minFit;

// ✅ 줌 레벨에 따른 경계 표시 제어
function redrawBoundaryByZoom() {
  if (!map) return;
  const z = map.getZoom();
  const boundaryOn = isBoundaryCheckboxOn();
  
  // EMD(읍면동) 항상 비활성화 - SIG(시군구)만 표시

}

}

  try { prepareSigPreparedOnce(); } catch (e) {}
  const feats = (sigPrepared || []).filter((f) =>
    keep.has(String(f.properties && (f.properties.sgg_cd || f.properties.SIG_CD) || '').substring(0, 5)));
  if (!feats.length) return;
  const b = map.getBounds();
  if (!b) return;
  const sw = b.getSW(), ne = b.getNE();
  const mY = (la) => Math.log(Math.tan(Math.PI / 4 + (la * Math.PI / 180) / 2));
  const mSW = mY(sw.lat()), mNE = mY(ne.lat()), lngRange = ne.lng() - sw.lng();
  const toXY = (lat, lng) => [((lng - sw.lng()) / lngRange) * w, ((mNE - mY(lat)) / (mNE - mSW)) * h];
  ctx.save();
  ctx.fillStyle = HL_DIM;
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  for (const f of feats) {
    const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    for (const poly of polys) {
      const ring = poly[0];
      if (!ring || ring.length < 3) continue;
      ctx.beginPath();
      const p0 = toXY(ring[0][1], ring[0][0]);
      ctx.moveTo(p0[0], p0[1]);
      for (let i = 1; i < ring.length; i++) { const p = toXY(ring[i][1], ring[i][0]); ctx.lineTo(p[0], p[1]); }
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
}
// 마우스 추적: document 에 붙인다(지도 위 마커 위에서도 잡히고, 지도 내부 DOM 이 바뀌어도 위치를 잃지 않는다)
(() => {
  let last = 0, timer = null;
  const setHover = (code) => {
    if (code === __hoverSgg5) return;
    __hoverSgg5 = code;
    if (__pinnedSgg.size) return;      // 고정이 있으면 호버로 다시 그리지 않는다
    try { __hlDraw(); } catch (e) {}
  };
  const process = () => {
    if (!__hoverPt || !map || !__hlOn() || __hoverDragging) { setHover(null); return; }
    setHover(__sggAtClientPoint(__hoverPt.x, __hoverPt.y));
  };
  window.__hlProcess = process;
  document.addEventListener('mousemove', (ev) => {
    __hoverPt = { x: ev.clientX, y: ev.clientY };
    if (__hoverDragging) return;
    const now = Date.now(), wait = 80 - (now - last);
    if (wait <= 0) { last = now; process(); }
    else if (!timer) { timer = setTimeout(() => { timer = null; last = Date.now(); process(); }, wait); }
  }, { passive: true, capture: true });
  // Ctrl(⌘)+클릭 = 고정 토글 / 그냥 클릭 = 전부 해제. 끌고 난 뒤의 클릭은 무시(5px)
  let down = null;
  document.addEventListener('mousedown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; }, true);
  document.addEventListener('click', (ev) => {
    if (!__hlOn()) return;
    if (down && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 5) return;
    const mapEl = document.getElementById('map');
    if (!mapEl || !mapEl.contains(ev.target)) return;
    if (ev.ctrlKey || ev.metaKey) {
      const code = __sggAtClientPoint(ev.clientX, ev.clientY);
      if (!code) return;
      if (__pinnedSgg.has(code)) __pinnedSgg.delete(code); else __pinnedSgg.add(code);
      ev.preventDefault(); ev.stopPropagation();
    } else if (__pinnedSgg.size) {
      __pinnedSgg.clear();
    } else return;
    try { __hlDraw(); } catch (e) {}
  }, true);
})();
// 지도 이동·줌 뒤에도 마지막 마우스 위치로 다시 판정한다
(() => {
  let bound = null;
  setInterval(() => {
    if (!map || map === bound || !window.__hlProcess) return;
    bound = map;
    const again = (d) => setTimeout(() => { if (!__hoverDragging) { window.__hlProcess(); try { __hlDraw(); } catch (e) {} } }, d || 80);
    try {
      naver.maps.Event.addListener(map, 'dragstart', () => { __hoverDragging = true; });
      naver.maps.Event.addListener(map, 'dragend', () => { __hoverDragging = false; again(120); });
      naver.maps.Event.addListener(map, 'idle', () => again(80));
      naver.maps.Event.addListener(map, 'zoom_changed', () => again(150));
    } catch (e) {}
  }, 1000);
})();

// ✅ 경계선 체크박스 추가
const boundaryLabel = document.createElement('label');
boundaryLabel.style.marginTop = '10px';

const boundaryCheckbox = document.createElement('input');
boundaryCheckbox.type = 'checkbox';
boundaryCheckbox.id = 'toggleEmdBoundary';
boundaryCheckbox.checked = false;
boundaryCheckbox.style.marginRight = '4px';

boundaryLabel.appendChild(boundaryCheckbox);
boundaryLabel.appendChild(document.createTextNode('시군구경계'));
container.appendChild(boundaryLabel);

// ✅ 하이라이트 체크박스 — [시군구경계] 를 켜야 쓸 수 있고, 처음 켤 때만 자동으로 켜진다
const hlLabel = document.createElement('label');
hlLabel.id = 'sggHighlightWrap';
hlLabel.style.cssText = 'display:block;opacity:0.45;';
hlLabel.title = '시군구경계를 켜야 사용할 수 있습니다';
const hlCheckbox = document.createElement('input');
hlCheckbox.type = 'checkbox';
hlCheckbox.id = 'toggleSggHighlight';
hlCheckbox.style.marginRight = '4px';
hlLabel.appendChild(hlCheckbox);
hlLabel.appendChild(document.createTextNode('하이라이트'));
container.appendChild(hlLabel);

function __hlUpdateVis() {
  const on = isBoundaryCheckboxOn();
  hlLabel.style.opacity = on ? '' : '0.45';
  hlLabel.title = on ? '마우스를 올린 시군구만 원래 색으로 두고 나머지를 어둡게 · Ctrl+클릭으로 여러 개 고정, 그냥 클릭하면 해제'
                     : '시군구경계를 켜야 사용할 수 있습니다';
  hlCheckbox.disabled = !on;
  if (on && !hlCheckbox.dataset.inited) {   // 처음 켤 때만 기본값 켬
    hlCheckbox.dataset.inited = '1';
    if (!hlCheckbox.checked) hlCheckbox.checked = true;
  }
  if (!on) { __hoverSgg5 = null; __pinnedSgg.clear(); }
  try { __hlDraw(); } catch (e) {}
}
hlCheckbox.addEventListener('change', () => {
  if (!hlCheckbox.checked) { __hoverSgg5 = null; __pinnedSgg.clear(); }
  try { window.__hlProcess && window.__hlProcess(); __hlDraw(); } catch (e) {}
});
boundaryCheckbox.addEventListener('change', __hlUpdateVis);
__hlUpdateVis();


boundaryCheckbox.addEventListener('change', () => {
  scheduleEmdRedraw();
});

// ✅ 초기 경계선 로드 및 바인딩
ensureEmdLayerBoundToMap().catch(err => console.error("EMD layer binding failed:", err));

</script>
