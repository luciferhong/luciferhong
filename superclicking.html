<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta name="Yeti" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 광클이 될 상인가</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f3f3;
        }

        .container {
            text-align: center;
        }

        .number-display {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        #captchaCanvas {
            display: none;
            margin: 0 auto 1rem;
            border: 1px solid #bbb;
        }

        /* 입력칸·입력 버튼·남은 시간을 같은 높이 한 줄로 */
        .input-section {
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .input-section button,
        .input-section input {
            margin: 0;
            height: 2.4rem;
            box-sizing: border-box;
        }

        .input-section input {
            font-size: 1rem;
            padding: 0 0.5rem;
        }

        .input-section {
            margin-top: 1rem;
        }

        .message {
            margin-top: 1rem;
            font-size: 1.2rem;
        }

        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>
            <input type="number" id="limitSec" value="4" min="1" max="60" step="1" style="width: 3.5em; font-size: 1rem; text-align: center;">초 안에 입력하지 않으면 다음 숫자로 넘어갑니다.
        </p>
        <div id="progress" style="display: none; font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem;"></div>
        <div class="number-display" id="numberDisplay">시작을 누르세요</div>
        <canvas id="captchaCanvas"></canvas>
        <button onclick="startGame()" id="startButton">시작</button>
        <div class="input-section" style="display: none;" id="inputSection">
            <input type="text" id="userInput" maxlength="6" placeholder="숫자 입력" onkeydown="handleEnter(event)">
            <button onclick="checkAnswer()">입력</button>
            <span id="countdown" style="display: inline-block; min-width: 4em; text-align: left; font-size: 1.4rem; font-weight: bold; color: #d33;"></span>
        </div>
        <div class="message" id="message"></div>
        <div class="message" id="result" style="font-weight: bold;"></div>
    </div>

    <script>
        let randomNumber;
        let timer;
        let countdownTimer;
        let attempts = 0;
        let successes = 0;
        let totalTime = 0;
        let startTime;
        let gameOverAt = 0;

        // 제한 시간(초): 사용자가 고친 값은 이 브라우저에 기억, 기본 4
        const limitInput = document.getElementById('limitSec');
        try {
            const saved = localStorage.getItem('superclickingLimitSec');
            if (saved) limitInput.value = saved;
        } catch (e) {}
        limitInput.addEventListener('change', () => {
            limitInput.value = getLimitSec();
            try { localStorage.setItem('superclickingLimitSec', limitInput.value); } catch (e) {}
        });

        function getLimitSec() {
            const v = parseFloat(limitInput.value);
            return v > 0 ? Math.min(v, 60) : 4;
        }

        function startGame() {
            if (attempts >= 10) {
                document.getElementById('result').textContent = `끝! 10번 중 ${successes}번 성공 · 총 ${(totalTime / 1000).toFixed(2)}초`;
                gameOverAt = Date.now();
                document.getElementById('message').textContent = '';
                document.getElementById('numberDisplay').textContent = '시작을 누르세요';
                document.getElementById('numberDisplay').style.display = '';
                document.getElementById('captchaCanvas').style.display = 'none';
                document.getElementById('progress').style.display = 'none';
                document.getElementById('startButton').style.display = '';
                document.getElementById('inputSection').style.display = 'none';
                attempts = 0;
                successes = 0;
                totalTime = 0;
                return;
            }

            randomNumber = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('numberDisplay').style.display = 'none';
            drawCaptcha(randomNumber);
            document.getElementById('progress').textContent = `총 10회 중 ${attempts + 1}회`;
            document.getElementById('progress').style.display = '';
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('inputSection').style.display = 'flex';
            if (attempts === 0) {
                document.getElementById('message').textContent = '';
                document.getElementById('result').textContent = '';
            }
            document.getElementById('userInput').value = '';
            document.getElementById('userInput').focus();
            
            // Record start time
            startTime = new Date();
            const limitMs = getLimitSec() * 1000;

            // Start the timer
            clearTimeout(timer);
            clearInterval(countdownTimer);
            const countdown = document.getElementById('countdown');
            const tick = () => {
                const left = Math.max(0, limitMs - (new Date() - startTime));
                countdown.textContent = (left / 1000).toFixed(1) + '초';
            };
            tick();
            countdownTimer = setInterval(tick, 50);
            timer = setTimeout(() => {
                clearInterval(countdownTimer);
                document.getElementById('message').textContent = '시간 초과! 다음';
                document.getElementById('inputSection').style.display = 'none';
                attempts++;
                startGame();
            }, limitMs);
        }

        // 예매 사이트 보안문자처럼: 회색 그라데이션 바탕 + 그림자 진 굵은 숫자 + 숫자를 가로지르는 선
        function drawCaptcha(text) {
            const W = 280, H = 80;
            const canvas = document.getElementById('captchaCanvas');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const rand = (a, b) => a + Math.random() * (b - a);

            const bg = ctx.createLinearGradient(0, 0, W, H * 0.6);
            bg.addColorStop(0, '#2b2b2b');
            bg.addColorStop(0.45, '#9a9a9a');
            bg.addColorStop(1, '#ffffff');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            ctx.font = 'bold 54px Arial Black, Arial, sans-serif';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            const step = 38;
            let x = (W - step * (text.length - 1)) / 2;
            for (const ch of text) {
                ctx.save();
                ctx.translate(x + rand(-2, 2), H / 2 + rand(-4, 4));
                ctx.rotate(rand(-0.15, 0.15));
                ctx.shadowColor = 'rgba(0,0,0,0.55)';
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;
                ctx.shadowBlur = 3;
                ctx.fillStyle = '#111';
                ctx.fillText(ch, 0, 0);
                ctx.restore();
                x += step;
            }

            // 왼쪽 아래에서 오른쪽 위로 뻗는 선 3개(숫자를 덮어 읽기 어렵게)
            ctx.strokeStyle = '#111';
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                ctx.lineWidth = rand(2, 3.5);
                ctx.beginPath();
                ctx.moveTo(rand(30, 110), rand(H * 0.35, H * 0.95));
                ctx.lineTo(W, rand(H * 0.05, H * 0.85));
                ctx.stroke();
            }
        }

        function checkAnswer() {
            const userInput = document.getElementById('userInput').value;
            clearTimeout(timer); // Stop the timer
            clearInterval(countdownTimer);

            const endTime = new Date();
            const elapsedTime = endTime - startTime;
            totalTime += elapsedTime;

            if (userInput === randomNumber) {
                document.getElementById('message').textContent = `성공! ${(elapsedTime / 1000).toFixed(2)}초`;
                successes++;
            } else {
                document.getElementById('message').textContent = '실패! 숫자가 틀렸습니다.';
            }

            document.getElementById('inputSection').style.display = 'none';
            attempts++;
            startGame();
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                event.stopPropagation();
                checkAnswer();
            }
        }

        // 대기 상태(입력창 숨김)에서 엔터를 누르면 Start
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') return;
            const tag = (event.target.tagName || '').toUpperCase();
            if (tag === 'BUTTON' || tag === 'INPUT') return; // 버튼·입력창은 자체 처리(이중 실행 방지)
            if (document.getElementById('inputSection').style.display !== 'none') return;
            if (Date.now() - gameOverAt < 1500) return; // 마지막 답 직후 엔터 연타로 결과가 바로 사라지지 않게

            event.preventDefault();
            startGame();
        });
    </script>
</body>
</html>
