<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta name="Yeti" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 광클이 될 상인가</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            color: #222;
            background: #eef2fb;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px 28px 28px;
            border-radius: 14px;
            border: 1px solid #dfe5f3;
            border-top: 4px solid #4a63d8;
            background: #fff;
            box-shadow: 0 4px 16px rgba(40, 60, 140, 0.08);
            text-align: center;
        }

        .title {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .sub {
            margin: 6px 0 18px;
            color: #777;
            font-size: 0.9rem;
        }

        .setting {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            background: #eef2fd;
            color: #4a5578;
            font-size: 0.9rem;
        }

        .setting input {
            width: 3.2em;
            height: 1.9rem;
            border: 1px solid #c8d2f0;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            color: #4a63d8;
            background: #fff;
        }

        .stage {
            margin-top: 22px;
        }

        .number-display {
            padding: 30px 0 26px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #4a63d8;
        }

        /* 회차 — 동그라미 10개(맞음 초록·틀림 빨강·지금 진회색 테두리) */
        .progress {
            display: none;
            margin-bottom: 14px;
        }

        .progress-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a63d8;
            margin-bottom: 8px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e1e6f3;
        }

        .dots span.ok { background: #3fa56b; }
        .dots span.fail { background: #e06666; }
        .dots span.now { background: #fff; box-shadow: inset 0 0 0 2px #4a63d8; }

        #captchaCanvas {
            display: none;
            max-width: 100%;
            margin: 0 auto;
            border-radius: 6px;
            border: 1px solid #d0d4da;
        }


        button {
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        #startButton {
            margin-top: 6px;
            padding: 12px 48px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: #4a63d8;
        }

        #startButton:hover { background: #3c54c4; }

        .hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #999;
        }

        /* 입력칸·입력 버튼·남은 시간을 같은 높이 한 줄로 */
        .input-section {
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .input-section input,
        .input-section button {
            margin: 0;
            height: 2.6rem;
            border-radius: 8px;
        }

        .input-section input {
            width: 9.5em;
            padding: 0 12px;
            border: 1px solid #d0d4da;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-align: center;
            outline: none;
            transition: border-color 0.15s;
        }

        .input-section input:focus { border-color: #4a63d8; box-shadow: 0 0 0 3px rgba(74, 99, 216, 0.15); }

        .input-section button {
            padding: 0 18px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: #4a63d8;
        }

        .input-section button:hover { background: #3c54c4; }

        #countdown {
            min-width: 3.4em;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4a63d8;
            font-variant-numeric: tabular-nums;
            text-align: left;
        }

        #countdown.hurry { color: #e06666; }

        .message {
            min-height: 1.6em;
            margin-top: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #555;
        }

        .message.ok { color: #2f9160; }
        .message.fail { color: #d04f4f; }
        .message.timeout { color: #d08a1e; }

        .result {
            display: none;
            margin-top: 18px;
            padding: 18px;
            border-radius: 10px;
            background: #eef2fd;
        }

        .result .big {
            font-size: 2rem;
            font-weight: 700;
            color: #4a63d8;
        }

        .result .big small {
            font-size: 1rem;
            color: #888;
        }

        .result .time {
            margin-top: 4px;
            color: #555;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">내가 광클이 될 상인가</h1>
        <p class="sub">보안문자 6자리를 최대한 빨리 입력하세요 (10회)</p>
        <div class="setting">
            <input type="number" id="limitSec" value="4" min="1" max="60" step="1"><span>초 안에 입력하지 않으면<br>다음 숫자로 넘어갑니다.</span>
        </div>
        <div class="stage">
            <div class="progress" id="progress">
                <div class="progress-text" id="progressText"></div>
                <div class="dots" id="dots"></div>
            </div>
            <div class="number-display" id="numberDisplay">준비되셨나요?</div>
            <canvas id="captchaCanvas"></canvas>
            <button onclick="startGame()" id="startButton">시작</button>
            <div class="hint" id="hint">Enter 키로도 시작할 수 있어요</div>
            <div class="input-section" style="display: none;" id="inputSection">
                <input type="text" id="userInput" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="숫자 6자리" onkeydown="handleEnter(event)">
                <button onclick="checkAnswer()">입력</button>
                <span id="countdown"></span>
            </div>
            <div class="message" id="message"></div>
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        let randomNumber;
        let timer;
        let countdownTimer;
        let attempts = 0;
        let successes = 0;
        let totalTime = 0;
        let startTime;
        let gameOverAt = 0;
        let history = []; // 회차별 성공 여부

        // 제한 시간(초): 사용자가 고친 값은 이 브라우저에 기억, 기본 4
        const limitInput = document.getElementById('limitSec');
        try {
            const saved = localStorage.getItem('superclickingLimitSec');
            if (saved) limitInput.value = saved;
        } catch (e) {}
        limitInput.addEventListener('change', () => {
            limitInput.value = getLimitSec();
            try { localStorage.setItem('superclickingLimitSec', limitInput.value); } catch (e) {}
        });

        function getLimitSec() {
            const v = parseFloat(limitInput.value);
            return v > 0 ? Math.min(v, 60) : 4;
        }

        function setMessage(text, cls) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message' + (cls ? ' ' + cls : '');
        }

        // 회차 동그라미: 지난 회차는 맞음/틀림 색, 진행 중이면 지금 회차 강조
        function renderProgress(playing) {
            document.getElementById('progressText').textContent =
                playing ? `총 10회 중 ${attempts + 1}회` : '이번 기록';
            let html = '';
            for (let i = 0; i < 10; i++) {
                let cls = '';
                if (i < history.length) cls = history[i] ? 'ok' : 'fail';
                else if (playing && i === attempts) cls = 'now';
                html += `<span class="${cls}"></span>`;
            }
            document.getElementById('dots').innerHTML = html;
        }

        function startGame() {
            if (attempts >= 10) {
                const result = document.getElementById('result');
                result.innerHTML = `<div>끝!</div><div class="big">${successes}<small> / 10 성공</small></div>`
                    + `<div class="time">총 ${(totalTime / 1000).toFixed(2)}초</div>`;
                result.style.display = 'block';
                gameOverAt = Date.now();
                setMessage('', '');
                document.getElementById('numberDisplay').textContent = '다시 도전?';
                document.getElementById('numberDisplay').style.display = '';
                document.getElementById('captchaCanvas').style.display = 'none';
                document.getElementById('startButton').style.display = '';
                document.getElementById('hint').style.display = '';
                document.getElementById('inputSection').style.display = 'none';
                renderProgress(false);
                attempts = 0;
                successes = 0;
                totalTime = 0;
                return;
            }

            if (attempts === 0) {
                history = [];
                setMessage('', '');
                document.getElementById('result').style.display = 'none';
            }
            randomNumber = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('numberDisplay').style.display = 'none';
            drawCaptcha(randomNumber);
            renderProgress(true);
            document.getElementById('progress').style.display = 'block';
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            document.getElementById('inputSection').style.display = 'flex';
            document.getElementById('userInput').value = '';
            document.getElementById('userInput').focus();
            
            // Record start time
            startTime = new Date();
            const limitMs = getLimitSec() * 1000;

            // Start the timer
            clearTimeout(timer);
            clearInterval(countdownTimer);
            const countdown = document.getElementById('countdown');
            const tick = () => {
                const left = Math.max(0, limitMs - (new Date() - startTime));
                countdown.textContent = (left / 1000).toFixed(1) + '초';
                const hurry = left < 1000;
                countdown.classList.toggle('hurry', hurry);
            };
            tick();
            countdownTimer = setInterval(tick, 50);
            timer = setTimeout(() => {
                clearInterval(countdownTimer);
                setMessage('시간 초과! 다음', 'timeout');
                history.push(false);
                document.getElementById('inputSection').style.display = 'none';
                attempts++;
                startGame();
            }, limitMs);
        }

        // 예매 사이트 보안문자처럼: 회색 그라데이션 바탕 + 그림자 진 굵은 숫자 + 숫자를 가로지르는 선
        function drawCaptcha(text) {
            const W = 280, H = 80;
            const canvas = document.getElementById('captchaCanvas');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = 'auto';
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const rand = (a, b) => a + Math.random() * (b - a);

            const bg = ctx.createLinearGradient(0, 0, W, H * 0.6);
            bg.addColorStop(0, '#2b2b2b');
            bg.addColorStop(0.45, '#9a9a9a');
            bg.addColorStop(1, '#ffffff');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            ctx.font = 'bold 54px Arial Black, Arial, sans-serif';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            const step = 38;
            let x = (W - step * (text.length - 1)) / 2;
            for (const ch of text) {
                ctx.save();
                ctx.translate(x + rand(-2, 2), H / 2 + rand(-4, 4));
                ctx.rotate(rand(-0.15, 0.15));
                ctx.shadowColor = 'rgba(0,0,0,0.55)';
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;
                ctx.shadowBlur = 3;
                ctx.fillStyle = '#111';
                ctx.fillText(ch, 0, 0);
                ctx.restore();
                x += step;
            }

            // 왼쪽 아래에서 오른쪽 위로 뻗는 선 3개(숫자를 덮어 읽기 어렵게)
            ctx.strokeStyle = '#111';
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                ctx.lineWidth = rand(2, 3.5);
                ctx.beginPath();
                ctx.moveTo(rand(30, 110), rand(H * 0.35, H * 0.95));
                ctx.lineTo(W, rand(H * 0.05, H * 0.85));
                ctx.stroke();
            }
        }

        function checkAnswer() {
            const userInput = document.getElementById('userInput').value;
            clearTimeout(timer); // Stop the timer
            clearInterval(countdownTimer);

            const endTime = new Date();
            const elapsedTime = endTime - startTime;
            totalTime += elapsedTime;

            if (userInput === randomNumber) {
                setMessage(`성공! ${(elapsedTime / 1000).toFixed(2)}초`, 'ok');
                successes++;
                history.push(true);
            } else {
                setMessage('실패! 숫자가 틀렸습니다.', 'fail');
                history.push(false);
            }

            document.getElementById('inputSection').style.display = 'none';
            attempts++;
            startGame();
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                event.stopPropagation();
                checkAnswer();
            }
        }

        // 대기 상태(입력창 숨김)에서 엔터를 누르면 Start
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') return;
            const tag = (event.target.tagName || '').toUpperCase();
            if (tag === 'BUTTON' || tag === 'INPUT') return; // 버튼·입력창은 자체 처리(이중 실행 방지)
            if (document.getElementById('inputSection').style.display !== 'none') return;
            if (Date.now() - gameOverAt < 1500) return; // 마지막 답 직후 엔터 연타로 결과가 바로 사라지지 않게

            event.preventDefault();
            startGame();
        });
    </script>
</body>
</html>
