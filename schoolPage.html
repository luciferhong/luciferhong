<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학군 장표</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=9t8y33hyq8"></script>
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; }
  body { font: 13px/1.6 "Malgun Gothic", sans-serif; }
  #note { position: fixed; left: 10px; top: 10px; z-index: 10; background: #fff; padding: 8px 10px; border-radius: 6px; max-width: 560px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #note .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin: 0 3px 0 6px; }
  #note .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  #note select, #note input, #note button { font: inherit; padding: 1px 4px; }
  #note h1 { font-size: 16px; margin: 2px 0; }
  #note .sub { color: #555; }
  #note.min .lg { display: none; }
  #note label.nobg { white-space: nowrap; cursor: pointer; }
  #tbl { position: fixed; right: 10px; top: 10px; z-index: 20; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font: 13px "Malgun Gothic", sans-serif; max-height: calc(100% - 20px); display: flex; flex-direction: column; }
  #tbl .hd { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #e5e7eb; font-weight: bold; }
  #tbl .hd label { margin-left: auto; font-weight: normal; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #tbl .hd label + button { margin-left: 0; }
  #tbl .hd .fs + button { margin-left: 0; }
  #tbl .gc { background: #f8fafc; }
  #tbl tbody tr.up1 td.gc, #tbl tbody tr.up2 td.gc { background: transparent; }
  #tbl td.g4 { border-left: 2px solid #cbd5e1; }
  #tbl .hd button { margin-left: auto; font: inherit; font-weight: normal; padding: 2px 8px; cursor: pointer; }
  #tbl { overflow: auto; }
  #tbl .bd { overflow: auto; flex: none; min-height: 60px; }
  /* 표 높이 조절: 각 표 아래 경계선을 위아래로 끈다 */
  #tbl .rz { flex: none; height: 7px; cursor: ns-resize; background: #e5e7eb; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; position: relative; }
  #tbl .rz::after { content: ""; position: absolute; left: 50%; top: 2px; width: 36px; height: 1px; margin-left: -18px; border-top: 1px solid #94a3b8; border-bottom: 1px solid #94a3b8; }
  #tbl .rz:hover, #tbl .rz.on { background: #cbd5e1; }
  #tbl.fold .rz { display: none; }
  #tbl .hd .fs { display: flex; gap: 2px; }
  #tbl .hd .fs button { margin: 0; padding: 0 6px; }
  #tbl table { border-collapse: collapse; }
  #tbl th, #tbl td { padding: 3px 7px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
  #tbl th { position: sticky; top: 0; background: #f8fafc; cursor: pointer; user-select: none; z-index: 1; }
  #tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #tbl tbody tr { cursor: pointer; }
  #tbl tbody tr.up2 { background: #f8e7b5; }
  #tbl tbody tr.up1 { background: #f8e7b5; }
  #tbl tbody tr:hover { outline: 2px solid #2f4858; outline-offset: -2px; }
  #tbl .gu { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  #tbl .rk { display: inline-block; min-width: 20px; border-radius: 9px; color: #fff; font-weight: bold; text-align: center; }
  #tbl button.rk { font: inherit; font-weight: bold; padding: 0 4px; line-height: 1.35; border: 1.5px solid transparent; cursor: pointer; }
  #tbl th input.rkall { margin: 0 3px 0 0; vertical-align: -2px; cursor: pointer; }
  #tbl button.rk.off { background: #fff !important; color: #b6bac1; border-color: #d4d7dc; }
  #tbl .mid { color: #6a4c93; font-weight: bold; }
  #tbl table:not(.mt) tbody tr.off td:not(:first-child) { opacity: .4; }   /* 중학교 표는 체크 꺼져도 흐리게 하지 않는다 */
  #tbl input[type=checkbox], #sggPop input[type=checkbox] { cursor: pointer; margin: 0; vertical-align: middle; width: 18px; height: 18px; accent-color: #2f4858; }
  #tbl tbody td:first-child, #tbl th.ck { padding: 4px 10px; cursor: pointer; text-align: center; }
  #sggPop label { padding: 3px 4px; }
  #tbl td.hl { white-space: nowrap; text-align: center; }
  #tbl td.hl button { border: 1px solid #e5e7eb; background: #fff; border-radius: 4px; padding: 0 5px; margin: 0 1px; font-size: 15px; line-height: 20px; color: #c9ccd1; cursor: pointer; }
  #tbl td.hl button:hover { border-color: #e0a82e; color: #e0a82e; }
  #tbl td.hl button.on { background: #f8e7b5; border-color: #e0a82e; color: #c88a00; }
  #tbl th button.hlclr { margin-left: 3px; padding: 0 4px; font-size: 11px; line-height: 15px; border: 1px solid #d1d5db; background: #fff; border-radius: 3px; color: #b8332a; cursor: pointer; }
  #tbl th button.hlclr:disabled { color: #ccc; cursor: default; }
  #tbl .mh { padding: 10px 10px 4px; font-weight: bold; border-top: 2px solid #e5e7eb; margin-top: 6px; }
  #tbl .mh span { font-weight: normal; color: #666; font-size: 12px; margin-left: 8px; }
  #tbl table.mt th { cursor: default; }
  #tbl table.mt th[data-mk], #tbl table.mt th:nth-child(2) { cursor: pointer; }
  /* 정렬 가능한 머리 표시(2026-11-05 사용자) — 검은 삼각형 하나: 기본·내림차순 ▼, 오름차순(.asc) ▲ */
  #tbl th.so::after { content: "▼"; color: #000; font-size: 10px; margin-left: 3px; font-weight: normal; }
  #tbl th.so.asc::after { content: "▲"; }
  #tbl.fold .bd { display: none; }
  /* 학년별 학생 수 팝업 — 띄운 창은 맨 위 */
  /* 시군구 여러 개 고르기 — 띄운 창은 맨 위 */
  #sggBox { position: relative; display: inline-block; }
  #selSgg { font: inherit; padding: 1px 6px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; cursor: pointer; }
  #sggPop { position: absolute; left: 0; top: 100%; z-index: 2100; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.35);
    padding: 6px 8px; display: none; max-height: 70vh; overflow: auto; min-width: 190px; font-weight: normal; }
  #sggPop.on { display: block; }
  #note:has(#sggPop.on) { z-index: 2100; }
  #sggPop label { display: flex; align-items: center; gap: 5px; padding: 1px 2px; cursor: pointer; white-space: nowrap; }
  #sggPop label:hover { background: #f1f5f9; }
  #sggPop label.sub { padding-left: 20px; }
  #sggPop .bar { display: flex; gap: 4px; margin-bottom: 4px; }
  #sggPop .bar button { font: 12px "Malgun Gothic", sans-serif; padding: 1px 6px; cursor: pointer; }
  #gpop { position: fixed; z-index: 2000; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.35); padding: 10px 12px; display: none; min-width: 300px; }
  #gpop.on { display: block; }
  #gpop .t { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  #gpop .hlb { display: flex; gap: 4px; align-items: center; margin: 4px 0; font-size: 12px; color: #555; }
  #gpop .hlb button { font: 12px "Malgun Gothic", sans-serif; padding: 1px 8px; border: 1px solid #d1d5db; background: #fff; border-radius: 4px; cursor: pointer; }
  #gpop .hlb button.on { background: #f8e7b5; border-color: #e0a82e; font-weight: bold; }
  #gpop .t button { margin-left: auto; border: 0; background: none; font-size: 16px; cursor: pointer; color: #666; }
  #gpop .s { color: #555; font-size: 12px; margin: 2px 0 6px; }
  #gpop table { border-collapse: collapse; width: 100%; }
  #gpop td, #gpop th { padding: 2px 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #gpop th { font-weight: normal; color: #666; font-size: 12px; border-bottom: 1px solid #e5e7eb; }
  #gpop td.n { text-align: right; }
  #gpop .bar { height: 12px; border-radius: 2px; }
  #gpop tr.jump td { background: #fdf3d8; }
</style>

<body>
<div id="note">
  <div class="ctl">
    <select id="selSido"></select><span id="sggBox"><button id="selSgg" type="button" title="시군구 여러 개 고르기"></button><div id="sggPop"></div></span>
    상위 <input id="topN" type="number" min="1" step="5" value="" placeholder="전체" style="width:46px">곳
    <button id="btnMin" title="범례 접기/펴기">범례</button>
    <label class="nobg" title="체크하면 고른 시군구 바깥을 흰 막으로 지우기"><input type="checkbox" id="chkNoBg">배경지우기</label>
  </div>
  <div class="lg">
    <h1 id="ttl"></h1>
    <div class="sub" id="sub"></div>
    <b style="color:#e0a82e;font-size:16px">★</b> 하이라이트 (표·학교 팝업에서 별을 눌러 켜기/끄기)<br>
    <span class="sw" style="background:#6a4c93"></span>중학교(표에서 골라 지도 표시)
  </div>
</div>
<div id="map"></div>
<script>
// 홍부 데이터로 지역 학군 장표 — 시도·시군구를 고르면 그 지역 초등 전교생 상위 N 곳 + 지역 중학교를 그린다.
// 데이터: eliSchools_lite.json · middleSchools.json · sig_wgs84_30m.geojson · school_district/emd_names.json · school_district/adm/<시군구>.json
// (school_district/ 는 따로 만드는 데이터)
const FONT = "Malgun Gothic, Apple SD Gothic Neo, sans-serif";
const ELI_COLOR = "#2f4858", MID_COLOR = "#6a4c93";
const RANK_BG = r => r <= 10 ? "#c8553d" : r <= 20 ? "#3d6f8e" : r <= 30 ? "#6b8f71" : "#8a7a5c";
const GU_FILL = ["#d6b38a", "#9fbf9a", "#e0cc8e", "#94b4d1", "#c9a3b8", "#b8c48f", "#a7b8d8", "#d9a88f", "#a9c7c0", "#cfb7d9"];
const SIDO = { 11: "서울특별시", 26: "부산광역시", 27: "대구광역시", 28: "인천광역시", 29: "광주광역시", 30: "대전광역시", 31: "울산광역시", 36: "세종특별자치시",
  41: "경기도", 43: "충청북도", 44: "충청남도", 46: "전라남도", 47: "경상북도", 48: "경상남도", 50: "제주특별자치도", 51: "강원특별자치도", 52: "전북특별자치도" };

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const cv = document.createElement("canvas").getContext("2d");
const textW = (t, f) => { cv.font = f; return cv.measureText(t).width; };
const km = (a, b, c, d) => Math.hypot((a - c) * 111, (b - d) * 88.4);

// 홍부 shortSchoolName 과 같은 마커 이름 규칙(마커 글자에만 — 표·제목은 정식 이름).
//   앞의 시도 이름을 떼고(떼면 식별자가 없을 때·부산진은 유지), ○○대학교사범대학부속·부설 → ○○대사대부, 끝 여자중·여자고 → 여중·여고. kind = '초' | '중'
const SCHOOL_SIDO = ["서울", "부산", "대구", "인천", "광주", "대전", "울산", "세종", "경기", "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주"];
// 시도뿐 아니라 고른 시도의 시·군 이름도 뗀다(2026-11-04 사용자: "수원금호초처럼 앞에 수원 붙은 건 불필요" → 금호초).
//   CITY_PFX = 고른 시도의 시·군 이름에서 '시'·'군'을 뗀 것(수원·성남·가평…). 구 이름은 '중'(중구)처럼 짧아 오인이 많아 넣지 않는다.
let CITY_PFX = [];
// 경계 데이터에 구 이름만 있는 시(덕양구·처인구·원미구 …) — 시군구 코드 앞 4자리로 시 이름을 보충
const CITY_BY_CD4 = { 4128: "고양", 4146: "용인", 4119: "부천", 4311: "청주", 4413: "천안", 4511: "전주", 5211: "전주", 4711: "포항", 4812: "창원" };
function setCityPrefixes(sido) {
  const s = new Set();
  for (const g of SIG) {
    if (g.cd.slice(0, 2) !== sido) continue;
    if (CITY_BY_CD4[g.cd.slice(0, 4)]) s.add(CITY_BY_CD4[g.cd.slice(0, 4)]);
    const m = g.nm.match(/^(\S+?)(시|군)(?=\s|$|\S+구$)/);
    if (m && m[1].length >= 2) s.add(m[1]);
  }
  CITY_PFX = [...s].sort((a, b) => b.length - a.length);
}
function shortSchoolName(name, kind) {
  const n = String(name || "").trim();
  let out = n;
  const p = SCHOOL_SIDO.concat(CITY_PFX).find(s => n.startsWith(s) && n.length > s.length);
  if (p && !n.startsWith("부산진")) {
    if (n.includes("대학교사범대학")) out = n.replace("대학교사범대학", "대사범대학");
    else {
      const rest = n.slice(p.length);
      let core;
      if (rest.endsWith(kind)) core = rest.slice(0, -1);
      else { const i = rest.indexOf(kind, 1); core = i > 0 ? rest.slice(0, i) : rest; }
      // 시 이름을 뗄 때는 남는 식별자가 두 글자 이상일 때만(부천남초·수원북중·부천동여자중은 그대로 — '남초'·'북중'은 어느 학교인지 모른다)
      const bare = core.replace(/여자?$/, "");
      const okCity = !CITY_PFX.includes(p) || bare.length >= 2;
      if (!(core === "" || core === "여자" || core === "여") && okCity) out = rest;
    }
  }
  return out.replace(/(대학교|대)사범대학부[속설]/, "대사대부").replace(/여자(중|고)$/, "여$1");
}

// 홍부 _buildSchoolMarkerSvg 와 같은 건물 모양. hl = [앞 숫자 강조색, 뒤 숫자 강조색]
function markerSvg(name, numText, color, hl) {
  const cut = Math.ceil(name.length / 2);
  const nameLines = name.length >= 6 ? [name.slice(0, cut), name.slice(cut)] : [name];
  const two = nameLines.length > 1, NF = two ? 11 : 12, STEP = two ? 11.5 : 13, NUMF = 12;
  const w1 = Math.max(...nameLines.map(t => textW(t, `bold ${NF}px ${FONT}`))) + 14;
  const w2 = textW(numText, `bold ${NUMF}px ${FONT}`) + 12;
  const W = Math.max(44, Math.ceil(Math.max(w1, w2)));
  const flagH = 9, roofH = 10, top = flagH + roofH;
  const nameY0 = two ? 11.5 : 13, lastName = nameY0 + STEP * (nameLines.length - 1);
  const numY = lastName + (two ? 13 : 14), bodyH = numY + 5, H = top + bodyH;
  const cx = W / 2, c = color;
  const [n1, n2] = numText.split(" / ");
  const st = on => on ? `fill="${on}" font-weight="bold"` : "";
  const hA = hl ? hl[0] : null, hB = hl ? hl[1] : null;
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible;">` +
    `<line x1="${cx}" y1="1" x2="${cx}" y2="${flagH + 2}" stroke="${c}" stroke-width="1.5"/>` +
    `<path d="M${cx} 1 h7 l-1.5 2.5 l1.5 2.5 h-7z" fill="${c}"/>` +
    `<path d="M2 ${top} L${cx} ${flagH} L${W - 2} ${top}z" fill="${c}"/>` +
    `<rect x="3" y="${top - 1}" width="${W - 6}" height="${bodyH + 1}" rx="2" fill="${c}"/>` +
    nameLines.map((t, i) => `<text x="${cx}" y="${top + nameY0 + STEP * i}" text-anchor="middle" font-size="${NF}" font-weight="bold" fill="#fff" font-family="${FONT}">${t}</text>`).join("") +
    `<rect x="5" y="${top + lastName + 3}" width="${W - 10}" height="${bodyH - lastName - 5}" rx="2" fill="#fff"/>` +
    `<text x="${cx}" y="${top + numY}" text-anchor="middle" font-size="${NUMF}" fill="#444" font-family="${FONT}">` +
    `<tspan ${st(hA)}>${n1}</tspan> / <tspan ${st(hB)}>${n2}</tspan></text></svg>`;
  return { svg, W, H };
}
function ringCentroid(r) {
  let a = 0, x = 0, y = 0;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
    a += f; x += (r[j][0] + r[i][0]) * f; y += (r[j][1] + r[i][1]) * f;
  }
  return [x / (3 * a), y / (3 * a), Math.abs(a / 2)];
}
function inRing(x, y, r) {
  let o = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) o = !o;
  }
  return o;
}
const toPath = r => r.map(([x, y]) => new naver.maps.LatLng(y, x));
const label = (html, lat, lng, z) => new naver.maps.Marker({ map, clickable: false, zIndex: z, position: new naver.maps.LatLng(lat, lng),
  icon: { content: `<div style="transform:translate(-50%,-50%);white-space:nowrap">${html}</div>`, anchor: new naver.maps.Point(0, 0) } });

const map = new naver.maps.Map("map", { zoom: 12, center: new naver.maps.LatLng(37.497, 127.063) });
let SIG = [], ELI = [], MIDS = [], EMD = {}, MSP = { s: {} };   // MSP = 중학교 [졸업자, 과학고, 외고국제고] (학교알리미)
let OV = [], MK = [], REGION = null, ADM = [];
const keep = o => (OV.push(o), o);
let MASK = null, NOBG = !!store.get("sd:nobg3", false);   // MASK = 고른 지역 바깥 흰 막, NOBG = 배경지우기 체크
const maskOp = () => NOBG ? 0.82 : 0;   // 배경지우기 체크 = 바깥 흰 막(바깥 흐림), 해제 = 흰 막 없음(바깥 지도도 정상)

// ── 지역 고르기 ──
// 시군구 목록: "수원시 영통구" 처럼 구가 있는 시는 '수원시 전체' + 각 구
function regionsOf(sido) {
  const f = SIG.filter(g => g.cd.slice(0, 2) === sido).sort((a, b) => a.nm.localeCompare(b.nm, "ko"));
  const out = [], cities = new Map();
  for (const g of f) {
    const sp = g.nm.split(" ");
    if (sp.length > 1) { if (!cities.has(sp[0])) cities.set(sp[0], []); cities.get(sp[0]).push(g); }
  }
  const done = new Set();
  for (const g of f) {
    const city = g.nm.split(" ")[0];
    if (cities.has(city) && !done.has(city)) {
      done.add(city);
      const gs = cities.get(city);
      out.push({ key: gs.map(x => x.cd).sort().join(","), nm: city, gus: gs });
    }
    if (g.nm.includes(" ")) out.push({ key: g.cd, nm: g.nm, gus: [g], sub: true });
    else out.push({ key: g.cd, nm: g.nm, gus: [g] });
  }
  return out;
}
// 시군구는 체크박스로 여러 개 고른다. SEL = 고른 시군구(구) 코드들
let SGG_LIST = [], SEL = new Set();
// autoFirst: 저장된 선택이 없을 때 첫 항목을 고를지(처음 열 때만). 시도를 바꿀 때는 아무것도 고르지 않는다
//   (2026-11-04 사용자: 경기도로 바꾸면 가평군이 저절로 체크돼 다른 시를 골라도 같이 남았다)
function fillSgg(selKey, autoFirst) {
  SGG_LIST = regionsOf($("selSido").value);
  setCityPrefixes($("selSido").value);
  const ok = new Set(SGG_LIST.flatMap(r => r.gus.map(g => g.cd)));
  SEL = new Set((selKey || "").split(",").filter(c => ok.has(c)));
  if (autoFirst && !SEL.size && SGG_LIST.length) SGG_LIST[0].gus.forEach(g => SEL.add(g.cd));
  renderSgg();
}
function curRegion() {
  if (!SEL.size) return null;
  const gus = SIG.filter(g => SEL.has(g.cd)).sort((a, b) => a.nm.localeCompare(b.nm, "ko"));
  const names = [], covered = new Set();
  for (const r of SGG_LIST) {
    if (r.gus.every(g => covered.has(g.cd)) || !r.gus.every(g => SEL.has(g.cd))) continue;
    names.push(r.nm); r.gus.forEach(g => covered.add(g.cd));
  }
  return { key: gus.map(g => g.cd).sort().join(","), nm: names.join("·"), gus };
}
function renderSgg() {
  const pop = $("sggPop");
  pop.innerHTML = `<div class="bar"><button data-a="none">모두 해제</button></div>` + SGG_LIST.map((r, i) => {
    const n = r.gus.filter(g => SEL.has(g.cd)).length;
    return `<label class="${r.sub ? "sub" : ""}"><input type="checkbox" data-i="${i}"${n === r.gus.length ? " checked" : ""}${n && n < r.gus.length ? " data-ind=1" : ""}>${r.nm}${r.gus.length > 1 ? " 전체" : ""}</label>`;
  }).join("");
  pop.querySelectorAll("input[data-ind]").forEach(x => x.indeterminate = true);

}

// ── 지역 그리기 ──
function draw(keepView) {
  const R = curRegion(); if (!R) return;
  const key = R.key;
  const OVR = store.get("sd:up", {});   // 손으로 고친 별: { schoolCode: 0|1|2 }
  // 상위 N: 기본 빈칸 = 전부, 사용자가 넣은 값이면 그 수만큼(2026-11-05 사용자, 처음 기본 20·상한 60)
  const nRaw = String($("topN").value || "").trim(), N = +nRaw > 0 ? Math.floor(+nRaw) : Infinity;
  store.set("sd:last2", { sido: $("selSido").value, key, n: nRaw });
  OV.forEach(o => o.setMap(null)); OV = []; MK = [];
  if (!keepView) { gpop.classList.remove("on"); clearZone(); }   // 지역이 바뀌면 배정범위·팝업도 지운다
  REGION = R;
  const multi = R.gus.length > 1, oneCity = new Set(R.gus.map(g => g.nm.split(" ")[0])).size === 1;
  const guName = g => !multi ? g.nm.split(" ").pop() : oneCity ? g.nm.split(" ").slice(1).join(" ") : g.nm.split(" ").pop();
  const fillOf = {}; R.gus.forEach((g, i) => fillOf[g.cd] = GU_FILL[i % GU_FILL.length]);

  // 경계: 바깥은 흰 막(지역을 구멍으로), 구별 배경색·이름
  let x0 = 999, y0 = 999, x1 = -999, y1 = -999;
  R.gus.forEach(g => g.rings.forEach(r => r.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); })));
  MASK = keep(new naver.maps.Polygon({ map, clickable: false, zIndex: 0, strokeOpacity: 0, fillColor: "#ffffff", fillOpacity: maskOp(),
    paths: [[new naver.maps.LatLng(y1 + 3, x0 - 3), new naver.maps.LatLng(y1 + 3, x1 + 3), new naver.maps.LatLng(y0 - 3, x1 + 3), new naver.maps.LatLng(y0 - 3, x0 - 3)],
      ...R.gus.flatMap(g => g.rings.map(r => toPath(r).reverse()))] }));
  for (const g of R.gus) {
    keep(new naver.maps.Polygon({ map, clickable: false, zIndex: 1, paths: g.rings.map(toPath),
      strokeColor: "#4b5563", strokeWeight: 2, strokeOpacity: 0.7, fillColor: fillOf[g.cd], fillOpacity: 0.3 }));
    if (multi) {
      const [cx, cy] = g.rings.map(ringCentroid).sort((a, b) => b[2] - a[2])[0];
      keep(label(`<div style="font:bold 16px ${FONT};color:#374151;opacity:.7;letter-spacing:1px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff">${guName(g)}</div>`, cy, cx, 2));
    }
  }

  // 지역 안 초등학교(좌표가 경계 안) → 지역 평균 → 상위 N
  const K = ["first", "second", "third", "fourth", "fifth", "sixth"];
  const all = [];
  for (const s of ELI) {
    const x = s.longitude, y = s.latitude;
    if (!(x >= x0 && x <= x1 && y >= y0 && y <= y1)) continue;
    const g = R.gus.find(g => g.rings.some(r => inRing(x, y, r)));
    if (g) all.push({ s, g, gr: K.map(k => s[k + "YearStudentCount"] || 0), cls: K.map(k => s[k + "YearClassroomCount"] || 0) });
  }
  const T = [0, 1, 2, 3, 4, 5].map(i => all.reduce((a, o) => a + o.gr[i], 0));
  const AVG_TOT = all.length ? all.reduce((a, o) => a + (o.s.totalStudentCount || 0), 0) / all.length : 0;
  const A43 = T[2] ? T[3] / T[2] : 1, AHL = (T[0] + T[1] + T[2]) ? (T[3] + T[4] + T[5]) / (T[0] + T[1] + T[2]) : 1;
  all.sort((a, b) => (b.s.totalStudentCount || 0) - (a.s.totalStudentCount || 0));
  const top = all.slice(0, N).map((o, i) => {
    const g = o.gr, lo = g[0] + g[1] + g[2], hi = g[3] + g[4] + g[5];
    const r43 = g[2] ? g[3] / g[2] : 0, rhl = lo ? hi / lo : 0;
    // 참고값(표·팝업 표시용, 하이라이트와 무관): ex = 4~6학년 − 1~3학년×지역 평균 고/저 비율, cg = 학년당 학급 증가
    const ex = Math.round(hi - lo * AHL);
    const cc = o.cls, cg = (cc[3] + cc[4] + cc[5] - cc[0] - cc[1] - cc[2]) / 3;
    // 하이라이트는 한 가지(★ = 2)로 통일 — 2026-11-04 사용자 지시
    // 자동 하이라이트는 없앴다(2026-11-04 사용자 지시 — 헷갈림). 손으로 켠 학교만 ★
    const code = o.s.schoolCode || o.s.markerId;
    const up = OVR[code] ? 2 : 0;
    const c = MIDS.filter(m => m.ach >= 90).map(m => [km(o.s.latitude, o.s.longitude, m.lat, m.lng), m]).filter(p => p[0] <= 1).sort((a, b) => a[0] - b[0])[0];
    const emd = EMD[String(o.s.cortarNo).slice(0, 8)] || "";
    return { rank: i + 1, name: o.s.schoolName.replace(/등학교$/, ""), total: o.s.totalStudentCount || 0, per: o.s.studentCountPerClassroom,
      lat: o.s.latitude, lng: o.s.longitude, gu: guName(o.g), guFill: fillOf[o.g.cd], loc: `${guName(o.g)} ${emd}`.trim(), up, r43, rhl,
      mid: c ? c[1] : null, dist: c ? c[0] : 0, gr: o.gr, cls: o.cls, ex, cg, code, sgg: String(o.s.cortarNo || "").slice(0, 5) };
  });

  // 마커 — 표에서 체크 해제한 학교는 지도에서 뺀다
  const HIDE = store.get("sd:hide2", {});   // 2026-11-04 키 교체로 한 번 전체 표시로 초기화
  top.forEach(t => t.show = !HIDE[t.code]);
  const RKON = store.get("sd:rkon", {});   // 지도 순위 배지 켠 초등 { schoolCode: 1 } (기본 모두 숨김 — 2026-11-04)
  top.forEach(t => t.rk = !!RKON[t.code]);
  const shown = top.filter(t => t.show);
  const bounds = new naver.maps.LatLngBounds(new naver.maps.LatLng(y0, x0), new naver.maps.LatLng(y1, x1));
  for (const t of shown) {
    const num = `${t.per == null ? "-" : Math.trunc(t.per)} / ${t.total}`;
    MK.push({ kind: "e", t, row: t, rank: t.rank, rk: t.rk, up: t.up, pos: new naver.maps.LatLng(t.lat, t.lng), title: `${t.rank}위 ${t.name} — 학급당 / 전교생 ${num}`, ...markerSvg(shortSchoolName(t.name, "초"), num, ELI_COLOR) });
  }
  // 중학교: 지역 경계 안 전부(성취도 순). 지도에는 체크한 것만 — 기본은 전부(2026-11-04)
  const MOV = store.get("sd:mid2", {}), MUP = store.get("sd:midup", {}), MRKON = store.get("sd:mrkon", {});   // MUP = 중학교 하이라이트 { 학교 ID: 1 } (기본 없음)
  const midRows = [];
  for (const m of MIDS) {
    if (!(m.lng >= x0 && m.lng <= x1 && m.lat >= y0 && m.lat <= y1)) continue;
    const g = R.gus.find(g => g.rings.some(r => inRing(m.lng, m.lat, r))); if (!g) continue;
    midRows.push({ m, id: m.id, name: m.name.replace(/학교$/, ""), ach: m.ach, achT: m.achT, spc: parseFloat(m.spcT) || 0, spcT: m.spcT,
      gu: guName(g), guFill: fillOf[g.cd], loc: guName(g), sp: MSP.s[m.id] || null, lat: m.lat, lng: m.lng, up: MUP[m.id] ? 2 : 0, rk: !!MRKON[m.id], show: MOV[m.id] == null ? true : !!MOV[m.id] });
  }
  midRows.sort((a, b) => b.ach - a.ach || b.spc - a.spc).forEach((x, i) => x.rank = i + 1);
  for (const x of midRows.filter(x => x.show)) {
    const m = x.m, a = String(m.achT).replace("%", ""), b = String(m.spcT).replace("%", "");
    MK.push({ kind: "m", row: x, rank: x.rank, rk: x.rk, up: x.up, pos: new naver.maps.LatLng(m.lat, m.lng), title: `${m.name} — 학업성취도 / 특목고 ${a} / ${b}`,
      ...markerSvg(shortSchoolName(m.name.replace(/학교$/, ""), "중"), `${a} / ${b}`, MID_COLOR, [+a >= 90 ? "#b8332a" : null, +b >= 4 ? "#2c5d8f" : null]) });
  }
  MK.forEach(m => {
    m.marker = keep(new naver.maps.Marker({ position: m.pos, map, zIndex: m.kind === "m" ? 90 : 100, title: m.title, cursor: m.kind === "e" ? "pointer" : "default" }));
    if (m.kind === "e") naver.maps.Event.addListener(m.marker, "click", e => { const pe = e.pointerEvent || e.domEvent; showGrades(m.t, pe ? pe.clientX : innerWidth / 2, pe ? pe.clientY : innerHeight / 2); });
  });
  AVG = { A43, AHL, TOT: AVG_TOT };
  // 초등→중학교 점선은 그리지 않는다(실제 배정이 확실하지 않음)

  // 제목·범례
  $("ttl").textContent = `${R.nm} 초등학교 전교생 많은 ${top.length}곳`;
  $("sub").innerHTML = `숫자 = 학급당 / 전교생 · 표의 순위 번호를 눌러 지도 순위 표시 켜기/끄기 · 학교 평균 전교생 ${Math.round(AVG_TOT)} (초등 ${all.length}곳)`;
  document.title = `학군 장표 — ${R.nm}`;
  if (!keepView) map.fitBounds(bounds, { top: 80, right: 30, bottom: 30, left: 30 });
  TOP = top;
  drawTable(top, midRows);
  setTimeout(declutter, 300);
  loadAdm(R).then(() => {
    // 중학교 위치에 행정동 이름 보태기(행정동 경계를 받은 뒤)
    midRows.forEach(x => { const a = ADM.find(a => a[2].some(r => inRing(x.lng, x.lat, r))); if (a) x.loc = `${x.gu} ${a[1]}`.trim(); });
    if (TMID === midRows) midBody();
  });
}

// ── 겹침 풀기(줌마다) ──
const GLOW = { 2: "drop-shadow(0 0 2px #f2c14e) drop-shadow(0 0 2px #f2c14e) drop-shadow(0 0 4px #e0a82e)", 1: "drop-shadow(0 0 2px #f6dfa3) drop-shadow(0 0 3px #f2d27a)" };
const SHADOW = "drop-shadow(0 1px 1.5px rgba(0,0,0,.35))";
const GAP = 4;
function declutter() {
  const proj = map.getProjection(); if (!proj || !MK.length) return;
  const n = MK.length;
  const P = MK.map(m => proj.fromCoordToOffset(m.pos));
  const ox = new Array(n).fill(0), oy = new Array(n).fill(0);
  for (let it = 0; it < 300; it++) {
    let moved = false;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = MK[i], b = MK[j];
      const dx = (P[j].x + ox[j]) - (P[i].x + ox[i]), dy = (P[j].y + oy[j]) - (P[i].y + oy[i]);
      const px = (a.W + b.W) / 2 + GAP - Math.abs(dx), py = (a.H + b.H) / 2 + GAP - Math.abs(dy);
      if (px <= 0 || py <= 0) continue;
      moved = true;
      if (py <= px * 1.5) { const s = (dy > 0 || (dy === 0 && i < j) ? 1 : -1) * (py / 2 + 0.5); oy[i] -= s; oy[j] += s; }
      else { const s = (dx >= 0 ? 1 : -1) * (px / 2 + 0.5); ox[i] -= s; ox[j] += s; }
    }
    if (!moved) break;
  }
  MK.forEach((m, i) => {
    const ax = m.W / 2 - ox[i], ay = m.H / 2 - oy[i];
    const lc = m.kind === "m" ? MID_COLOR : ELI_COLOR;
    const lead = Math.hypot(ox[i], oy[i]) > 6 ? `<svg style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="1" height="1">
        <line x1="${ax}" y1="${ay}" x2="${m.W / 2}" y2="${m.H / 2}" stroke="${lc}" stroke-width="1.2"/>
        <circle cx="${ax}" cy="${ay}" r="3.5" fill="${lc}" stroke="#fff" stroke-width="1.2"/></svg>` : "";
    const badge = m.rk ? `<div style="position:absolute;left:3px;top:-2px;min-width:24px;height:24px;padding:0 4px;box-sizing:border-box;border-radius:12px;background:${m.kind === "m" ? MID_COLOR : ELI_COLOR};border:2px solid #fff;color:#fff;font:bold 14px/20px ${FONT};text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.3)">${(m.row && m.row.dr) || m.rank}</div>` : "";
    // 별은 마커 왼쪽에 겹쳐 붙인다(사용자 지시: 겹쳐도 됨). 마커·순위 배지보다 먼저 그려 숫자를 가리지 않게 한다
    const star = m.up ? `<div style="position:absolute;left:-28px;top:-17px;font:46px/1 ${FONT};color:#f2b01e;-webkit-text-stroke:2px #8a5a00;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none">${m.up === 2 ? "★" : "☆"}</div>` : "";
    m.marker.setIcon({
      content: `<div style="position:relative;width:${m.W}px;height:${m.H}px">${lead}${star}<div style="position:relative;filter:${GLOW[m.up] || SHADOW}">${m.svg}</div>${badge}</div>`,
      anchor: new naver.maps.Point(ax, ay),
    });
  });
}
naver.maps.Event.addListener(map, "zoom_changed", () => setTimeout(declutter, 0));

// ── 표 ──
const tbl = document.createElement("div");
tbl.id = "tbl";
document.body.appendChild(tbl);
let TFS = store.get("sd:tblfs", 13), TKEY = "rank", TASC = true, TROWS = [], TSRC = [], TMID = [], GRD = store.get("sd:grades", false);   // GRD = 학년별 학생 수 칸 보이기

  const rkAll = (inp, list, key, id) => {

    inp.onclick = e => { e.stopPropagation(); const o = store.get(key, {}); list.forEach(x => inp.checked ? o[x[id]] = 1 : delete o[x[id]]); store.set(key, o); draw(true); };

  fetch("eliSchools_lite.json").then(r => r.json()),
  fetch("middleSchools.json").then(r => r.json()),
  fetch("school_district/emd_names.json").then(r => r.json()).catch(() => ({})),
  fetch("school_district/mid_special.json").then(r => r.json()).catch(() => ({ s: {} })),
]).then(([sig, eli, mid, emd, msp]) => {
  MSP = msp;
  SIG = sig.features.map(f => {
    const g = f.geometry, polys = g.type === "MultiPolygon" ? g.coordinates : [g.coordinates];
    return { cd: f.properties.sgg_cd, nm: f.properties.sgg_nm, rings: polys.map(p => p[0]) };
  });
  ELI = eli.schools.filter(s => s.latitude && s.longitude);
  const seen = new Set();
  MIDS = mid.filter(m => !seen.has(m["학교명"] + m["위도"]) && seen.add(m["학교명"] + m["위도"])).map(m => ({
    id: m["학교 ID"] || m["학교명"] + m["위도"], name: m["학교명"], achT: m["학업성취도"], spcT: m["특목고"], ach: parseFloat(m["학업성취도"]) || 0, lat: +m["위도"], lng: +m["경도"] }));
  EMD = emd;
  const sidos = [...new Set(SIG.map(g => g.cd.slice(0, 2)))].sort();
  $("selSido").innerHTML = sidos.map(s => `<option value="${s}">${SIDO[s] || s}</option>`).join("");
  // 처음 여는 사람은 서울 강남구. 옛 키 sd:last 에는 예전 기본값(수원)이 저장돼 있어 sd:last2 로 바꿨다(2026-11-04)
  const last = store.get("sd:last2", { sido: "11", key: "11680" });
  $("selSido").value = last.sido; $("topN").value = last.n || "";   // 옛 저장값 N(20)은 무시 — 기본 빈칸
  fillSgg(last.key, true);
  $("selSido").onchange = () => { fillSgg(); setTimeout(() => $("sggPop").classList.add("on"), 0); };   // 고를 목록을 바로 펼친다
  $("selSgg").onclick = e => { e.stopPropagation(); $("sggPop").classList.toggle("on"); };
  $("sggPop").onclick = e => e.stopPropagation();
  document.addEventListener("click", () => $("sggPop").classList.remove("on"));
  $("sggPop").onchange = e => {
    const r = SGG_LIST[+e.target.dataset.i]; if (!r) return;
    r.gus.forEach(g => e.target.checked ? SEL.add(g.cd) : SEL.delete(g.cd));
    sggChanged();
  };
  $("sggPop").addEventListener("click", e => { if (e.target.dataset.a === "none") { SEL.clear(); renderSgg(); } });
  $("topN").onchange = draw;
  draw();
}).catch(e => { console.error(e); alert("데이터를 불러오지 못했습니다: " + e); });
</script>
</body>
