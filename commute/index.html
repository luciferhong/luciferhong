<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출근 목적지 보기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ecef; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
         padding: 10px 16px; background: #1f3864; color: #fff; font-size: 15px; }
  .bar select { font-size: 15px; padding: 4px 6px; }
  .bar label { cursor: pointer; }
  .bar button { font-size: 14px; padding: 4px 10px; cursor: pointer; }
  .nav { display: flex; gap: 4px; }
  .wrap { padding: 16px; }
  .frame { width: 1200px; height: 675px; transform-origin: 0 0; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .src { padding: 0 16px 20px; font-size: 13px; color: #444; }
  .src a { color: #1f3864; }
  .frame iframe { width: 1200px; height: 675px; border: 0; display: block; }
</style>
<script src="commute_data.js"></script>
</head>
<body>
<div class="bar">
  <span>지역</span>
  <span class="nav"><button id="prev" title="이전 지역">◀</button><select id="sel"></select><button id="next" title="다음 지역">▶</button></span>
  <span>관내 출근</span>
  <label><input type="radio" name="in" value="1"> 포함</label>
  <label><input type="radio" name="in" value="0" checked> 불포함</label>
  <button id="open" title="슬라이드만 새 탭으로 (캡처용)">새 탭으로 열기</button>
</div>
<div class="wrap"><div class="frame" id="frame"><iframe id="ifr"></iframe></div></div>
<div class="src">출처 : 서울특별시 · KT「수도권 생활이동 (출발-도착지 기준)」, <a href="https://data.seoul.go.kr/dataList/OA-22300/F/1/datasetView.do" target="_blank" rel="noopener">https://data.seoul.go.kr/dataList/OA-22300/F/1/datasetView.do</a> (서울 열린데이터광장) · 공공누리 제1유형(출처표시) · 출근 목적 이동을 출발 시군구별로 집계·가공</div>
<script>
(function () {
  var D = window.OD, sel = document.getElementById('sel'), ifr = document.getElementById('ifr');
  var codes = Object.keys(D.targets).sort();
  codes.forEach(function (c) {
    var t = D.targets[c], o = document.createElement('option');
    o.value = c; o.textContent = (c.slice(0, 2) === '11' ? '서울 ' : '경기 ') + t[1];
    sel.appendChild(o);
  });
  var st = {};
  try { st = JSON.parse(localStorage.getItem('commute_od_viewer') || '{}'); } catch (e) {}
  if (st.c && D.targets[st.c]) sel.value = st.c; else sel.value = '11620';
  if (st.in) document.querySelector('input[name=in][value="' + st.in + '"]').checked = true;

  function inVal() { return document.querySelector('input[name=in]:checked').value; }
  function url() { return 'slide.html?c=' + sel.value + '&in=' + inVal(); }
  function draw() {
    ifr.src = url();
    try { localStorage.setItem('commute_od_viewer', JSON.stringify({ c: sel.value, in: inVal() })); } catch (e) {}
  }
  function fit() {
    var w = Math.min(1, (window.innerWidth - 32) / 1200), f = document.getElementById('frame');
    f.style.transform = 'scale(' + w + ')';
    f.parentNode.style.height = (675 * w + 32) + 'px';
  }
  function step(d) { var i = codes.indexOf(sel.value); sel.value = codes[(i + d + codes.length) % codes.length]; draw(); }
  sel.onchange = draw;
  document.querySelectorAll('input[name=in]').forEach(function (r) { r.onchange = draw; });
  document.getElementById('prev').onclick = function () { step(-1); };
  document.getElementById('next').onclick = function () { step(1); };
  document.getElementById('open').onclick = function () { window.open(url(), '_blank'); };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  window.addEventListener('resize', fit);
  fit(); draw();
})();
</script>
</body>
</html>
